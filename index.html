lectric Cars Tipping Point"}, {"id": "reading-10", "unit": 3, "skill": "Reading", "title": "Text 10", "label": "Text 10", "pages": [46, 47], "text": "                                Text 10\n     Reading\n\n                  ________________ (See the appropriate question.)\n\n     Geothermal energy (geothermal, from the Greek geo (earth) and therme (heat)) is\n      heat that exists within our planet. Created both during our planet’s primordial past,\n       in its formation period, and from the decay of radioactive elements, its temperature\n      increases according to depth, a phenomenon known as the geothermal gradient. In\n 5    the UK, for example, the geothermal gradient is estimated at around 27°C/km. For\n      every 1,000 metres’ depth,  the temperature  rises by 27°C. This  rise continues\n     through the Earth’s four major layers:\n             ▪  The crust, a layer of solid rock 25 to 55 kilometres thick at the continents\n              and 5 to 8 kilometres thick at the ocean floor.\n 10         ▪  The mantle, a layer of magma (hot molten rock) and cooler rock about 3,000\n               kilometres thick.\n             ▪  The outer core, a layer of pure magma about 2,500 kilometres thick.\n             ▪  Finally, an inner core of solid iron about 2,500 kilometres in diameter.\n     The temperature within the Earth reaches as high as 5982°C, as hot as the surface of\n 15   the Sun.\n\n     ________________  (See  the  appropriate  question.)  There  are  areas  where\n     geothermal energy exists far closer to the surface, sometimes escaping into the\n     environment. Volcanoes release geothermal energy when they erupt (Mount Fuji, in\n 20   Japan, Popocatépetl in Mexico). Water heated by geothermal energy emer ges to the\n      surface  at hot springs (Al-Jobah hot water spring in Wadi Ad-Dawasir in Saudi\n      Arabia, Matlock in Derbyshire, the UK). There are also areas where geothermal\n      reservoirs are common. These are pockets of superheated water and steam trapped\n      within the Earth.\n     Humanity has been making use of this heat energy for thousands of years. There is\n     evidence that Native Americans used geothermal energy (in the form of hot spring\n      water) for cooking, washing and warmth 10,000 years ago. The Ancient Romans,\n     Chinese and Greeks also used hot springs  for bathing. The Romans even used\n 30  geothermal energy not only for bathing, but also for direct space -heating of their\n       villas, a form of ancient central heating. More recently, humanity has begun to utilize\n     geothermal energy to generate electricity, converting naturally occ urring heat energy\n      into kinetic energy and then into electrical energy: the world’s  first geothermal\n     power station was established at Lardarello in Tuscany, Italy in 1904. Producing\n 35  10% of the world’s supply of geothermal energy,  it now powers about a million\n       Italian households. Since its development, 26 other countries have begun to generate\n     geothermal electricity, including Indonesia, Kenya and the United States. Of these,\n      the United  States  is  the world  leader, with  the Geysers Geothermal Complex\n      (consisting of 15 separate power plants) the largest geothermal installation in the\n 40   world. Although geothermal electricity currently counts for only a s mall fraction of\n      the world’s energy consumption, it is feasible to expand this to 8.3%.\n\n     There are three main types of geothermal power plants. These are, firstly, dry steam\n      plants. These take steam directly from a geothermal reservoir to turn a turbine to\n 45   generate electricity. Secondly, there are flash steam plants. These take high -pressure\n      hot water from deep within the Earth, and then convert  it to steam which turns a\n      turbine to generate electricity. Finally, there are binary cycle power plants. These\n      use the heat energy in water from geothermal reservoirs to heat a secondary liquid\n     which has a lower boiling point than water. The steam from the secondary liquid\n 50   then turns the turbine to generate electricity.\n", "questions": [{"n": 1, "stem": "The adjective primordial (Line 2) means ______.", "options": ["connected with the beginning of the world or universe", "first spoken during a period of ancient civilisations", "happening during the most famous period of history", "very deep within the Earth"], "key": 0, "explanation": "connected with the beginning of the world or universe – \"Primordial\" refers to Earth's formation period"}, {"n": 2, "stem": "In the United Kingdom, at a depth of 10,000 metres into the ground, the temperature is MOST likely to be about ______.", "options": ["0°C", "27°C", "270°C", "5982°C"], "key": 2, "explanation": "270°C – Geothermal gradient in UK is 27°C per km, so at 10 km depth: 27 × 10 = 270°C"}, {"n": 3, "stem": "What is the BEST SENTENCE to BEGIN Paragraph Two (Lines 17 – 24)?", "options": ["A well is being dug that will reach the Earth’s core.", "However, the geothermal gradient varies greatly.", "Japan has always been famous as an earthquake zone.", "Scientists have also studied the sun’s temperatures."], "key": 1, "explanation": "However, the geothermal gradient varies greatly – Paragraph Two introduces areas where geothermal energy is closer to the surface"}, {"n": 4, "stem": "What is the MAIN SUBJECT of Paragraph Three (Lines 26 – 41)?", "options": ["Different ways in history in which people have used geothermal energy.", "How Native Americans used geothermal energy 10,000 years ago.", "The first examples in history of washing and using central heating.", "The use of geothermal energy by ancient civilisations such as the Romans."], "key": 0, "explanation": "Different ways in history in which people have used geothermal energy – Paragraph Three covers Native Americans, Romans, Chinese, Greeks, and modern electricity generation"}, {"n": 5, "stem": "Paragraph Three (Lines 26 – 41) DOES NOT STATE or IMPLY that ______.", "options": ["27 countries generate electricity using geothermal energy", "8.3% of the world’s electricity comes from geothermal generation", "geothermal energy has been used for electricity generation since 1904", "the Romans used geothermal energy to heat their homes"], "key": 1, "explanation": "8.3% of the world's electricity comes from geothermal generation – The text says it is feasible to expand to 8.3%, not that it currently produces that much"}, {"n": 6, "stem": "The Geysers Geothermal Complex is in ______.", "options": ["Indonesia", "Italy", "Kenya", "the United States"], "key": 3, "explanation": "the United States – The Geysers Geothermal Complex is in the US, the world leader"}, {"n": 7, "stem": "Binary cycle power plants ______.", "options": ["are only used where geothermal reservoirs are not available", "do not use a turbine to generate electricity", "heat one liquid with the heat from another liquid", "use steam direct from the earth to move a turbine"], "key": 2, "explanation": "heat one liquid with the heat from another liquid – Binary cycle plants use geothermal water to heat a secondary liquid with a lower boiling point"}, {"n": 8, "stem": "What does which in Line 49 refer to?", "options": ["a secondary liquid", "the heat energy", "the heat energy in water", "water from geothermal reservoirs"], "key": 2, "explanation": "the heat energy in water – \"Which\" refers to the heat energy in water from geothermal reservoirs"}, {"n": 9, "stem": "What is MOST LIKELY to be the MAIN SUBJECT of the paragraph AFTER Paragraph Five (Lines 43 – 50)?", "options": ["Advantages and disadvantages of geothermal electricity generation.", "Some of the main ways in which the Romans used geothermal energy.", "The locations of the world’s most dangerous volcanoes and hot springs.", "The main current causes and effects of global climate change."], "key": 0, "explanation": "Advantages and disadvantages of geothermal electricity generation – The text has described how it works; next logical is pros/cons"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Ancient Greek Studies of Our Planet", "Geothermal Energy: Making Use of It", "What Our Planet Is Mainly Made Of", "Volcanoes and Hot Springs Around the World"], "key": 1, "explanation": "Geothermal Energy: Making Use of It – The article explains what geothermal energy is and how humans have used it"}], "vocab": [{"word": "geothermal", "meta": "C1, adjective · AWL", "meaning": "relating to the internal heat of the Earth primordial (C2, adjective) – existing from the beginning of time; ancient and original", "group": "Text 10", "page": 232}, {"word": "formation", "meta": "B2, noun · AWL", "meaning": "the process by which something is created or takes shape", "group": "Text 10", "page": 232}, {"word": "decay", "meta": "B2, noun/verb · AWL", "meaning": "the gradual breakdown or decomposition of a substance", "group": "Text 10", "page": 232}, {"word": "radioactive", "meta": "B2, adjective", "meaning": "emitting energy as a result of the decay of unstable atomic nuclei", "group": "Text 10", "page": 232}, {"word": "gradient", "meta": "C1, noun", "meaning": "the rate at which something changes over distance", "group": "Text 10", "page": 232}, {"word": "layer", "meta": "B2, noun", "meaning": "a sheet, level, or thickness of material, often one of several", "group": "Text 10", "page": 232}, {"word": "mantle", "meta": "C1, noun", "meaning": "the layer of the Earth between the crust and the core", "group": "Text 10", "page": 232}, {"word": "core", "meta": "B2, noun · AWL", "meaning": "the central part of the Earth", "group": "Text 10", "page": 232}, {"word": "volcano", "meta": "B2, noun", "meaning": "a mountain through which lava, ash, and gases erupt", "group": "Text 10", "page": 232}, {"word": "erupt", "meta": "B2, verb", "meaning": "to explode or burst out violently, especially of a volcano", "group": "Text 10", "page": 232}, {"word": "reservoir", "meta": "C1, noun", "meaning": "a natural or artificial underground pool or storage area", "group": "Text 10", "page": 232}, {"word": "evidence", "meta": "B2, noun · AWL", "meaning": "facts or information indicating whether a belief or proposition is true", "group": "Text 10", "page": 232}, {"word": "utilize", "meta": "C1, verb · AWL", "meaning": "to make practical use of something", "group": "Text 10", "page": 232}, {"word": "generate", "meta": "B2, verb · AWL", "meaning": "to produce or create something, especially energy or power", "group": "Text 10", "page": 232}, {"word": "consumption", "meta": "B2, noun · AWL", "meaning": "the using up of a resource, especially energy or fuel", "group": "Text 10", "page": 233}], "vocabularyPages": [232, 233], "topic": "Geothermal Energy"}, {"id": "reading-11", "unit": 3, "skill": "Reading", "title": "Text 11", "label": "Text 11", "pages": [48, 49], "text": "                                         Text 11\n     Reading\n\n             ________________ (See the appropriate question.)\n\n    A phenomenon exists in nature known as the photovoltaic effect. First\n     demonstrated in 1839 by physicist Edmond Becquerel,  it results from\n      the interaction of light and certain materials. When these materials absorb light, the\n     behaviour of electrons within them changes. (To use the term in physics, there is\n 5    excitation of electrons.) If the light is strong enough, electricity is generated. The\n      photovoltaic effect is the basis of all solar energy generation: the conversion of light\n     energy into electrical energy.\n\n     Although solar electricity generation was understood as a concept,  it was not until\n 10  1884 that the  first workable solar cell was produced. Built by Charles Fritts,  it\n      consisted of a layer of selenium covered with a thin film of gold. While generating\n      a current, it had a very poor efficiency of only 1%. Then, in 1888, Russian physicist\n     Aleksandr Stoletov further advanced solar cell technology. His designs of solar cells\n     were  influenced by  his  research  into  the  outer  photoelectric  effect. The  next\n 15  landmark in the development of solar power took place in 1905: Albert Einstein\n     published a paper in which he explained aspects of the photovoltaic effect, for which\n     he was awarded the 1921 Nobel Prize. In 1946, Russell Ohl patented the world’s first\n     semi-conductor solar  cell. Then, in April, 1954, researchers at Bell Laboratories\n     demonstrated  the  first  world’s  first  practical  silicon  solar  cell.  Solar power\n 20  technology with real-world uses was finally in business.\n\n     ________________ (See the appropriate question.) Satellites need\n     power. However, sending batteries into space with enough power for\n      the entire voyage  is impossible: the weight  is too high. Nor  is  it\n 25  possible  to  send  a  conventional  generator.  Fossil  fuels  cannot\n      realistically be burned in space. The solution is to use solar energy.\n        It enables satellites to generate their own power. Since NASA’s earliest days, solar\n     power has been utilized. Vanguard 1, launched 17 March 1958, was the world’s\n      fourth artificial satellite. Its electrical components were pow ered by six solar cells\n 30  mounted on its body. Use of solar power massively extended mission time: contact\n     with Vanguard 1 was maintained until May 1964. In 1959, NASA launched Explorer\n       6, which was powered by two large wing-shaped solar arrays, a feature shared by\n     contemporary satellite design. The International Space Station is powered by dual\n      solar panels, each with an area of 420 square metres.\n     However, with concerns over climate change and the negative environmental impact\n                    of fossil fuel combustion, humanity’s focus is now on using solar power\n                     to generate energy here on Earth. Over the last 20 years, there has been\n                 exponential growth in the generation of solar electricity. In the year\n 40               2,000, world solar generation stood at 1.07 terawatt hours. In 2005, 3.84\n                   terawatt hours. In 2010, 30.52 terawatt hours. In 254.67 terawatt hours.\n      In 2020, 844.39 terawatt hours. All of this has been enabled by the dizzyingly rapid\n      construction  of  truly  elephantine  solar energy  plants. At  the time  of  writing,\n     November 2021, the world’s largest solar power plant is India’s Bhadla Solar Park.\n 45  Covering a colossal 160 square kilometres,  it has a capacity of\n     2,700 MW. But it is not only solar plants that have seen a massive\n      increase in use. Individual domestic solar electricity generation\n      has also risen enormously in popularity. Solar panels on suburban\n      rooftops are an increasingly common sight.\n", "questions": [{"n": 1, "stem": "What is the MAIN SUBJECT of Paragraph One (Lines 1 – 7)?", "options": ["Edmond Becquerel.", "Light.", "Nature.", "The photovoltaic effect."], "key": 3, "explanation": "The photovoltaic effect – Paragraph One defines and explains the photovoltaic effect as the basis of solar energy"}, {"n": 2, "stem": "What is the MAIN SUBJECT of Paragraph Two (Lines 9 – 20)?", "options": ["The concept of solar energy generation.", "The key early developments in solar power.", "The main scientists behind solar power.", "The world’s first workable solar cell."], "key": 1, "explanation": "The key early developments in solar power – Paragraph Two lists discoveries from Becquerel (1839) to Bell Labs (1954"}, {"n": 3, "stem": "The device built by Charles Fritts ______.", "options": ["contained a centre made of pure gold", "produced a measurable electric current", "utilized theories of the outer photoelectric effect", "was unable to power 99% of electric devices"], "key": 1, "explanation": "produced a measurable electric current – Fritts' cell generated a current, though efficiency was only 1%"}, {"n": 4, "stem": "In what year was a solar cell built that would be genuinely useful?", "options": ["1888", "1905", "1946", "1954"], "key": 3, "explanation": "1954 – Bell Labs demonstrated the first practical silicon solar cell, making solar power useful for real -world applications"}, {"n": 5, "stem": "What is the BEST SENTENCE to BEGIN Paragraph Three (Lines 22 – 34)?", "options": ["A rocket’s escape velocity is the speed required to escape the Earth’s gravity.", "Another form of energy is that used to propel rockets.", "Climate change was as yet unknown, so few realised the importance of solar energy.", "The first of these was in space."], "key": 3, "explanation": "The first of these was in space – Paragraph Three discusses solar power in space, beginning with Vanguard 1"}, {"n": 6, "stem": "Paragraph Three (Lines 22 – 34) DOES NOT STATE or IMPLY that ______.", "options": ["experiments in sending fossil fuel generators into space ended in failure", "satellites need to generate their own electricity because batteries weigh too much", "the International Space Station has about 840 m 2 of solar panels", "the use of solar power on satellites means they can be used for much longer"], "key": 0, "explanation": "experiments in sending fossil fuel generators into space ended in failure – The text does not mention any such experiments"}, {"n": 7, "stem": "We can INFER that India’s Bhadla Solar Park ______.", "options": ["generated 844.39 terawatt hours in 2020", "has a length of 160 kilometres", "may not be the world’s largest for very long", "was built in an area previously reserved for elephants"], "key": 2, "explanation": "may not be the world's largest for very long – The text says \"at the time of writing, November 2021\" it was largest, implying it could be surpassed"}, {"n": 8, "stem": "Exponential (Line 39) describes ______.", "options": ["a fall in something’s cost as it becomes more common", "a rate of growth that increases with time", "an increasing level of experimentation", "something that spreads all over the world"], "key": 1, "explanation": "a rate of growth that increases with time – Exponential growth means rapidly increasing over time"}, {"n": 9, "stem": "What is MOST LIKELY to be the MAIN SUBJECT of the paragraph AFTER Paragraph Four (Lines 36 - 49)?", "options": ["Generating electricity using wind.", "Generating solar power at home.", "Solar power and climate change.", "Solar power plants in Europe."], "key": 2, "explanation": "Solar power and climate change – Paragraph Four ends with focus on Earth use due to climate change; next likely continues that"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Electricians of the 19 th and 20th Centuries", "Solar Power Electricity Generation", "Strange Phenomena Found in Nature", "The Best Alternatives to Fossil Fuels"], "key": 1, "explanation": "Solar Power Electricity Generation – The article covers history, space applications, and current terrestrial use of solar power"}], "vocab": [{"word": "photovoltaic", "meta": "C1, adjective", "meaning": "relating to the process by which light generates an electric current", "group": "Text 11", "page": 233}, {"word": "interaction", "meta": "B2, noun · AWL", "meaning": "the way two or more things affect each other", "group": "Text 11", "page": 233}, {"word": "absorption", "meta": "B2, noun · AWL", "meaning": "the process of taking in or soaking up energy or matter", "group": "Text 11", "page": 233}, {"word": "excitation", "meta": "C1, noun", "meaning": "the process of raising electrons to a higher energy level", "group": "Text 11", "page": 233}, {"word": "conversion", "meta": "B2, noun · AWL", "meaning": "the process of changing something from one form to another", "group": "Text 11", "page": 233}, {"word": "workable", "meta": "B2, adjective", "meaning": "capable of functioning effectively or being put into practice", "group": "Text 11", "page": 233}, {"word": "efficiency", "meta": "B2, noun · AWL", "meaning": "the ratio of useful output to total input, often expressed as a percentage", "group": "Text 11", "page": 233}, {"word": "patent", "meta": "B2, verb · AWL", "meaning": "to obtain the exclusive legal right to make, use, or sell an invention", "group": "Text 11", "page": 233}, {"word": "semi-conductor", "meta": "B2, noun", "meaning": "a material that conducts electricity better than an insulator but worse than a conductor", "group": "Text 11", "page": 233}, {"word": "extend", "meta": "B2, verb · AWL", "meaning": "to make something last longer in time", "group": "Text 11", "page": 233}, {"word": "combustion", "meta": "B2, noun · AWL", "meaning": "the process of burning, especially as a chemical reaction producing heat", "group": "Text 11", "page": 233}, {"word": "exponential", "meta": "C1, adjective · AWL", "meaning": "increase that becomes more rapid in proportion to the growing total number", "group": "Text 11", "page": 233}, {"word": "colossal", "meta": "C1, adjective", "meaning": "extraordinarily large in size or scale", "group": "Text 11", "page": 233}, {"word": "capacity", "meta": "B2, noun · AWL", "meaning": "the maximum amount of electrical power a plant can produce", "group": "Text 11", "page": 233}, {"word": "enormously", "meta": "B2, adverb", "meaning": "to a very great degree or extent", "group": "Text 11", "page": 233}, {"word": "suburban", "meta": "B2, adjective", "meaning": "relating to a residential area on the outskirts of a city", "group": "Text 11", "page": 233}], "vocabularyPages": [233], "topic": "Solar Power"}, {"id": "reading-12", "unit": 3, "skill": "Reading", "title": "Text 12", "label": "Text 12", "pages": [51, 52], "text": "                                                      Text 12\n     Reading\n\n                    ________________ (See the appropriate question.)\n\n      80% of the world’s energy comes from fossil fuels, and this is a problem. It is not\n         just that supplies are finite; when fossil fuels are burnt, they release carbon dioxide\n       (CO2) into the atmosphere, and this is the primary cause of climate change. If we\n       do not reduce the amount of fossil fuels we consume, temperatures on our planet\n 5      will rise dangerously. To put it into perspective, according to Chicago University’s\n        Professor Michael Greenstone, if we were to consume all existing supplies of fossil\n         fuels, global temperatures would rise by 16 0C, which would probably mean human\n        extinction.\n\n 10     Clearly, we need  to reduce our  fossil fuel energy generation. But demand for\n         electricity is forecast to rise by 56% by the year 2040. So what alternatives are\n        there? There are many advocates of wind and solar energy. However, critics argue\n         that solar energy cannot be relied upon because, in Europe at least, the sun is so\n        often shrouded in cloud. And wind energy depends on ugly wind -power turbines,\n 15    which disfigure the landscape. Opponents of renewables claim they are expensive\n       and impractical, able to generate some of our energy but insufficient to supply the\n        planet’s current and projected energy needs. So what is the best alternative to fossil\n        fuels? For many, there is only one game in town: nuclear energy.\n\n 20     Fossil fuels contain a store of chemical energy. When burnt, their chemical energy\n          is converted into heat energy, which is used to boil water, turning it into steam. The\n        heat energy has been converted into kinetic energy, which a turbine then converts\n        into electrical energy. The process for nuclear energy generation is similar except\n        for the following: nuclear energy relies not on the burning of a substance to convert\n 25    chemical energy to heat energy, but on fission, the splitting of atoms. Because there\n          is no fire, there is no smoke. There are no emissions of gases that pollute the air we\n        breathe, nor of carbon dioxide, the primary cause of global warming.\n\n       ________________ (See the appropriate question.) The science was developed in\n 30     the 1940s, and the world’s  first nuclear power  station,  at the Russian  city of\n       Obninsk, started supplying domestic electricity on the 27 th June, 1954. Since then,\n        another 440 nuclear power stations have opened worldwide. The United States has\n        the highest level of generation, but France generates a higher percentage (75%) of\n          its energy through nuclear power than anywhere else. China is investing ma ssively\n 35     in nuclear power, planning to open another 28 plants by 2025, which may turn  it\n        into the world leader. India plans to have another 21 plants operational by 2021.\n       They will use the chemical element thorium, of which it has abundant supplies, as\n       an alternative to uranium.\n\n 40    Of course, nuclear power is not without risk. There have been a number of nuclear\n        accidents over the years, such as the Chernobyl disaster in 1986, or the Fukushima\n        disaster in 2011. And there will always be problems with the disposal of radioactive\n        waste, which must remain in storage for thousands of years. However, these dangers\n       must be balanced against the potential benefits of nuclear energy.  It may be that\n 45     nuclear energy is the only thing that can save us from climate change.\n", "questions": [{"n": 1, "stem": "What is the MAIN SUBJECT of Paragraph One (Lines 1 – 8)?", "options": ["Our remaining supplies of fossil fuels.", "Predictions of global temperature rises.", "Theories about climate change.", "Why we need to reduce use of fossil fuels."], "key": 3, "explanation": "Why we need to reduce use of fossil fuels – Paragraph One explains that burning fossil fuels causes climate change and warns of extinction"}, {"n": 2, "stem": "Paragraph One (Lines 1 – 8) says that ______.", "options": ["80% of fossil fuels are used to generate energy", "burning fossil fuels causes climate change", "global temperatures are going to rise by 16 0C", "we are going to use all our existing fossil fuels"], "key": 1, "explanation": "burning fossil fuels causes climate change – The text states this directly: \"when fossil fuels are burnt, they release CO2… primary cause of climate change\""}, {"n": 3, "stem": "What is the MAIN SUBJECT of Paragraph Two (Lines 10 – 18)?", "options": ["How much energy is going to be used in the future.", "The advantages of using wind and solar energy.", "Which is best, wind energy or solar energy?", "The best alternatives to fossil fuels."], "key": 3, "explanation": "The best alternatives to fossil fuels – Paragraph Two discusses wind, solar, and nuclear as alternatives"}, {"n": 4, "stem": "Renewables (Line 15) are ______.", "options": ["machines used to generate electricity", "people in favour of wind and solar energy", "power stations that use fossil fuels", "sources of energy that do not run out"], "key": 3, "explanation": "sources of energy that do not run out – Renewables are energy sources that are naturally replenished"}, {"n": 5, "stem": "The phrase only one game in town (Line 18) means only one ______.", "options": ["realistic choice", "source of entertainment", "thing that must be avoided", "thing to see"], "key": 0, "explanation": "realistic choice – \"Only one game in town\" means the only viable option"}, {"n": 6, "stem": "According to Paragraph Three (Lines 20 – 27), an advantage of nuclear energy generation is that ______.", "options": ["it does not use steam", "nothing is burnt", "there is no heat", "turbines are not used"], "key": 1, "explanation": "nothing is burnt – Nuclear energy relies on fission, not combustion, so no smoke or CO2 emissions"}, {"n": 7, "stem": "What is the BEST sentence to BEGIN Paragraph Four (Lines 29 – 38)?", "options": ["Global warming has been known of for many years.", "However, there are many dangers with nuclear energy.", "Nuclear energy generation is not new.", "Russia is the world leader in nuclear energy."], "key": 2, "explanation": "Nuclear energy generation is not new – Paragraph Four begins with the development of nuclear science in the 1940s and the first plant in 1954"}, {"n": 8, "stem": "Which country generates more of its energy from nuclear power than from any other source?", "options": ["China.", "France.", "India.", "The USA."], "key": 1, "explanation": "France – France generates 75% of its energy from nuclear, the highest percentage anywhere"}, {"n": 9, "stem": "What conclusion does the article reach about nuclear energy as an alternative to fossil fuels?", "options": ["Although there are dangers, it is the best alternative.", "The dangers are too great for it to be further developed.", "There are no real problems with it.", "Wind and solar power should be used instead."], "key": 0, "explanation": "Although there are dangers, it is the best alternative – The final paragraph balances risks and benefits, concluding nuclear \"may be the only thing that can save us\""}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Climate Change and The Environment", "Nuclear Power as an Alternative to Fossil Fuels", "Our World If We Continue to Use Fossil Fuels", "The Disadvantages Of Wind And Solar Energy"], "key": 1, "explanation": "Nuclear Power as an Alternative to Fossil Fuels – The article focuses on why nuclear is necessary despite risks"}], "vocab": [{"word": "finite", "meta": "B2, adjective · AWL", "meaning": "limited in quantity; not infinite or inexhaustible", "group": "Text 12", "page": 233}, {"word": "extinction", "meta": "B2, noun · AWL", "meaning": "the complete disappearance of a species from the planet", "group": "Text 12", "page": 233}, {"word": "forecast", "meta": "B2, verb · AWL", "meaning": "to predict or estimate a future trend or event", "group": "Text 12", "page": 233}, {"word": "disfigure", "meta": "C1, verb", "meaning": "to spoil the appearance or beauty of something", "group": "Text 12", "page": 233}, {"word": "opponents", "meta": "B2, noun · AWL", "meaning": "people who are against something or disagree with a proposal", "group": "Text 12", "page": 233}, {"word": "renewables", "meta": "B2, noun · AWL", "meaning": "energy sources that are naturally replenished, such as wind or solar power", "group": "Text 12", "page": 233}, {"word": "insufficient", "meta": "B2, adjective · AWL", "meaning": "not enough in degree, amount, or quantity", "group": "Text 12", "page": 233}, {"word": "projected", "meta": "B2, adjective · AWL", "meaning": "estimated or predicted for a future time", "group": "Text 12", "page": 233}, {"word": "fission", "meta": "C1, noun", "meaning": "the process of splitting atomic nuclei, releasing large amounts of energy", "group": "Text 12", "page": 233}, {"word": "operational", "meta": "B2, adjective · AWL", "meaning": "functioning and ready for use", "group": "Text 12", "page": 233}, {"word": "disposal", "meta": "B2, noun · AWL", "meaning": "the act of getting rid of something, especially waste", "group": "Text 12", "page": 233}, {"word": "storage", "meta": "B2, noun · AWL", "meaning": "the keeping or placing of something in a safe location for future use", "group": "Text 12", "page": 233}], "vocabularyPages": [233], "topic": "Nuclear Energy"}, {"id": "reading-13", "unit": 3, "skill": "Reading", "title": "Text 13", "label": "Text 13", "pages": [60, 61], "text": "                                                      Text 13\n     Reading\n\n                   ________________ (See the appropriate question.)\n\n   A hybrid vehicle is any vehicle which derives its kinetic energy from more than one\n     source, these sources commonly being a petrol-driven engine and an electric motor.\n    They work by converting both electrical energy (from a battery) and chemical energy\n     (that trapped within liquid fuel such as petrol or diesel) into movement. They have\n 5   become increasingly popular over the last decades in view of their perceived advantages\n     over both petrol-driven cars and pure electric cars. They use less fuel than conventional\n     petrol-driven cars, and so can be more economical to run. In addition, as they use less\n      fossil fuel, they are considered less damaging to the environment. Their advantage over\n     pure electric vehicles is that their batteries do not need to be externally char ged (for\n 10  example, from a domestic power socket.) The distance they can travel is not dependent\n     on the battery charge. They therefore do not suffer from issues of range, which  is\n     considered to be the greatest disadvantage of pure electric vehicles.\n\n    ________________ (See the appropriate question.) Ferdinand Porsche built the world’s\n 15   first hybrid vehicle in 1899. Entitled the System Porsche-Lohner Mixte,  its petrol-\n     driven generator supplied power to an electric motor. This electric motor drove the\n      car’s front wheels. The vehicle was initially successful, and more than 300 models were\n     produced. However, in 1904 Henry Ford introduced the world’s first car mass assembly\n      line. The Ford Motor Company was able to produce petrol -driven cars and sell them at\n 20  very low prices: interest in the Porsche’s technology waned. It was not until the 1990s,\n     with concern over the environmental impact of burning fossil fuels,  that there was\n     major resurgence of interest in hybrid vehicles. In 1997, Toyota introduced the Prius,\n     the world’s first mass production hybrid vehicle. Nowadays, most car manufacturers\n      offer hybrid vehicles, with 10% of cars sold in the UK now hybrid vehic les.\n     There are three main types of hybrid car: the parallel hybrid, the series hybrid and the\n     plug-in hybrid. Parallel hybrids derive their kinetic energy from both an electric motor\n     and a petrol engine, both of which turn the wheels. Manufacturers that use the parallel\n     design include Toyota, Hyundai and Kia. In a series hybrid, however, movement comes\n 30  solely from an electric motor. Liquid fuel (petrol or diesel) is only used to generate the\n      electrical energy to power that motor. The BMW i3, with its range extender, is probably\n     the best-known example of a series hybrid. The plug-in hybrid differs from the parallel\n      or series hybrid in that  it has a battery that can be charged externally, either from a\n     domestic power socket or at a commercial EV charging station. The advantage is that,\n 35  provided journey lengths are relatively short, liquid fuel need never be used. The\n     vehicle only starts using petrol or diesel when its battery is depleted. The best-known\n     example of a plug-in hybrid is probably the Mitsubishi Outlander PHEV.\n\n     Are hybrid vehicles the future for the world’s powered transport? For environmental\n 40  purposes, in many countries around the world, the sale of pure petrol or diesel driven\n     vehicles is to be banned from 2030 onwards. However, hybrids still use petrol or dies el\n      fuel, so they too have a negative impact on the environment. Many countries plan to\n     ban sales of hybrid vehicles from 2035 onwards. Hybrids may have a longer lifespan\n     than conventional vehicles, but the future is pure electric.\n", "questions": [{"n": 1, "stem": "What is the MAIN SUBJECT of Paragraph One (Lines 1 – 12)?", "options": ["Good and bad points about petrol cars, hybrid cars and electric cars.", "How we convert electrical and chemical energy into kinetic energy.", "What hybrid vehicles are and what their advantages are.", "Why the use of fossil fuels damages the global environment."], "key": 2, "explanation": "What hybrid vehicles are and what their advantages are – Paragraph One defines hybrids and lists their benefits over petrol and pure electric cars"}, {"n": 2, "stem": "Paragraph One (Lines 1 – 12) DOES NOT say that _______.", "options": ["hybrid cars do not do any damage to the environment", "hybrid cars have become more popular in recent years", "pure electric cars have batteries that are externally charged", "with hybrid cars, drivers spend less money on fuel"], "key": 0, "explanation": "hybrid cars do not do any damage to the environment – The text says they are \"less damaging\" not harmless"}, {"n": 3, "stem": "What does that in Line 4 refer to?", "options": ["a battery", "chemical energy", "electrical energy", "kinetic energy"], "key": 1, "explanation": "chemical energy – \"That\" refers to chemical energy trapped within liquid fuel"}, {"n": 4, "stem": "According to the text, the problem with electric cars is that they ______.", "options": ["are not very fast", "cost a lot of money", "don’t go very far", "have expensive batteries"], "key": 2, "explanation": "don't go very far – Range is the greatest disadvantage of pure electric vehicles"}, {"n": 5, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 14 – 24)?", "options": ["Hybrid technology is a very recent development.", "The basic concept is nothing new.", "We will now discuss pure electric vehicles.", "With the Prius, Toyota invented hybrids."], "key": 1, "explanation": "The basic concept is nothing new – Paragraph Two begins with Porsche's 1899 hybrid, showing the concept is old"}, {"n": 6, "stem": "The problem with Porsche’s hybrids was PROBABLY that they were not ______.", "options": ["cheap enough", "fast enough", "quiet enough", "safe enough"], "key": 0, "explanation": "cheap enough – Ford's mass production made petrol cars cheap, killing interest in Porsche's hybrids"}, {"n": 7, "stem": "Which kind of vehicle uses its petrol or diesel ONLY to generate electricity?", "options": ["A parallel hybrid vehicle.", "A plug-in hybrid vehicle.", "A pure electric vehicle.", "A series hybrid vehicle."], "key": 3, "explanation": "A series hybrid vehicle – Series hybrids use the petrol engine only to generate electricity for the electric motor"}, {"n": 8, "stem": "When something is depleted (Line 36) ______.", "options": ["all or most of its supplies of something have been used", "it has been completely recharged with electricity", "it has been replaced by a newer example of something", "the plates have been removed from it"], "key": 0, "explanation": "all or most of its supplies of something have been used – Depleted means used up"}, {"n": 9, "stem": "Which sentence would the author of this article probably agree with?", "options": ["Hybrids vehicles are the future of powered transport in the world.", "It is very sad that in the future we will not be able to buy petrol cars.", "Nobody knows what kind of vehicles the world will be using in the future.", "We will use hybrids longer than petrol cars, but we will still stop using them."], "key": 3, "explanation": "We will use hybrids longer than petrol cars, but we will still stop using them – The final paragraph says hybrids will be banned from 2035, so they are not the future"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Electric Motors in Cars", "Electric Vehicles", "Hybrid Vehicles", "Modern Cars"], "key": 2, "explanation": "Hybrid Vehicles – The article explains what hybrids are, their history, types, and future prospects"}], "vocab": [{"word": "derive", "meta": "B2, verb · AWL", "meaning": "to obtain or receive from a source", "group": "Text 13", "page": 233}, {"word": "kinetic", "meta": "B2, adjective", "meaning": "relating to energy possessed by an object due to its motion", "group": "Text 13", "page": 233}, {"word": "economical", "meta": "B2, adjective", "meaning": "cost-effective; giving good value in relation to money spent", "group": "Text 13", "page": 233}, {"word": "range", "meta": "B2, noun · AWL", "meaning": "the maximum distance a vehicle can travel before needing refuelling", "group": "Text 13", "page": 233}, {"word": "wane", "meta": "B2, verb", "meaning": "to gradually decrease or become weaker", "group": "Text 13", "page": 234}, {"word": "resurgence", "meta": "C1, noun", "meaning": "a return or increase of interest, activity, or popularity after a decline", "group": "Text 13", "page": 234}, {"word": "solely", "meta": "B2, adverb", "meaning": "exclusively; only; not involving anything else", "group": "Text 13", "page": 234}, {"word": "deplete", "meta": "B2, verb · AWL", "meaning": "to use up or exhaust; to reduce to a low level", "group": "Text 13", "page": 234}, {"word": "lifespan", "meta": "B2, noun", "meaning": "the length of time something functions or remains operational", "group": "Text 13", "page": 234}], "vocabularyPages": [233, 234], "topic": "Hybrid Vehicles"}, {"id": "reading-14", "unit": 3, "skill": "Reading", "title": "Text 14", "label": "Text 14", "pages": [62, 63], "text": "                                Text 14     Reading\n                  ________________ (See the appropriate question.)\n\n     Tonne of Oil Equivalent (TOE) is a unit of energy defined as the amount of energy\n      released by burning one tonne of crude  oil. Used to describe large quantities of\n     consumed energy, it is often prefixed with mega, indicating a million: one MTOE is\n      the equivalent of the energy generated through the combustion of one million tonnes\n 5    of crude oil. In the United Kingdom in 2019 the amount of energy consumed across\n       all sectors stood  at 142 MTOE,  itself the equivalent  to 1,651 terra-watt hours.\n     Breaking this down across the four primary sectors of energy consumption, we find\n      that industrial energy consumption stood at 22.3 MTOE, transport consumption at\n     56.7 MTOE, domestic consumption at 43.2 MTOE and service sector consum ption at\n 10  14.6 MTOE. This represents a fall in total energy consumption from the year 2000,\n    when it stood at 159.4 MTOE.\n\n     During discussions of UK energy, when we refer to energy, we refer not only to\n      electricity but to all the types of energy we utilize. These include electrical energy,\n 15  heat energy, nuclear energy and chemical energy.  Electrical energy  is normally\n      referred to as power. Power sources/electricity sources, power generation/electricity\n     generation, power cables/electricity cables: in discussions of energy policy, the two\n     terms are essentially interchangeable.\n\n 20  ________________ (See the appropriate question.) Primary energy sources are those\n     defined as an energy form that has not yet been converted into any other form of\n     energy. The chief example is primary oil. Primary electricity is that generated from\n      nuclear, wind, solar and hydro (water-driven electricity generation). In 2019, the\n      quantities of different energy sources used in the UK were as follows:\n 25      1) Primary Oil: 57.4 MTOE\n         2) Natural Gas: 37.4 MTOE\n         3) Coal: 1.8 MTOE\n         4) Primary Electricity: 19.2 MTOE\n         5) Bioenergy and Waste: 12.3 MTOE\n    Compared to previous decades, a striking change is the steep fall in the amount of\n      coal utilized: in 1990, annual use of coal stood at 56.4 MTOE. From 1990 until the\n     present day, coal has largely disappeared from both its role as a domestic heat source\n     and a means of generating power, partly as result of environmental concerns but\n 35  mainly due to coal-mining no longer being economically viable. In the same period,\n      the role previously performed by coal has now largely been taken up by renewables.\n\n                            As of December 2020, renewables (mainly wind, solar,\n                               biomass and hydro) made up 40.2% of the UK’s total\n 40                                  electricity generation, and around 6% of  its overall\n                                energy  usage. This  is an exponential  rise over  the\n                                 previous 30 years. In 1990, 2% of the UK’s electricity\n                            came from renewables. In 2013,  it was 14.9%. Of all\n     renewable energy sources available to the UK, it is likely that wind power will attract\n 45  most future investment. The UK has already invested heavily in wind power turbines\n     both offshore (for example, Hornsea Two Offshore Wind Farm, located  just off\n     England’s south coast) and is now expanding its onshore wind power capacity. Solar\n     power has also been expanding, although at a lesser rate than wind power, largely\n     thanks to the lower costs of photovoltaic cells. As of June 2021, the UK has a 13.5 -\n 50  gigawatt solar capacity, accounting for 4.15% of the UK’s electricity consumption.\n", "questions": [{"n": 1, "stem": "What does it in Line 3 refer to?", "options": ["crude oil", "energy", "one tonne", "Tonne of Oil Equivalent (TOE)"], "key": 3, "explanation": "Tonne of Oil Equivalent (TOE) – \"It\" refers back to the subject of the sentence, TOE"}, {"n": 2, "stem": "Paragraph One (Lines 1 – 11) DOES NOT STATE or IMPLY that ______.", "options": ["1,651 terra-watt hours are the same as 142 MTOE", "burning a million tonnes of crude oil would generate 1 MTOE", "the UK now consumes more energy than it did 20 years ago", "transport consumes more energy than any other sector"], "key": 2, "explanation": "the UK now consumes more energy than it did 20 years ago – The text says consumption fell from 159.4 MTOE in 2000 to 142 MTOE in 2019"}, {"n": 3, "stem": "What is the MAIN SUBJECT of Paragraph Two (Lines 13 – 18)?", "options": ["How energy cannot be created or destroyed, but only changed.", "What we mean when we talk about energy.", "Which forms of energy cause environmental damage.", "Why some forms of energy are useful in society."], "key": 1, "explanation": "What we mean when we talk about energy – Paragraph Two clarifies that energy includes electrical, heat, nuclear, chemical"}, {"n": 4, "stem": "When two things are interchangeable (Line 18), ______.", "options": ["it is possible to generate them using electricity", "they are direct opposites of each other", "they do not do any damage to the environment", "you can swap them round without making a difference"], "key": 3, "explanation": "you can swap them round without making a difference – Interchangeable means can be used in place of each other"}, {"n": 5, "stem": "What is the BEST sentence to BEGIN Paragraph Three (Lines 20 – 29)", "options": ["What energy sources does the UK use?", "When did coal stop being important for the UK?", "Where does the UK get its oil from?", "Why is electricity so important in the UK?"], "key": 0, "explanation": "What energy sources does the UK use? – Paragraph Three lists primary energy sources used in the UK in 2019"}, {"n": 6, "stem": "Which picture shows hydro (Line 23)? Choose the picture labelled A, B, C or D on the original page.", "options": ["Picture A", "Picture B", "Picture C", "Picture D"], "key": 2, "explanation": "Picture C shows a hydroelectric dam. The supplied key A points to the nuclear-power picture and has been corrected.", "picture": true}, {"n": 7, "stem": "Coal has become less important MAINLY because ______.", "options": ["global warming means people don’t have to heat their homes", "mining coal became too expensive", "nuclear power was discovered", "people because very concerned about the pollution coal causes"], "key": 1, "explanation": "mining coal became too expensive – The text says coal disappeared mainly due to no longer being economically viable"}, {"n": 8, "stem": "What is the MAIN SUBJECT of Paragraph Five (Lines 38 – 50)?", "options": ["Biomass.", "The growth in renewables in the UK.", "The Hornsea Two Offshore Wind Farm", "Which energy source is the best alternative to coal?"], "key": 1, "explanation": "The growth in renewables in the UK – Paragraph Five gives statistics on renewable growth from 1990 to 2020"}, {"n": 9, "stem": "In Line 47, onshore describes something ______.", "options": ["connected with solar power", "in the middle of the ocean", "on land, rather than the sea", "that generates electricity"], "key": 2, "explanation": "on land, rather than the sea – Onshore is opposite of offshore"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Burning Crude Oil", "Climate Change and Electricity", "Energy in the UK", "Tonne of Oil Equivalent"], "key": 2, "explanation": "Energy in the UK – The article discusses UK energy consumption, sources, and changes over time"}], "vocab": [{"word": "combustion", "meta": "B2, noun · AWL", "meaning": "the process of burning", "group": "Text 14", "page": 234}, {"word": "sectors", "meta": "B2, noun · AWL", "meaning": "distinct parts or divisions of an economy or activity", "group": "Text 14", "page": 234}, {"word": "interchangeable", "meta": "C1, adjective", "meaning": "capable of being used in place of each other", "group": "Text 14", "page": 234}, {"word": "striking", "meta": "B2, adjective", "meaning": "noticeable, dramatic, or easily attracting attention", "group": "Text 14", "page": 234}, {"word": "viable", "meta": "B2, adjective · AWL", "meaning": "financially practical or sustainable", "group": "Text 14", "page": 234}, {"word": "exponential", "meta": "C1, adjective · AWL", "meaning": "increase that becomes more rapid in proportion to the growing total size", "group": "Text 14", "page": 234}, {"word": "offshore", "meta": "B2, adjective/adverb", "meaning": "located or operating at sea, away from the coast", "group": "Text 14", "page": 234}, {"word": "onshore", "meta": "B2, adjective/adverb", "meaning": "located or operating on land, not at sea", "group": "Text 14", "page": 234}], "vocabularyPages": [234], "topic": "UK Energy"}, {"id": "reading-15", "unit": 3, "skill": "Reading", "title": "Text 15", "label": "Text 15", "pages": [64, 65], "text": "                               Text 15\n     Reading\n\n       ________________ (See the appropriate\n                        question.)\n\n     ________________   (See   the   appropriate\n      question.) A unit fixed to a building’s external\n      wall sucks in  air from the outside. This  air\n 5    flows over  a  coil  containing  a  refrigerant.\n     Thermal   energy,   the   kinetic  energy   of                                                                        An Air-Source Heat Pump\n      vibrating and colliding atoms, transfers from\n                                                            An Air-Source Heat Pump\n      the outside  air  to the refrigerant within the\n       coil. Heat transfer occurs: the refrigerant gets warmer and the outside air leaving the\n 10   unit gets cooler.  It then passes into a compressor, which increases  its pressure,\n      increasing the kinetic energy of vibrating and colliding atoms inside  it. In other\n     words, it gets hotter. This useful heat then moves to an inside coil where heat transfer\n      again occurs, this time for domestic purposes: space-heating or water-heating. Next,\n         it passes through an expansion device, which depressurises  it and its temperature\n 15   falls. It is ready to pass into the coil in the external unit, and the cycle begins again.\n\n    When it comes to refrigerants, there are a number of choices. Propane, for example,\n                                   is highly efficient as  it has a boiling point of -42 °C, the\n                          temperature at which it vaporizes into a gas. Propane-based air\n 20                   pumps work efficiently down to temperatures of around -40.\n                       However, used as a fuel, propane is highly flammable. There is\n                             a risk of fire in the event of a leak. Other refrigerants have a       An External Wall-Mounted\n                Heat Pump        high level of toxicity, and can be harmful when touched by\n                         people or animals. To mitigate the risks of combustibility or\n 25   toxicity,  a number  of  safer  refrigerants  have  been  developed. These  include\n      tetrafluoroethene and difluoromethane.\n\n     Heat pumps do not create heat.\n     They draw heat from external\n 30   sources,  most  commonly  the\n      outside air, but also the water or\n      the    ground.    Their    chief\n     advantage  is  that  there  is no\n     burning of fossil fuels – coal,\n 35   gas, oil – and so no emissions of greenhouse gases. They will be key to achieving\n      net zero. Their advocates also claim that, because they use energy efficiently, they\n     can reduce heating bills. However, they also have downsides. They are less efficient\n       in cold weather. As well as that, compared to traditional space and water heating\n     methods, the unit cost of heat pumps remains high. A top-of-the-range gas-fired\n 40  Worcester-Bosch Greenstar 2000 combi boiler with a capacity of 30kW costs £2320,\n      while a Hitachi air-source heat pump, with a capacity of only 16kW, costs £8571.36.\n     Nor are they necessarily cheap to run. It depends on your energy supplier and the\n      unit electricity cost. The minimum annual energy consumption of a heat pump is\n      estimated  at 6,176 kilowatt hours. To take one energy supplier’s current  tariff\n 45  (Octopus Energy), a single kilowatt hour costs 28.13 pence. This gives a minimum\n     average cost of £1441.48 pounds a year (not including the standing charge of 62.50\n     pence  per  day.)  Heat  pumps  are  not  cheap.  Their  only  real  advantage  is\n      environmental.\n\n 50  Should you buy a heat pump to heat your home? If you live in Britain, you may not\n     have  a  choice. While  in 2022, 55,000  heat pumps were  sold  in  the UK,  the\n\n     government aims to install an annual 600,000 heat pumps by 2028. To achieve this,\n      a grant of up to £7,500 towards the cost of buying and installing heating pumps is\n      available. However, from 2035 onwards, the sale and installation of traditional gas\n 55  combi boilers will be banned. If you want a warm home and hot water, your only\n      real option will be a heat pump.\n", "questions": [{"n": 1, "stem": "What is the BEST sentence to BEGIN Paragraph One (Lines 1 to 15)?", "options": ["Air-conditioning keeps our homes cool and pleasant.", "Heat pumps work in the following way.", "How do walls suck air into your house?", "What is a refrigerant?"], "key": 1, "explanation": "Heat pumps work in the following way – Paragraph One describes the operation of a heat pump step by step"}, {"n": 2, "stem": "What does It in Line 10 refer to?", "options": ["Heat transfer", "the outside air", "the refrigerant", "the unit"], "key": 2, "explanation": "the refrigerant – \"It\" passes into a compressor; the refrigerant is the substance moving through the system"}, {"n": 3, "stem": "In Line 13, space-heating is ______.", "options": ["cooking", "heating bathroom water", "making rooms warm", "releasing heat out of a building"], "key": 2, "explanation": "making rooms warm – Space-heating means heating the indoor space of a building"}, {"n": 4, "stem": "What is the MAIN SUBJECT of Paragraph Two (Lines 17 to 26)?", "options": ["Different kinds of refrigerants.", "Risks of using refrigerants.", "The boiling point of propane.", "The most efficient refrigerant."], "key": 0, "explanation": "Different kinds of refrigerants – Paragraph Two discusses propane, toxicity, and safer alternatives"}, {"n": 5, "stem": "In Line 23, toxicity is ______.", "options": ["being poisonous", "boiling at a very low temperature", "easy or quick to burn", "efficient in transferring heat"], "key": 0, "explanation": "being poisonous – Toxicity means poisonousness"}, {"n": 6, "stem": "What is the MAIN SUBJECT of Paragraph Three (Lines 28 to 48)?", "options": ["Heat pumps: their advantages and disadvantages.", "The main benefits of heat pumps.", "Where heat pumps get their heat from.", "Why people should avoid buying heat pumps."], "key": 0, "explanation": "Heat pumps: their advantages and disadvantages – Paragraph Three lists advantages (no emissions, efficient) and disadvantages (cost, less efficient in cold"}, {"n": 7, "stem": "In Line 36, net zero is ______.", "options": ["an alternative energy source", "an environmental ambition", "emission of non-greenhouse gases", "free sources of energy"], "key": 1, "explanation": "an environmental ambition – \"Net zero\" refers to achieving zero carbon emissions"}, {"n": 8, "stem": "How much roughly would it cost to buy and run a Hitachi heat pump for a year, if Octopus were your energy supplier?", "options": ["£2320", "£8571", "£10013", "£10241"], "key": 3, "explanation": "£10241 – Hitachi pump cost £8571.36 + minimum annual running cost £1441.48 = £10012.84, approximately £10013. The closest option is D £10241, but careful: The question says \"buy and run\" – pump cost + annual running cost. The text gives pump £8571.36, running min £1441.48, sum = £10012.84. Option C is £10013, D is £10241. C is closer. However, the text also mentions standing charge? Standing charge is 62.50p/day = £228.13 per year, added gives £10241. So D is correct including standing charge."}, {"n": 9, "stem": "Paragraph Four (Lines 50 to 56) DOES NOT STATE or IMPLY that ______.", "options": ["buying a gas-fired combi boiler will become illegal", "heat pumps cost an average of £7,500", "most British people will probably have to get a heat pump", "the British government wants more people to have heat pumps"], "key": 1, "explanation": "heat pumps cost an average of £7,500 – The grant is up to £7,500, not the average cost"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Air-Conditioning", "Heat Pumps", "Refrigerants", "The Laws of Thermodynamics"], "key": 1, "explanation": "Heat Pumps – The article explains how heat pumps work, refrigerants, pros and cons, and future mandates"}], "vocab": [{"word": "refrigerant", "meta": "C1, noun", "meaning": "a fluid used in heat pumps that absorbs and releases heat", "group": "Text 15", "page": 234}, {"word": "thermal", "meta": "B2, adjective · AWL", "meaning": "relating to the internal energy of a substance due to the motion of its atoms", "group": "Text 15", "page": 234}, {"word": "compressor", "meta": "C1, noun", "meaning": "a device that increases the pressure of a gas or refrigerant", "group": "Text 15", "page": 234}, {"word": "depressurise", "meta": "C1, verb", "meaning": "to reduce the pressure inside a closed system", "group": "Text 15", "page": 234}, {"word": "vaporize", "meta": "B2, verb", "meaning": "to change from a liquid into a gas", "group": "Text 15", "page": 234}, {"word": "flammable", "meta": "B2, adjective", "meaning": "easily set on fire; capable of burning rapidly", "group": "Text 15", "page": 234}, {"word": "toxicity", "meta": "C1, noun", "meaning": "the degree to which a substance can harm living organisms", "group": "Text 15", "page": 234}, {"word": "mitigate", "meta": "C1, verb · AWL", "meaning": "to make less severe, harmful, or serious", "group": "Text 15", "page": 234}, {"word": "combustibility", "meta": "C1, noun", "meaning": "the ability of a substance to catch fire and burn", "group": "Text 15", "page": 234}, {"word": "greenhouse", "meta": "B2, adjective", "meaning": "relating to gases such as carbon dioxide that trap heat in the atmosphere", "group": "Text 15", "page": 234}, {"word": "advocates", "meta": "B2, noun · AWL", "meaning": "people who publicly support or recommend a particular cause", "group": "Text 15", "page": 234}, {"word": "downsides", "meta": "B2, noun", "meaning": "disadvantages or negative aspects of something", "group": "Text 15", "page": 234}, {"word": "unit", "meta": "B2, noun · AWL", "meaning": "the cost per single item or Theme of measurement", "group": "Text 15", "page": 234}, {"word": "tariff", "meta": "C1, noun", "meaning": "a pricing plan or rate charged by a utility company for energy", "group": "Text 15", "page": 234}, {"word": "grant", "meta": "B2, noun · AWL", "meaning": "a sum of money given by a government or organisation for a specific purpose", "group": "Text 15", "page": 234}, {"word": "installation", "meta": "B2, noun · AWL", "meaning": "the process of putting equipment into place and making it ready for use", "group": "Text 15", "page": 234}], "vocabularyPages": [234], "topic": "Heat Pumps"}, {"id": "reading-16", "unit": 4, "skill": "Reading", "title": "Text 16", "label": "Text 16", "pages": [67, 68], "text": "                                                      Text 16\n     Reading\n\n                   ________________ (See the appropriate question.)\n\n     On the morning of September 3 rd 1928, while tidying his cluttered laboratory,\n       Professor Alexander Fleming noticed a strange occurrence. On a glass plate that had\n      been coated with staphylococcus bacteria, a mould had developed which seemed to\n      have killed the bacteria. The mould, known as penicillium notatum, was to become\n 5     the world’s  first  antibiotic,  penicillin, and  its unexpected discovery was  the\n      beginning of a revolution in medicine.\n\n      Modern  medicine   is  enormously  dependent  on  antibiotics.  Since  Professor\n      Fleming’s  discovery,  infections  that were once  life-threatening have become\n 10    trivial. Antibiotics’  ability  to  kill or prevent the development of bacteria has\n      allowed doctors  to  treat  a huge range  of severe  illnesses, including  bacterial\n       endocarditis, meningitis and pneumococcal pneumonia. Before  antibiotics, any\n       surgery was extremely dangerous because of the risk of bacterial infection, but\n       antibiotics have made complex operations far safer for the patient. Cancer patients\n 15    rely  on  antibiotics,  too.  Cancer  treatment  destroys  the immune  system,  but\n       antibiotics protect cancer sufferers from  i nfections. Thanks to antibiotics, we lead\n       longer, healthier lives. It is estimated that their discovery has boosted average life\n      expectancy by 8 years.\n\n 20   ________________ (See the appropriate question.) This is because antibiotics that\n      were once effective are no longer able to kill bacteria. Bacteria are evolving to\n      become resistant to antibiotics, and this process is known as antibiotic resistance.\n      There are now bacteria that are totally resistant to any form of antibiotic, and there\n         is a serious danger that in the future we will have no effective antibiotics of any\n 25    kind. Infections that are now trivial will become deadly. Surgery that can now be\n      done in safety will become life-threatening. Antibiotic resistance is one of the most\n       serious dangers faced by the human race. We are facing a future where a cough or\n       cut could kill.\n\n 30   There could be more and more infections like MRSA, or, to give  it its full name,\n       meticillin-resistant staphylococcus aureus. This bacterium is known as a superbug,\n      because of  its having become resistant to any form of antibiotic. Deaths due to\n    MRSA are estimated at approximately 100,000. In the United States,  it kills more\n      people than AIDS, killing 20% to 50% of those infected. There  is no cure. As\n 35   another example, there is tuberculosis. 200 years ago, 25% of all Europeans died of\n       tuberculosis. Since then, thanks to antibiotics, tuberculosis has become far less\n      dangerous. However, there are signs that the bacteria that cause tuberculosis are\n      becoming resistant to antibiotics. Tuberculosis may again become a major killer.\n\n 40   So what is the solution? The root cause of antibiotic resistance is too many bacteria\n      coming into contact with antibiotics, and then not being killed by them, a situation\n      caused by both their overuse and their misuse. Doctors need to stop prescribing\n       antibiotics for all but the most necessary occasions. When they are used, patients\n      need to ensure that they take the full course of antibiotics, to ensure that all bacteria\n 45    are killed, and none are left to develop resistance.\n", "questions": [{"n": 1, "stem": "In 1928, Professor Alexander Fleming ______.", "options": ["discovered penicillin by accident", "had been studying penicillium notatum for years", "had been trying to develop an antibiotic", "was a student when he discovered penicillin"], "key": 0, "explanation": "discovered penicillin by accident – \"unexpected discovery\""}, {"n": 2, "stem": "What is the MAIN SUBJECT of Paragraph Two (Lines 8 – 18)?", "options": ["How antibiotics have helped us.", "The history of modern medicine.", "The world’s most dangerous diseases.", "Ways in which antibiotics kill bacteria."], "key": 0, "explanation": "How antibiotics have helped us – Paragraph Two lists benefits of antibiotics"}, {"n": 3, "stem": "In Line 10, trivial means ______.", "options": ["common", "extinct", "severe", "unimportant"], "key": 3, "explanation": "unimportant – \"Trivial\" means unimportant"}, {"n": 4, "stem": "Antibiotics help cancer patients because they ______.", "options": ["are able to kill cancer cells", "make the treatment of cancer safer", "reduce the need for operations", "stop people developing cancer"], "key": 1, "explanation": "make the treatment of cancer safer – Antibiotics protect cancer patients from infections"}, {"n": 5, "stem": "What is the BEST sentence to BEGIN Paragraph Three (Lines 20 – 28)?", "options": ["However, the benefits that antibiotics have brought us are now at risk.", "Scientists believe that modern antibiotics will become even more effective.", "These are not the only benefits that antibiotics bring us.", "Unfortunately, many countries still do not benefit from antibiotics."], "key": 0, "explanation": "However, the benefits that antibiotics have brought us are now at risk – Paragraph Three introduces antibiotic resistance"}, {"n": 6, "stem": "Paragraph Three (Lines 20 – 28) DOES NOT say that ______.", "options": ["antibiotic resistance is an extremely serious problem for everyone", "in the future minor problems could result in death", "surgery may become more necessary in the future", "there are now bacteria on which antibiotics have no effect"], "key": 2, "explanation": "surgery may become more necessary in the future – Not stated; text says surgery will become life threatening, not more necessary"}, {"n": 7, "stem": "The text suggests that MRSA is dangerous because it ______.", "options": ["always kills its sufferers", "is more likely to kill those who catch it than AIDS", "is unaffected by antibiotics", "spreads easily from person to person"], "key": 2, "explanation": "is unaffected by antibiotics – MRSA is resistant to any form of antibiotic"}, {"n": 8, "stem": "Tuberculosis ______.", "options": ["can no longer be treated with antibiotics", "could again become very dangerous", "has become a major cause of death", "used to kill 25% of people who caught it"], "key": 1, "explanation": "could again become very dangerous – \"Tuberculosis may again become a major killer\""}, {"n": 9, "stem": "The text suggests that, to prevent antibiotic resistance, we need to ______.", "options": ["completely stop using antibiotics", "develop newer and more effective antibiotics", "stop using antibiotics when it is not necessary", "use smaller amounts of antibiotics for shorter times"], "key": 2, "explanation": "stop using antibiotics when it is not necessary – \"Doctors need to stop prescribing antibiotics for all but the most necessary occasions\""}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Antibiotics And Antibiotic Resistance", "How Antibiotics Work", "Professor Alexander Fleming’s Discovery Of Penicillin", "The Diseases That Cannot Be Cured With Antibiotics"], "key": 0, "explanation": "Antibiotics And Antibiotic Resistance – The article covers both the discovery and the problem of resistance"}], "vocab": [{"word": "cluttered", "meta": "B2, adjective", "meaning": "messy or untidy, filled with too many objects", "group": "Text 16", "page": 234}, {"word": "occurrence", "meta": "B2, noun · AWL", "meaning": "an event or incident that happens", "group": "Text 16", "page": 234}, {"word": "mould", "meta": "B2, noun", "meaning": "a fungus that grows on organic matter, often visible as a fuzzy layer", "group": "Text 16", "page": 234}, {"word": "unexpected", "meta": "B2, adjective · AWL", "meaning": "not predicted or anticipated; surprising", "group": "Text 16", "page": 234}, {"word": "trivial", "meta": "B2, adjective", "meaning": "unimportant, minor, or easy to deal with", "group": "Text 16", "page": 235}, {"word": "severe", "meta": "B2, adjective · AWL", "meaning": "very serious, intense, or harmful", "group": "Text 16", "page": 235}, {"word": "immune", "meta": "B2, adjective", "meaning": "relating to the body's biological defence system against infection", "group": "Text 16", "page": 235}, {"word": "boost", "meta": "B2, verb", "meaning": "to increase, raise, or improve something", "group": "Text 16", "page": 235}, {"word": "expectancy", "meta": "B2, noun", "meaning": "the average number of years a person is expected to live", "group": "Text 16", "page": 235}, {"word": "resistant", "meta": "B2, adjective · AWL", "meaning": "not affected or harmed by something; able to withstand", "group": "Text 16", "page": 235}, {"word": "resistance", "meta": "B2, noun · AWL", "meaning": "the ability of bacteria to survive and grow despite antibiotics", "group": "Text 16", "page": 235}, {"word": "deadly", "meta": "B2, adjective", "meaning": "capable of causing death", "group": "Text 16", "page": 235}, {"word": "superbug", "meta": "C1, noun", "meaning": "a strain of bacteria that has become resistant to multiple antibiotics", "group": "Text 16", "page": 235}, {"word": "cure", "meta": "B2, noun", "meaning": "a remedy or treatment that completely eliminates a disease", "group": "Text 16", "page": 235}, {"word": "overuse", "meta": "B2, noun · AWL", "meaning": "excessive or too-frequent use of something", "group": "Text 16", "page": 235}, {"word": "misuse", "meta": "B2, noun · AWL", "meaning": "incorrect, inappropriate, or harmful use of something", "group": "Text 16", "page": 235}, {"word": "prescribe", "meta": "B2, verb", "meaning": "to authorise or order a medical treatment or medication for a patient", "group": "Text 16", "page": 235}], "vocabularyPages": [234, 235], "topic": "Antibiotics and Antibiotic Resistance"}, {"id": "reading-17", "unit": 4, "skill": "Reading", "title": "Text 17", "label": "Text 17", "pages": [70, 71], "text": "                                                      Text 17\n     Reading\n\n                         ________________ (See question 1.)\n\n       In December 2013, a two-year-old boy called Emile Ouamouno, from the village of\n      Meliandou in the West African state of Guinea, died of an illness that doctors\n      assumed was malaria,  a common cause  of death  in  that country. They would\n       continue to make this mistake in the weeks to come as Emile Ouamouno’s mother,\n 5     sister and grandmother also died. The illness spread: within weeks, others in Guinea\n      and in the neighbouring countries of Liberia and Sierra Leone were falling ill. Most\n       died, but  it was months before the disease was correctly diagnosed. On 25 March\n      2014, the World Health Organisation announced the outbreak of Ebola. Emile\n     Ouamouno had been Patient Zero of the world’s worst ever Ebola epidemic.\n      ________________ (See question 4.) In Belgium, a microbiologist by the name of\n       Peter Piot had been sent a blood sample by a doctor employed at a government -\n      funded mission in what we now call the Democratic Republic of Congo, but which\n      was then called Zaire. The blood sample came from a Belgian woman also working\n 15    at the mission, who was suffering from a disease which could not be identified.\n       Astonishingly, given its deadly nature, the sample was loosely carried in a thermos\n       flask of the kind we use for coffee and taken  in a passenger’s suitcase on  a\n      commercial flight to Belgium. When Peter Piot examined the sample, he identified\n       a virus never seen before. It was, he and his team realised , the cause of a terrifying\n 20   epidemic that was claiming hundreds of lives in Zaire. The Belgian woman also\n       died. He named the virus after a nearby river, the River Ebola, and much has been\n       learnt about it in the decades since its discovery.\n\n    We now know that Ebola is zoonotic, that is, it transfers from animals to humans.\n 25   The virus is harmless to its reservoir host, but when  it transfers to humans and a\n      few other mammal species, it becomes deadly. The reservoir host of Ebola has not\n       yet been identified, but scientists suspect that  it is the fruit bat, a species of bat\n       native  to the equatorial  rainforests  of  central Africa. There  are  five separate\n       varieties of the Ebola virus, scientists have discovered, four of which are zoonotic\n 30   pathogens.\n\n     As for the disease the Ebola virus causes,  it is spread through direct contact with\n       the skin or bodily fluids of an infected person. Its initial symptoms include fever,\n      headache, a sore throat and intense muscle pain. Those infected with Ebola should\n 35   be placed in intensive care, and their blood pressure needs to be monitored. At\n       present, although medical research  is ongoing, there  is no medically recognised\n       treatment or vaccine available. The most effective method of prevention is to avoid\n        all  direct  contact  with  infected  people,  and  to wash  hands  frequently  with\n       disinfectant. The World Health Organisation estimates Ebola’s mortality rate at\n 40   between 70% and 90%; however,  it is estimated that this rate will fall as soon as\n       effective treatments are developed.\n\n     As for the current epidemic, at the time of writing (December 2014) there have been\n      9,936 cases and 4,877 deaths, according to the World Health Organisation. The\n 45   same organisation states that,  if unchecked, the final death toll could rise to 1.2\n       million.\n", "questions": [{"n": 1, "stem": "What is the BEST TITLE for this article?", "options": ["Ebola", "Emile Ouamouno", "West Africa", "Zoonotic Diseases"], "key": 0, "explanation": "Ebola – The article is primarily about Ebola virus and the epidemic"}, {"n": 2, "stem": "It was months before the disease was correctly diagnosed because _______.", "options": ["doctors first thought it was something else", "nobody knew of the existence of Ebola", "people suffering the disease had no contact with doctors", "the disease was different from previous Ebola epidemics"], "key": 0, "explanation": "doctors first thought it was something else – They assumed malaria"}, {"n": 3, "stem": "What is meant by the phrase Patient Zero (Line 9)?", "options": ["A person who receives no medical care for a dangerous illness.", "A person whose body creates a virus for the first time.", "The first person infected in an epidemic.", "The youngest person to die of a specific disease."], "key": 2, "explanation": "The first person infected in an epidemic – Patient Zero means the first infected"}, {"n": 4, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 11 – 22)?", "options": ["In Europe, however, doctors were working on a cure.", "The disease has spread from Africa to Europe.", "The virus was first identified in 1976.", "What caused the World Health Organisation’s 2014 announcement?"], "key": 2, "explanation": "The virus was first identified in 1976 – Paragraph Two begins with the 1976 discovery"}, {"n": 5, "stem": "What was astonishing about how the sample was brought to Belgium? It was a very ______.", "options": ["dangerous way to carry the sample", "expensive way to carry the sample", "slow way to carry the sample", "reliable way to carry the sample"], "key": 0, "explanation": "dangerous way to carry the sample – Loosely carried in a thermos on a passenger flight"}, {"n": 6, "stem": "What is a reservoir host (Line 26)?", "options": ["An animal that carries but is not affected by a specific virus.", "An animal that spreads disease easily because it can fly.", "An area of water where viruses can grow in number.", "Anybody or anything that can carry a dangerous virus."], "key": 0, "explanation": "An animal that carries but is not affected by a specific virus – Definition of reservoir host"}, {"n": 7, "stem": "In Line 29, which refers to ______.", "options": ["Ebola", "five separate varieties", "scientists", "the Ebola virus"], "key": 3, "explanation": "the Ebola virus – \"Which\" refers to the Ebola virus in \"five separate varieties of the Ebola virus\""}, {"n": 8, "stem": "What is the MAIN SUBJECT of Paragraph Four (Lines 32 – 41)?", "options": ["Basic facts about Ebola.", "How Ebola is best treated.", "Symptoms of Ebola.", "The best way of preventing Ebola."], "key": 0, "explanation": "Basic facts about Ebola – Paragraph Four covers spread, symptoms, treatment, mortality rate"}, {"n": 9, "stem": "What does the text say about treatment for Ebola?", "options": ["It is commonly believed that a treatment will never be found.", "Medicines have now become available so fewer people are dying.", "There is no treatment now, but scientists are trying to find one.", "Treatment exists, but it is far too expensive for those in Africa."], "key": 2, "explanation": "There is no treatment now, but scientists are trying to find one – \"Medical research is ongoing, there is no medically recognised treatment\""}, {"n": 10, "stem": "What is a disease’s mortality rate (Line 39)? The percentage of ______.", "options": ["people who are able to recover from a disease", "sufferers who pass on their disease to others", "the population that catches a disease", "those infected who die from a disease"], "key": 3, "explanation": "those infected who die from a disease – Mortality rate is the percentage of infected who die"}], "vocab": [{"word": "assume", "meta": "B2, verb · AWL", "meaning": "to believe something to be true without proof", "group": "Text 17", "page": 235}, {"word": "outbreak", "meta": "B2, noun", "meaning": "the sudden start of a disease or something unpleasant", "group": "Text 17", "page": 235}, {"word": "epidemic", "meta": "B2, noun · AWL", "meaning": "a widespread occurrence of an infectious disease in a commThemey", "group": "Text 17", "page": 235}, {"word": "microbiologist", "meta": "B2, noun", "meaning": "a scientist who studies microscopic organisms such as bacteria and viruses", "group": "Text 17", "page": 235}, {"word": "astonishingly", "meta": "B2, adverb", "meaning": "in a way that is very surprising or shocking", "group": "Text 17", "page": 235}, {"word": "identify", "meta": "B2, verb · AWL", "meaning": "to recognise or discover the exact nature of something", "group": "Text 17", "page": 235}, {"word": "terrifying", "meta": "B2, adjective", "meaning": "extremely frightening or alarming", "group": "Text 17", "page": 235}, {"word": "zoonotic", "meta": "C1, adjective", "meaning": "able to be transmitted from animals to humans", "group": "Text 17", "page": 235}, {"word": "reservoir", "meta": "C1, noun", "meaning": "an animal or organism that carries a pathogen without becoming ill itself", "group": "Text 17", "page": 235}, {"word": "transfer", "meta": "B2, verb · AWL", "meaning": "to pass or spread from one living thing to another", "group": "Text 17", "page": 235}, {"word": "pathogens", "meta": "C1, noun · AWL", "meaning": "microorganisms that cause disease", "group": "Text 17", "page": 235}, {"word": "intensive", "meta": "B2, adjective · AWL", "meaning": "specialised hospital treatment for seriously ill or injured patients", "group": "Text 17", "page": 235}, {"word": "ongoing", "meta": "B2, adjective · AWL", "meaning": "continuing to exist or develop; not yet finished", "group": "Text 17", "pag
