, verb", "meaning": "to force or formally enlist into military service", "group": "Text 33", "page": 243}, {"word": "rank", "meta": "B2, noun", "meaning": "a position within a military hierarchy", "group": "Text 33", "page": 243}, {"word": "crucial", "meta": "B2, adjective", "meaning": "extremely important or necessary", "group": "Text 33", "page": 243}, {"word": "artillery shells", "meta": "B2, noun", "meaning": "large metal containers filled with explosives", "group": "Text 33", "page": 243}, {"word": "stave off", "meta": "C1, verb", "meaning": "to prevent or delay something harmful", "group": "Text 33", "page": 243}, {"word": "bad habits", "meta": "B2, noun", "meaning": "repetitive behaviours that are undesirable", "group": "Text 33", "page": 243}, {"word": "demobilization", "meta": "C1, noun", "meaning": "the process of discharging soldiers from military service", "group": "Text 33", "page": 243}, {"word": "comrades", "meta": "B2, noun", "meaning": "fellow soldiers or close companions", "group": "Text 33", "page": 243}], "vocabularyPages": [242, 243], "topic": "Wojtek the Bear"}, {"id": "reading-34", "unit": 7, "skill": "Reading", "title": "Text 34", "label": "Text 34", "pages": [133, 134], "text": "    Reading                   Text 34\n\n\n       ________________ (See the appropriate question.)\n\n     Dogs! In English, they go woof, woof, woof. In Polish,\n      their sound is written as hau, hau, hau. And in Arabic,\n     according to my sources, the onomatopoeic phrase is عو\n     عو عو. Dogs: the first domesticated animal species. With\n 5    their trainability, sharp hearing and sense of smell (40\n     times more acute than  that of  a human’s), they have\n     evolved to perform an incredibly varied number of roles.\n      In  agriculture,  they  herd and guard sheep and  other\n      livestock. In policing and the military, they perform the\n 10   vital role of search and rescue, seeking out, for example,\n      the hidden survivors of earthquakes and other natural                                                               Dog\n      disasters. They  are  invaluable  at  airports and  docks,\n      sniffing out illegal substances whose smells only their\n     noses can detect. Nowadays, dogs even check for the presence of Covid-19. In\n 15  societies where dogs are kept as household pets, owners report that their dogs help\n     reduce stress, anxiety and depression. Their companionship helps reduce loneliness,\n     and some doctors even think they are good for their owners’ cardiovascular health.\n    No wonder then that dogs have long been nicknamed Man’s Best Friend.\n\n 20  ________________ (See the appropriate question.) The oldest example of a dog’s\n     remains accepted as being that of a domesticated dog (and not a wolf) was found in\n     Bonn-Oberkassel, Germany. It dates to 14,223 years ago. But scientists believe that\n      the  first bonds between humans and dogs developed much  earlier,  before  the\n     development of agriculture. It was at this time that a now extinct common ancestor\n 25  of both the dog and the wolf came into contact with the human species. Attracted,\n      possibly, by the smell of meat being cooked, these animals approached the campfires\n      of nomadic hunter-gathers, and were accepted. Over years, these animals became\n     domesticated. They learned to read human behaviour, and developed relationships\n     with people, becoming guardians and companions. There is disagreement amongst\n 30   scientists over where  this bonding took  place,  but most  believe  it took  place\n     somewhere on the plains of Central Asia.\n\n     Dogs are not wolves. Although both descended from a now -extinct common ancestor,\n     and share more than 99% of their DNA, they have evolved to differ in a number of\n 35  ways. Wolves are stronger and, living in the wild where there is a need to bite and\n     break things like bone, have evolved larger jaws. Wolves also differ from dogs in\n      their diet. Although able to eat plant materials, their preference is for meat only. In\n      other words, wolves are carnivores. Dogs, however, are omnivores. Both differences\n      result from wolves’ evolution in the wild. Likewise, dogs’ evolution in the company\n 40  of humans has created certain features that distinguish them from wolves. Dogs are\n      trainable in ways that wolves can never be. They can recognise commands like Sit!,\n      Stay!, or Fetch!, and will obey them out of a desire to please their human owner. Are\n     dogs smarter than wolves? Probably not. Dogs have weaker problem -solving abilities\n     than wolves. During an experiment testing problem -solving, wolves and dogs were\n 45  faced with the same challenge: pulling on a rope at the right time in order to release\n      a tray of food. The wolves solved it quickly, and got their meat-treat. The dogs? The\n     dogs stopped, and turned to stare at their human owners, and waited. As if to say,\n    Come on, human. Solve this problem for me.\n", "questions": [{"n": 1, "stem": "What is the MAIN SUBJECT of Paragraph One (Lines 1 – 18)?", "options": ["Differences between dogs around the world.", "Dogs’ sense of smell and hearing.", "Domesticated animal species.", "Ways in which dogs benefit people."], "key": 3, "explanation": "paragraph one lists many ways dogs benefit people: agriculture, policing, search and rescue, health benefits"}, {"n": 2, "stem": "An onomatopoeic word or phrase (Line 3) is one which ______.", "options": ["has come from a much older language", "is more complicated than necessary", "is only used in written language, and not spoken", "sounds like the noise it describes"], "key": 3, "explanation": "onomatopoeic words sound like the noise they describe – woof, hau, عو عو عو imitate barking"}, {"n": 3, "stem": "What does they in Line 6 refer to?", "options": ["40 times", "Dogs", "human’s", "trainability, sharp hearing and sense of smell"], "key": 1, "explanation": "dogs – \"Dogs... have evolved to perform... roles\" – they refers to dogs"}, {"n": 4, "stem": "Dogs are useful at airports because they ______.", "options": ["are always happy to work", "are frightening for criminals", "have a very strong sense of smell", "rarely need to take a break"], "key": 2, "explanation": "dogs sniff out illegal substances because their sense of smell is 40 times more acute than humans'"}, {"n": 5, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 20 – 31)?", "options": ["But more and more women are keeping dogs too.", "This partnership began 20,000 to 30,000 years ago.", "What has been learned about dog intelligence?", "While dogs can be useful, they also have disadvantages."], "key": 1, "explanation": "paragraph two discusses the ancient origins of dog domestication, 14,223 years ago and earlier"}, {"n": 6, "stem": "What does It in Line 22 refer to?", "options": ["a wolf", "Bonn-Oberkassel, Germany", "Germany", "The oldest example of a dog’s remains accepted as being that of a domesticated dog"], "key": 3, "explanation": "\"The oldest example of a dog's remains... dates to 14,223 years ago\" – It refers to that remains example"}, {"n": 7, "stem": "Paragraph Two (Lines 20 – 31) STATES or IMPLIES that ______.", "options": ["after the domestication of dogs, humans started eating meat", "after their domestication, dogs’ relationships with people became stronger", "dogs became domesticated after the invention of farming", "it is known that dogs first became domesticated in Germany"], "key": 1, "explanation": "the text states dogs \"learned to read human behaviour, and developed relationships with people\" – stronger over time"}, {"n": 8, "stem": "What is the MAIN SUBJECT of Paragraph Three (Lines 33 – 48)?", "options": ["Differences between dogs and wolves.", "Dogs’ and wolves’ common ancestor.", "How smart dogs and wolves are.", "How wolves adapted to survive in the wild."], "key": 0, "explanation": "paragraph three contrasts dogs and wolves: ancestry, jaws, diet, trainability, problem -solving"}, {"n": 9, "stem": "Paragraph Three (Lines 33 – 48) DOES NOT STATE or IMPLY that ______.", "options": ["dogs only eat meat", "dogs will do what you tell them to do", "wolves are better than dogs at solving problems", "wolves have larger jaws because they hunt in the wild"], "key": 0, "explanation": "dogs are omnivores, not carnivores – the text says \"Dogs, however, are omnivores\""}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Dogs", "How Species Become Domesticated", "Intelligence in Animals", "The Common Ancestor of the Wolf and Dog"], "key": 0, "explanation": "the article covers dogs' benefits, domestication history, and comparison to wolves – all about Dogs"}], "vocab": [{"word": "onomatopoeic", "meta": "C1, adjective", "meaning": "sounding like the noise it describes", "group": "Text 34", "page": 243}, {"word": "domesticated", "meta": "B2, adjective", "meaning": "tamed and kept by humans", "group": "Text 34", "page": 243}, {"word": "trainability", "meta": "C1, noun", "meaning": "the ability to be taught to perform tasks", "group": "Text 34", "page": 243}, {"word": "acute", "meta": "B2, adjective", "meaning": "extremely sharp or well-developed (of senses)", "group": "Text 34", "page": 243}, {"word": "varied", "meta": "B2, adjective", "meaning": "diverse or different", "group": "Text 34", "page": 243}, {"word": "herd", "meta": "B2, verb", "meaning": "to guide or direct groups of animals", "group": "Text 34", "page": 243}, {"word": "livestock", "meta": "B2, noun", "meaning": "farm animals kept for use or profit", "group": "Text 34", "page": 243}, {"word": "search and rescue", "meta": "B2, noun", "meaning": "the operation of finding and helping people in danger", "group": "Text 34", "page": 243}, {"word": "invaluable", "meta": "B2, adjective", "meaning": "extremely useful or important", "group": "Text 34", "page": 243}, {"word": "sniff out", "meta": "B2, verb", "meaning": "to detect using the sense of smell", "group": "Text 34", "page": 243}, {"word": "illegal substances", "meta": "B2, noun", "meaning": "prohibited drugs or materials", "group": "Text 34", "page": 243}, {"word": "companionship", "meta": "B2, noun", "meaning": "the feeling of being with friends", "group": "Text 34", "page": 243}, {"word": "cardiovascular", "meta": "B2, adjective", "meaning": "relating to the heart and blood vessels", "group": "Text 34", "page": 243}, {"word": "nickname", "meta": "B2, verb", "meaning": "to give an informal name", "group": "Text 34", "page": 243}, {"word": "bonds", "meta": "B2, noun", "meaning": "close connections or relationships", "group": "Text 34", "page": 243}, {"word": "common ancestor", "meta": "B2, noun", "meaning": "an ancient species from which modern species evolved", "group": "Text 34", "page": 243}, {"word": "nomadic", "meta": "B2, adjective", "meaning": "moving from place to place", "group": "Text 34", "page": 243}, {"word": "guardians", "meta": "B2, noun", "meaning": "protectors or defenders", "group": "Text 34", "page": 243}, {"word": "descend", "meta": "B2, verb · AWL", "meaning": "to originate or evolve from a particular ancestor", "group": "Text 34", "page": 243}, {"word": "carnivores", "meta": "B2, noun", "meaning": "animals that eat primarily meat", "group": "Text 34", "page": 243}], "vocabularyPages": [243], "topic": "Dogs"}, {"id": "reading-35", "unit": 7, "skill": "Reading", "title": "Text 35", "label": "Text 35", "pages": [144, 145], "text": "                                Text 35\n     Reading\n\n           ________________ (See the appropriate question.)\n\n                           10th May, 2021. Mrs Erica Smith was at home.\n                        After  a  morning  of  dragging  her  unwilling\n                        children to school, she hoped that today would\n     be one of calm, despite the presence of roofing contractors. Today\n 5   might bring an end to the weird noises that had plagued her domestic hours for the\n      last several months. These, she believed, were the sounds of birds getting into the\n      attic through a hole in the roof. To provide safe conditions when working at height,\n     Bingley Roofing had set up their scaffolding on both sides of the property. They had\n     been contracted to seal holes in the roof to keep birds out. Then, there was a knock\n 10  at the window. It was Mick from Bingley Roofing. He held his builder’s hat against\n      his chest and looked worried. It wasn’t birds, he said. It was squirrels. And squirrels\n     were much worse.\n\n    ________________  (See  the appropriate  question.) There  are an estimated  2.7\n 15  million grey squirrels in Britain, and this number is growing. They are classed as a\n      pest species: rather than being protected by law, if a grey squirrel is trapped, it is a\n     criminal offence to let it go. According to the Wildlife and Countryside Act 1981, it\n       is illegal to release them back into the wild. Instead,  it  is the law that they be\n    humanely dispatched.\n    The species is not indigenous to Britain: the grey squirrel (to give it its Latin name,\n     sciurus carolinensis) is native to the United States and Canada. Despite only being\n     introduced into Britain in 1876, it is now the country’s dominant squirrel species.\n\n 25  The species they displaced was the red squirrel. Now only seen in northern Scotland,\n     they had been Britain’s dominant squirrel species for thousands of years. Currently,\n     there are only an estimated 140,000 red squirrels in the wild, compared to 2,700,000\n     greys. The reasons for greys becoming dominant are varied. There is no evidence of\n     inter-species conflict, so that can be discounted. The most significant factor may be\n 30  the parapoxvirus, hosted by grey squirrels and against which they have immunity,\n     but which is deadly for reds. Grey squirrels also have a greater ability to store fat\n      for winter, which results in higher survival rates.  It may also be possible that red\n      squirrels are less adaptable than greys, and so are impacted mor e by the destruction\n      of their natural habitats. However, research in this field is ongoing, and no definitive\n 35  answer has been given.\n\n     Grey squirrels are now seen as vermin, meaning a pest or invasive species. In the\n     1920s, after they caused significant damage to commercial forestry, in particular\n     beech trees, a law was passed forbidding their further importation. There is also now\n 40  growing awareness of the threat squirrels pose to residential houses. Once inside,\n     they can do serious damage, chewing through almost anything: wood, insulation\n     materials, electric cables (which leads to house fires), water pipes (which leads to\n     flooding). These are extremely expensive for homeowners, as household insurance\n      policies rarely cover damage resulting from vermin infestation.\n     So, back at Mrs Smith’s house. Mick from Bingley Roofing explained that there was\n      a whole family of squirrels living in the attic. And they had, Mick from Bingley\n     Roofing went on to say, chewed their way through much of the roof: tiles, laths,\n     insulation and the damp proof membrane. “But what can  I do?” asked Mrs Smith.\n 50  Mick from Bingley Roofing shrugged, and said, “It’s not going to be cheap.”\n", "questions": [{"n": 1, "stem": "From Paragraph One (Lines 1 – 12), we can INFER that Mrs Erica _______.", "options": ["Smith had been worried about squirrels for months", "Smith hadn’t been stressed by the sounds from the attic", "Smith was going to do some work on the roof herself", "Smith’s children weren’t very happy to go to school"], "key": 3, "explanation": "her children were \"unwilling\" to go to school, so not very happy"}, {"n": 2, "stem": "What does These in Line 6 refer to?", "options": ["domestic hours", "roofing contractors", "the last several
