e": 235}, {"word": "vaccine", "meta": "B2, noun", "meaning": "a substance injected to stimulate the body's immune system against a disease", "group": "Text 17", "page": 235}, {"word": "mortality", "meta": "B2, noun · AWL", "meaning": "the proportion of deaths caused by a particular disease", "group": "Text 17", "page": 235}, {"word": "unchecked", "meta": "C1, adjective", "meaning": "not controlled or prevented from getting worse", "group": "Text 17", "page": 235}], "vocabularyPages": [235], "topic": "Ebola"}, {"id": "reading-18", "unit": 4, "skill": "Reading", "title": "Text 18", "label": "Text 18", "pages": [73, 74], "text": "                                   Text 18\n     Reading\n\n              ________________ (See the appropriate question.)\n\n      One change that COVID-19 and lockdown has brought to our lives\n      which nobody would have predicted  is a renewed interest in home\n       baking. As I write this,  it is almost a year since the world first went\n        into lockdown. Right now, the world is still in or has gone back into\n 5     lockdown. In the time spanning these two points, literally millions of\n       people have discovered and then, with increasing passion and fervour, taken up the\n      hobby of making their own bread. And not just any old bread. The trend for home\n       baking during lockdown has been for making bread without the use of traditional\n       baker’s yeast: sourdough.\n      ________________ (See the appropriate question.) In those first strange weeks,\n       supermarkets in Britain witnessed a spree of panic-buying. Consumers scared of\n       potential shortages stripped the supermarket shelves bare of basic foodstuffs and\n        necessities, including bread. It dawned on bread -lovers that they’d have to make\n 15    their own. However, all the baker’s yeast had also been stripped from supermarket\n       shelves: it further dawned on bread-lovers that, to make bread, there was actually\n      no necessity to use baker’s yeast. They could instead utilise a process known as\n      sourdough baking.\n\n 20     If you consider that the first archaeological evidence of bread -making dates from\n      14,000 years ago, at the end of the Paleolithic era, the use of baker’s\n       yeast is an incredibly recent phenomenon. The world’s first purpose -\n       cultured yeast was introduced only in 1871. Until this point, for their\n      dough to rise, bakers had relied on the interaction between substances\n 25    contained within flour. These were naturally occurring yeasts and\n       bacteria called lactobacilli: when the flour was mixed with water and\n         left to stand, fermentation took place, and the dough rose to become bread. This is\n      sourdough baking, a process that fell out of favour in the 20 th century, confined\n       largely to specialist or artisan bakeries: mass-produced breads used mass-produced\n 30    baker’s yeasts.\n\n      But in March 2020, there was a temporary shortage of baker’s yeast. Born of\n       necessity, bread-lovers made their own sourdough breads. And from this, a global\n       trend emerged. Millions around the world  are passionately making  their own\n 35   sourdough breads. Instagram, Facebook and Twitter are packed to the rafters with\n      images of piping hot sourdough loaves. Given that shortages of baker’s yeast have\n       long since been remedied, and that supermarket shelves are again stuffed with\n       bread, what is the current attraction of home sourdough bread making?\n\n 40     It’s certainly not driven by hunger. Of all the problems created by lockdown, not\n       getting enough to eat isn’t one of them. During lockdown, very few people complain\n       of getting too thin. According to many, the greatest benefit of sourdough bread\n      making has been to their mental health. The whole process of making sourdough\n       bread is time-consuming. Firstly, you create the starter by mixing flour and water.\n 45   Over a period of a week you add more flour and water. Eventually, fermentation\n        starts to occur. Then you mix the starter with yet more flour to create a dough. The\n       process is deeply therapeutic. It keeps people grounded during a period of stress,\n       uncertainty and  anxiety. Even  if  the  final  product  (like mine)  is  absolutely\n       disgusting and barely edible.\n", "questions": [{"n": 1, "stem": "What does which in Line 2 refer to?", "options": ["COVID-19", "lockdown", "One change that COVID-19 and lockdown has brought to our lives", "our lives"], "key": 2, "explanation": "One change that COVID-19 and lockdown has brought to our lives – \"Which\" refers to that change"}, {"n": 2, "stem": "Paragraph One (Lines 1 – 9) says that, during lockdown, a large number of people have _______.", "options": ["been forced to make their own food", "eaten bread for the first time", "learned about using traditional baker’s yeast", "started making their own bread for fun"], "key": 3, "explanation": "started making their own bread for fun – \"Renewed interest in home baking\", \"taken up the hobby\""}, {"n": 3, "stem": "Paragraph One (Lines 1 – 9) says that sourdough bread is bread made ______.", "options": ["by non-professional bakers", "by people as a hobby", "in a home environment", "without certain ingredients"], "key": 3, "explanation": "without certain ingredients – Without traditional baker's yeast"}, {"n": 4, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 11 – 18)?", "options": ["One year ago, few people had heard of Wuhan.", "This bread had been made for thousands of years.", "This global trend originated at the beginning of the lockdown.", "This kind of bread is both tasty and healthy!"], "key": 2, "explanation": "This global trend originated at the beginning of the lockdown – Paragraph Two explains the start of sourdough baking"}, {"n": 5, "stem": "What is the MAIN SUBJECT of Paragraph Two (Lines 11 – 18)?", "options": ["Bread lovers in Britain.", "British supermarkets and their consumers.", "The problems caused by COVID-1919.", "Why people started making sourdough bread."], "key": 3, "explanation": "Why people started making sourdough bread – The paragraph gives the reason: shortage of bread and yeast"}, {"n": 6, "stem": "According to the text, supermarkets in Britain witnessed a spree of panic buying because people thought ______.", "options": ["food and other goods might not be available", "the shops would all be closed down", "they might catch COVID-19 in the shops", "they would not have enough money"], "key": 0, "explanation": "food and other goods might not be available – \"Consumers scared of potential shortages\""}, {"n": 7, "stem": "Paragraph Three (Lines 20 – 30) DOES NOT state or imply that ______.", "options": ["in the 20th century, sourdough bread became more and more popular", "the first evidence of bread is from the end of the Paleolithic era", "sourdough bread depends on yeast and bacteria working together", "fermentation can occur when flour and water are mixed"], "key": 0, "explanation": "in the 20th century, sourdough bread became more and more popular – The text says it fell out of favour"}, {"n": 8, "stem": "According to the text, the MOST COMMON reason why people NOW make sourdough bread is PROBABLY that it ______.", "options": ["cannot be bought in any shops", "is healthier than regular bread", "is necessary so they get enough to eat", "stops them getting depressed"], "key": 3, "explanation": "stops them getting depressed – \"Greatest benefit… to their mental health\", \"deeply therapeutic\""}, {"n": 9, "stem": "If an activity is therapeutic (Line 47), it is ______.", "options": ["boring", "connected to baking", "relaxing", "very difficult"], "key": 2, "explanation": "relaxing – Therapeutic means calming, relaxing"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["A Complete History of Bread Making", "Some Advice on Surviving Lockdown", "Sourdough Bread: A Lockdown Hobby", "Types of Bread Around the World"], "key": 2, "explanation": "Sourdough Bread: A Lockdown Hobby – Focus on the lockdown trend of sourdough baking"}], "vocab": [{"word": "renewed", "meta": "B2, adjective", "meaning": "a new or revived feeling of wanting to learn about or do something", "group": "Text 18", "page": 235}, {"word": "lockdown", "meta": "B2, noun", "meaning": "a period when people are required to stay at home as a safety measure", "group": "Text 18", "page": 235}, {"word": "trend", "meta": "B2, noun · AWL", "meaning": "a general direction of change or a popular new pattern of behaviour", "group": "Text 18", "page": 235}, {"word": "spree", "meta": "B2, noun", "meaning": "a period of frenzied purchasing of goods caused by fear of shortages", "group": "Text 18", "page": 235}, {"word": "strip", "meta": "B2, verb", "meaning": "to completely remove or empty something", "group": "Text 18", "page": 235}, {"word": "foodstuffs", "meta": "B2, noun", "meaning": "basic items of food or provisions", "group": "Text 18", "page": 235}, {"word": "dawn", "meta": "B2, verb", "meaning": "to suddenly realise or understand something", "group": "Text 18", "page": 235}, {"word": "archaeological", "meta": "B2, adjective · AWL", "meaning": "relating to physical remains or proof from past human activity", "group": "Text 18", "page": 235}, {"word": "fermentation", "meta": "B2, noun", "meaning": "the chemical process by which bacteria or yeast break down sugars", "group": "Text 18", "page": 236}, {"word": "artisan", "meta": "B2, noun", "meaning": "a skilled worker who makes things by hand using traditional methods", "group": "Text 18", "page": 236}, {"word": "mass-produced", "meta": "B2, adjective", "meaning": "made in large quantities using machinery", "group": "Text 18", "page": 236}, {"word": "time-consuming", "meta": "B2, adjective", "meaning": "taking a lot of time to complete", "group": "Text 18", "page": 236}, {"word": "therapeutic", "meta": "B2, adjective", "meaning": "having a healing or calming effect on mental or physical health", "group": "Text 18", "page": 236}], "vocabularyPages": [235, 236], "topic": "Sourdough Bread"}, {"id": "reading-19", "unit": 4, "skill": "Reading", "title": "Text 19", "label": "Text 19", "pages": [82, 83], "text": "                                          Text 19\n     Reading\n\n\n            ________________ (See the appropriate question.)              Norman\n\n    On the 21s t of March 2016, during excavation work at Keighley Bus\n      Station, workmen made a discovery. While digging a hole into which\n      to lay cables, they came across what appeared to be human remains.\n     Believing they had found evidence of murder, the workmen called\n 5    the police. On further investigation, the police found that the body was that of a\n     male, whole, and remarkably well-preserved in the soil beneath the station.\n\n     But after carbon-dating was done, the police lost interest in investigating murder. If\n      there had been murder,  it had been done too long ago  for them  to catch  the\n 10  perpetrator. The body was old, really old.  It was 800,000 years old, the oldest\n     example of human remains ever found in Britain. The police turned the body over to\n      the Keighley Institute of Archaeology and Anthropology.\n\n     Following  further study,  the Keighley  scientists announced what they knew  of\n 15  Norman, the name they’d given to the body. Norman was male, had been, at the time\n      of his death, about 140 centimetres tall, and had a weight of 77 kilograms. Although\n      able to give details of what he’d eaten just before his death, lamb, rabbit, nuts and\n      berries, of which they found undigested traces in Norman’s stomach, they were\n     unable  to give a precise determination of cause of death. Had  it been murder?\n 20  Although there was some evidence of penetrating trauma, which could have resulted\n     from being struck with a rock or stick, this might have also have been caused by\n     having been in the ground so long. He might equally have died of natural causes,\n     such as disease or the cold.\n\n 25  ________________ (See the appropriate question.) Absolutely not, say the scientists\n       at the Keighley Institute. Norman was a Neanderthal, a sub-species of Homo Sapiens,\n      that inhabited Europe as hunter-gatherers hundreds of thousands of years ago. At the\n     time of Norman’s death,  it was possible to cross to Britain from mainland Europe\n     over a land bridge known as Doggerland, which has since been flooded by rising sea\n 30   levels. It was via this route that Neanderthals first moved to Britain. But Neanderthal\n    man became  extinct between  40,000 and  28,000  years  ago. And  Britain was\n     uninhabited during the last Ice Age, which lasted from 25, 000 to 15,000 years ago.\n     According to the Keighley scientists, Norman cannot be considered to have any\n     connection to the modern British.\n     So who were the ancestors of the workmen who discovered Norman at Keighley Bus\n      Station? British history  is one of immigration, with the settlement of Germanic,\n     French Scandinavian and Roman peoples into the British Isles taking place over\n     thousands of years. More recently, there has been the immigration of Jews, Chinese,\n 40  Africans, Indians, Pakistanis and people of Eastern European origin. All of these\n     groups now form the fabric of modern British life. But the Cro Magnon humans, that\n        is, our modern species, first came to Britain about 14,700 years ago, after the end of\n      the last Ice Age. They crossed from Europe to hunt in Britain. Now, 80% of the genes\n      of most British people can be traced back to these few thousand hunter s. These truly\n 45  are the ancestors of the modern British.\n\n     As for Norman, he is now on display at the Keighley Museum of Ancient Human\n     Remains.\n", "questions": [{"n": 1, "stem": "The body was found ______.", "options": ["because a murder was being investigated", "by a team of scientists", "by accident", "during an archaeological search"], "key": 2, "explanation": "by accident – Workmen discovered the body while digging for cables, not searching"}, {"n": 2, "stem": "Carbon-dating is used to ______.", "options": ["check if something is male or female", "discover the age of something", "find the cause of something’s death", "learn if something is still alive"], "key": 1, "explanation": "discover the age of something – Carbon dating determines age"}, {"n": 3, "stem": "A perpetrator (Line 10) is ______.", "options": ["a scientist who helps the police", "the cause of something’s death", "the person who has committed a crime", "the reason why something has happened"], "key": 2, "explanation": "the person who has committed a crime – Perpetrator means the one who committed a crime"}, {"n": 4, "stem": "What is the MAIN SUBJECT of Paragraph Three (Lines 14 – 23)?", "options": ["Norman’s age when he died.", "The cause of Norman’s death.", "What scientists learned about Norman.", "What was found in Norman’s stomach."], "key": 2, "explanation": "What scientists learned about Norman – Paragraph Three gives details of height, weight, diet, cause of death"}, {"n": 5, "stem": "Norman was ______.", "options": ["definitely murdered", "definitely not murdered", "possibly murdered", "probably murdered"], "key": 2, "explanation": "possibly murdered – \"Might have also been caused… He might equally have died of natural causes\""}, {"n": 6, "stem": "What is the BEST sentence to BEGIN Paragraph Four (Lines 25 – 34)?", "options": ["Can Norman be called the ancestor of modern British people?", "Is it possible for us to learn anything from Norman?", "So was Norman murdered?", "Was Norman an example of primitive man?"], "key": 0, "explanation": "Can Norman be called the ancestor of modern British people? – Paragraph Four begins with \"Absolutely not\" responding to that question"}, {"n": 7, "stem": "Paragraph Four (Lines 24 – 34) DOES NOT say that ______.", "options": ["for 10,000 years, nobody lived in Britain", "Neanderthals first crossed to Britain over Doggerland", "Neanderthals stopped existing thousands of years ago", "Norman had to cross to Britain from Europe in a boat"], "key": 3, "explanation": "Norman had to cross to Britain from Europe in a boat – They crossed via Doggerland land bridge, not boat"}, {"n": 8, "stem": "In Line 29, what does which refer to?", "options": ["a land bridge known as Doggerland", "Britain", "Europe", "mainland Europe"], "key": 0, "explanation": "a land bridge known as Doggerland – \"Which\" refers to Doggerland"}, {"n": 9, "stem": "Paragraph Five (Lines 36 – 45) tells us that ______.", "options": ["British people have gone to live all over the world", "Cro magnon humans became extinct like the Neanderthals", "most British people are related to a few thousand hunters", "the workmen who discovered Norman were not British"], "key": 2, "explanation": "most British people are related to a few thousand hunters – \"80% of the genes of most British people can be traced back to these few thousand hunters\""}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Keighley Bus Station", "Excavation Work", "Norman the Neanderthal", "The Modern British"], "key": 2, "explanation": "Norman the Neanderthal – The article is about the discovery and identity of Norman"}], "vocab": [{"word": "excavation", "meta": "B2, noun · AWL", "meaning": "the process of digging in the ground to find things from the past", "group": "Text 19", "page": 236}, {"word": "remains", "meta": "B2, noun", "meaning": "the dead body or bones of a person", "group": "Text 19", "page": 236}, {"word": "remarkably", "meta": "B2, adverb", "meaning": "surprisingly or unusually (often used with adjectives)", "group": "Text 19", "page": 236}, {"word": "preserved", "meta": "B2, adjective", "meaning": "maintained in good condition over a long period", "group": "Text 19", "page": 236}, {"word": "carbon-dating", "meta": "B2, noun", "meaning": "a scientific method of determining the age of ancient organic materials", "group": "Text 19", "page": 236}, {"word": "perpetrator", "meta": "C1, noun", "meaning": "a person who carries out a harmful, illegal, or immoral act", "group": "Text 19", "page": 236}, {"word": "archaeology", "meta": "B2, noun · AWL", "meaning": "the study of human history and prehistory through excavation of sites", "group": "Text 19", "page": 236}, {"word": "anthropology", "meta": "B2, noun · AWL", "meaning": "the study of human societies, cultures, and development", "group": "Text 19", "page": 236}, {"word": "precise", "meta": "B2, adjective · AWL", "meaning": "exact or accurate", "group": "Text 19", "page": 236}, {"word": "determination", "meta": "B2, noun · AWL", "meaning": "the identification of something", "group": "Text 19", "page": 236}, {"word": "penetrating", "meta": "C1, adjective", "meaning": "piercing or entering (used of an injury)", "group": "Text 19", "page": 236}, {"word": "trauma", "meta": "C1, noun", "meaning": "a physical injury or wound", "group": "Text 19", "page": 236}, {"word": "natural causes", "meta": "B2, noun", "meaning": "death resulting from illness, old age, or disease rather than accident", "group": "Text 19", "page": 236}, {"word": "hunter-gatherers", "meta": "B2, noun", "meaning": "people who live by hunting animals and gathering wild plants", "group": "Text 19", "page": 236}, {"word": "uninhabited", "meta": "B2, adjective", "meaning": "having no people living there", "group": "Text 19", "page": 236}, {"word": "ancestors", "meta": "B2, noun", "meaning": "family members from past generations, especially before grandparents", "group": "Text 19", "page": 236}, {"word": "settlement", "meta": "B2, noun · AWL", "meaning": "the act of people moving to and living in a new area", "group": "Text 19", "page": 236}, {"word": "genes", "meta": "B2, noun", "meaning": "Themes of heredity passed from parent to offspring", "group": "Text 19", "page": 236}], "vocabularyPages": [236], "topic": "Norman the Neanderthal"}, {"id": "reading-20", "unit": 4, "skill": "Reading", "title": "Text 20", "label": "Text 20", "pages": [84, 85], "text": "                                     Text 20\n     Reading\n\n\n                   ________________ (See the appropriate question.)\n\n      Friday 11th March 2011. At 14:46, an earthquake with an intensity of 9.0 M w struck\n      the east coast of Japan, its epicentre located approximately 70 kilometres east of\n      Japan’s main island of Honshu. It was the most powerful earthquake to have hit Japan\n     and  the  world’s  fourth most  powerful  since  records began  in  1900.  Terrible\n 5    destruction was wrought. As of 10 March 2015, 15,891 people were confirmed dead\n     and 2,584 were still missing. Over a million buildings were either totally destroyed\n      or badly damaged. The Fukushima Nuclear Power Plant, however, had been designed\n       to withstand disasters like this, and was largely undamaged.\n\n 10   In March 2011, the Fukushima Nuclear Power Plant played an integral role in Japan’s\n      national energy policy, with nuclear energy providing 30% of all the electricity used\n       in Japan. Aware of the risks posed by earthquakes, the plant’s designers had devised\n      failsafe mechanisms to become active in the event of an earthquake. As soon as the\n     earthquake struck, the plant automatically shut down, as it was designed to do. As\n 15   predicted, the plant lost external sources of power, so its diesel generators started\n      up. It seemed as if the design had been effective and disaster averted.\n\n     ________________ (See the appropriate question.) This tsunami, generated by the\n     unimaginable force of the earthquake and rising in height to over 15 metres, was to\n 20   inundate 560 square kilometres of Honshu. At 15:42, it easily breached the 10 -metre\n      sea wall that surrounded the Fukushima Power Plant, flooding  its buildings and\n      putting the diesel generators out of action. Without a source of electricity, the plant\n     became unable to cool its nuclear reactors, and disaster ensued. On March 12, an\n      explosion caused by  the  ignition  of hydrogen destroyed the upp er  part  of one\n 25   building. On March 14, a similar explosion blew the roof off the Reactor 3 building.\n    On March 15, an explosion damaged the Reactor 2 and Reactor 4 buildings. The\n     Japanese were in the midst of one of the world’s worst ever nuclear disasters, with\n      radiation leaks second only to those at Chernobyl in 1986: it is now believed that, at\n     Fukushima,  there was  a  release  into  the atmosphere  of approximately 770,000\n 30   terabecquerels.\n\n     By 19:03 on the 11 th of March, a nuclear emergency had been declared, followed at\n     20:50 by an evacuation order for people living within 2 km of the plant. At 21:23,\n       this was extended to 3 km and, early the next morning, to 10 km. That afternoon, it\n 35  was extended for a final time, this time to 20 km around the plant.\n\n     Whether  the  evacuation  has  saved  or  cost more  lives  remains  controversial.\n     According  to  official Japanese government  sources,  out  of  the 100,000 people\n      evacuated, there have been no recorded cases of deaths from or cases of radiation\n 40   sickness. However, according to the same sources, well over 1,000 people have died\n      as a direct result of being evacuated. Had the evacuation not taken place, cancer rates\n     would certainly have been higher, with a 70% greater likelihood of cancer amongst\n       girls, and a 7% higher incidence amongst boys.\n", "questions": [{"n": 1, "stem": "In Line 5, wrought means ______.", "options": ["avoided", "done", "monitored", "possible"], "key": 1, "explanation": "done – \"Wrought\" means caused or done"}, {"n": 2, "stem": "What can we INFER from Paragraph One (Lines 1 – 8)?", "options": ["At least 18,500 people are known for sure to have died.", "The centre of the earthquake was located on Honshu.", "It may not have been Japan’s most powerful earthquake ever.", "The nuclear plant was badly damaged by the earthquake itself."], "key": 2, "explanation": "It may not have been Japan's most powerful earthquake ever – Records only began in 1900, so a larger one may have occurred before"}, {"n": 3, "stem": "The plant shut down automatically because ______.", "options": ["it was a safety measure", "nobody knew how to keep it working", "no power source was available", "of earthquake damage"], "key": 0, "explanation": "it was a safety measure – The plant was designed to shut down automatically in an earthquake"}, {"n": 4, "stem": "What is the BEST sentence to BEGIN Paragraph Three (Lines 18 – 30)?", "options": ["Luckily, the plant had escaped danger.", "The following week, however, there was another disaster.", "The value of the plant’s design had been demonstrated.", "Then, almost an hour after the earthquake, a giant wave struck."], "key": 3, "explanation": "Then, almost an hour after the earthquake, a giant wave struck – Paragraph Three describes the tsunami"}, {"n": 5, "stem": "What caused the disaster at the nuclear power plant?", "options": ["Fires caused the nuclear reactors to get too hot.", "Seawater flooded into the nuclear reactors.", "The earthquake made holes in the reactors.", "There was no power to prevent overheating."], "key": 3, "explanation": "There was no power to prevent overheating – Diesel generators failed, so cooling stopped"}, {"n": 6, "stem": "Terabecquerels (Line 30) are ______.", "options": ["a type of explosion", "a unit of measurement of radiation", "highly dangerous poisonous gases", "holes in nuclear reactors’ protective shields"], "key": 1, "explanation": "a unit of measurement of radiation – Terabecquerels measure radioactive release"}, {"n": 7, "stem": "What is the MAIN SUBJECT of Paragraph Four (Lines 32 – 35)?", "options": ["Action taken in the 24 hours after the nuclear accident.", "How people were forced out of their homes.", "The spread of radiation around the plant.", "The weeks following the disaster."], "key": 0, "explanation": "Action taken in the 24 hours after the nuclear accident – Timeline of emergency declarations and evacuation orders"}, {"n": 8, "stem": "What does the text say about the evacuation?", "options": ["It was a terrible decision that should never have been made.", "It was unnecessary because there was no risk of radiation sickness.", "Japanese government reports about the evacuation cannot be trusted.", "We don’t know if it killed more people than it saved."], "key": 3, "explanation": "We don't know if it killed more people than it saved – \"Whether the evacuation has saved or cost more lives remains controversial\""}, {"n": 9, "stem": "What does the text say about cancer?", "options": ["Approximately 70% of girls developed cancer.", "Cancer rates are higher amongst those evacuated.", "The evacuation saved people from cancer.", "There are now higher cancer rates amongst boys than girls."], "key": 2, "explanation": "The evacuation saved people from cancer – Had evacuation not happened, cancer rates would have been higher"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["A Terrible Earthquake", "The Fukushima Nuclear Disaster", "The Evacuation of 100,000", "A Great Tsunami"], "key": 1, "explanation": "The Fukushima Nuclear Disaster – The article focuses on the nuclear accident following the earthquake and tsunami"}], "vocab": [{"word": "intensity", "meta": "B2, noun · AWL", "meaning": "the measurable strength or magnitude of something, such as an earthquake", "group": "Text 20", "page": 236}, {"word": "epicentre", "meta": "B2, noun", "meaning": "the point on the Earth's surface directly above where an earthquake starts", "group": "Text 20", "page": 236}, {"wor 0", "page": 237}, {"word": "extend", "meta": "B2, verb · AWL", "meaning": "to make larger or broader to cover a wider area", "group": "Text 20", "page": 237}, {"word": "controversial", "meta": "B2, adjective · AWL", "meaning": "causing disagreement or debate between people with opposing views", "group": "Text 20", "page": 237}, {"word": "likelihood", "meta": "B2, noun · AWL", "meaning": "the probability or chance that something will happen", "group": "Text 20", "page": 237}, {"word": "incidence", "meta": "C1, noun · AWL", "meaning": "the rate or frequency at which something, especially a disease, occurs", "group": "Text 20", "page": 237}], "vocabularyPages": [236, 237], "topic": "Fukushima Nuclear Disaster"}, {"id": "reading-21", "unit": 5, "skill": "Reading", "title": "Text 21", "label": "Text 21", "pages": [87, 88], "text": "                                     Text 21\n     Reading\n\n                  ________________ (See the appropriate question.)\n\n        I fear the future. More specifically:  I fear a future of Artificial Intelligence (AI).\n    We are on the cusp of the Fourth Industrial Revolution, in which AI will play a key\n       role. There will be huge changes to technology and society.  I fear these changes.\n      Instead of using technology as a tool, will we become its prisoner? Here’s why I’m\n 5    scared.\n\n      In October 2020, Saadia Zahidi, a World Economic   HSBC Report on Workplace Automation\n     Forum economist, published a report on the future of\n     employment, which predicted the loss of 85 million\n 10   jobs  globally between 2025 and 2035. These  job\n      losses  would  occur,  she  said,  as  the  result  of\n      increasing  automation  and  use  of  AI   in  the\n     workplace. Low-skill jobs  will be negatively and\n      disproportionately impacted. Any role that can be\n 15  done cheaper by an AI-managed device is at risk of\n      being lost. An example: in my local supermarket near\n      Keighley, all the cashiers have been replaced by automated self-service cash desks.\n       It’s not just supermarket cashiers who are facing unemployment. An HSBC report\n      has identified the likelihood of certain jobs becoming automated. ( See the embedded\n 20   graphic). Traditional jobs such as waiters or construction workers are likely to\n     become historical.\n\n     ________________ (See the appropriate question.) Zahidi goes on to predict that\n      the loss of 85 million jobs will be made up for by the creation of 97 million new\n 25   jobs, largely generated by the revolution in AI and automation. However, these jobs\n      will require new skills. Many of those who lose their jobs to automation and AI lack\n      both these skills and the ability to acquire them. They won’t get new jobs. A new\n      division in society will emerge. One between those on the right side of technology,\n      the young and intelligent (YOU), and those on the wrong side, the old and tired,\n 30   those less able to learn new skills (ME). Could teachers be replaced by technology?\n     Twice  in  the  last week, teachers have shown me  test questions written by AI\n     (ChatGPT and Monica). This is not going to end well.\n\n     AI poses dangers not only to employment. A February 2018 report compiled by,\n 35  amongst  others,  the  Universities  of Oxford  and  Cambridge,  identified  social\n     manipulation as a potential abuse of AI. Social manipulation is using AI to tell lies\n     and  to spread  hate through  social media  platforms. A platform  that has been\n      particularly criticised  is TikTok:  it runs an AI algorithm that does not filter out\n     harmful  or  false  content.  Facebook  and  Twitter  have  also  been  criticised.\n 40   Increasingly, these platforms may host AI-generated deep  fakes, video footage\n      created to tell lies or make you hate other people. What happens to us when we can\n     no longer trust what we see or hear?\n\n     Humanity is clever enough to create incredibly advanced technologies. But we often\n 45   lack the wisdom to use them in a way that benefits people. Lethal Autonomous\n     Weapons (LAWs) are autonomous military weapons systems that operate in the air,\n     on land, underwater or in space. They use AI to search independently for targets. In\n      certain circumstances, they use their AI to decide whether or not to kill people. What\n      could possibly go wrong with that? Well, actually, quite a lot could go wrong with\n 50   that.\n", "questions": [{"n": 1, "stem": "Paragraph Two (Lines 7 – 21) STATES that the jobs lost because of automation and AI will be those jobs that ______.", "options": ["are unpopular or are not paid very well", "can be done by machines at a lower cost", "only exist in the workplace", "require no skills of any kind"], "key": 1, "explanation": "can be done by machines at a lower cost"}, {"n": 2, "stem": "What does which in Line 9 refer to?", "options": ["a report on the future of employment", "employment", "the future of employment", "World Economic Forum"], "key": 0, "explanation": "a report on the future of employment"}, {"n": 3, "stem": "Paragraph Two (Lines 7 – 21) STATES or IMPLIES that traditional jobs such as waiters or construction workers could become ______.", "options": ["historically important", "less well-paid", "things of the past", "very unpopular jobs"], "key": 2, "explanation": "things of the past"}, {"n": 4, "stem": "What is the BEST sentence to BEGIN Paragraph Three (Lines 23 – 32)?", "options": ["It isn’t all bad news.", "Saadia Zahidi works for HSBC Bank.", "Teachers, however, will be fine.", "There are now robots."], "key": 0, "explanation": "It isn't all bad news."}, {"n": 5, "stem": "In Paragraph Three (Lines 23 – 32), the writer of the article STATES or IMPLIES that he ______.", "options": ["believes he is young and intelligent", "has used AI to write the test you are doing now", "might not be able to adapt to new technology", "thinks it’s a good idea to use AI to write tests"], "key": 2, "explanation": "might not be able to adapt to new technology"}, {"n": 6, "stem": "In Line 32, Monica is ______.", "options": ["a complex English grammar structure", "an AI chatbot, similar to ChatGPT", "an English teacher in the Prep Year", "the name of an English test"], "key": 1, "explanation": "an AI chatbot, similar to ChatGPT"}, {"n": 7, "stem": "What is the MAIN SUBJECT of Paragraph Four (Lines 34 – 42)?", "options": ["AI and its dangers for employment.", "Algorithms used by TikTok.", "Dangers of AI in social media.", "The most popular social media platforms."], "key": 2, "explanation": "Dangers of AI in social media."}, {"n": 8, "stem": "The writer STATES or IMPLIES that HUMANITY ______.", "options": ["believes that fighting is very bad", "can be smart but makes bad decisions", "is becoming more and more peaceful", "understands the effects of technology"], "key": 1, "explanation": "can be smart but makes bad decisions"}, {"n": 9, "stem": "What is MOST LIKELY to be the MAIN SUBJECT of the paragraph AFTER Paragraph Five (Lines 44 – 50)?", "options": ["How AI-controlled weapons systems keep us safe.", "The dangers of having weapons controlled by AI.", "The future of war in outer space.", "The threat to humanity of alien invasion."], "key": 1, "explanation": "The dangers of having weapons controlled by AI."}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Dangers of AI", "How Technology Helps Us", "Industrial Revolutions", "Work in the Future"], "key": 0, "explanation": "Dangers of AI"}], "vocab": [{"word": "cusp", "meta": "C1, noun", "meaning": "the point of entering a new stage or period of development", "group": "Text 21", "page": 237}, {"word": "prisoner", "meta": "B2, noun", "meaning": "trapped by or unable to escape from something", "group": "Text 21", "page": 237}, {"word": "automation", "meta": "B2, noun · AWL", "meaning": "the use of machines or computers to do work previously done by people", "group": "Text 21", "page": 237}, {"word": "disproportionately", "meta": "C1, adverb", "meaning": "to affect more strongly or severely than other groups", "group": "Text 21", "page": 237}, {"word": "automated", "meta": "B2, adjective · AWL", "meaning": "operated by machines or computers without human intervention", "group": "Text 21", "page": 237}, {"word": "embedded", "meta": "B2, adjective · AWL", "meaning": "inserted or fixed firmly into a surrounding mass", "group": "Text 21", "page": 237}, {"word": "acquire", "meta": "B2, verb · AWL", "meaning": "to gain or obtain a new skill, ability, or possession", "group": "Text 21", "page": 237}, {"word": "division", "meta": "B2, noun · AWL", "meaning": "a separation of people into different groups with unequal opportunities", "group": "Text 21", "page": 237}, {"word": "pose", "meta": "B2, verb", "meaning": "to present or create threats or risks for something", "group": "Text 21", "page": 237}, {"word": "manipulation", "meta": "C1, noun · AWL", "meaning": "the use of deceptive tactics to influence or control people", "group": "Text 21", "page": 237}, {"word": "abuse", "meta": "B2, noun · AWL", "meaning": "harmful, unethical, or improper use of something", "group": "Text 21", "page": 237}, {"word": "algorithm", "meta": "B2, noun", "meaning": "a set of step-by-step instructions followed by a computer to solve problems", "group": "Text 21", "page": 237}, {"word": "filter", "meta": "B2, verb", "meaning": "to remove or block unwanted content or information", "group": "Text 21", "page": 237}, {"word": "deep fakes", "meta": "C1, noun", "meaning": "realistic but fake videos or images created by artificial intelligence", "group": "Text 21", "page": 237}, {"word": "wisdom", "meta": "B2, noun", "meaning": "the ability to make good judgments based on knowledge and experience", "group": "Text 21", "page": 237}, {"word": "lethal", "meta": "B2, adjective", "meaning": "sufficient to cause death; deadly", "group": "Text 21", "page": 237}, {"word": "autonomous", "meta": "C1, adjective · AWL", "meaning": "able to operate or make decisions independently without human control", "group": "Text 21", "page": 237}, {"word": "targets", "meta": "B2, noun · AWL", "meaning": "objects, locations, or people selected to be attacked or destroyed", "group": "Text 21", "page": 237}], "vocabularyPages": [237], "topic": "AI and Future of Employment"}, {"id": "reading-22", "unit": 5, "skill": "Reading", "title": "Text 22", "label": "Text 22", "pages": [90, 91, 92], "text": "                                                 Text 22\n     Reading\n\nSkim read the following text and answer these questions with your partner.\n   •  What is the Singularity?\n   •   Is it a good thing or a bad thing?\n   •  Do you think it is realistic or just not going to happen?\nRead the whole text and answer the multiple-choice questions.\n\n        ________________ (See the appropriate\n                         question.)\n\n     The Singularity is a hypothetical future point\n        at which  artificial  intelligence  will become\n       greater than human intelligence. At this point,\n         if the theory is true, the world will experience\n 5    explosive  technological  growth. No  longer\n       limited by human intelligence, technology will\n      develop at a speed beyond all human understanding. It will bring vast changes to\n      our civilisation. There have been numerous predictions of when humanity will reach\n       the Singularity. Currently, the most widely accepted prediction amongst the theory’s\n 10   supporters is that  it will take place around the year 2045, a prediction made by\n      Google Chief Engineer, Ray Kurzweil.\n\n    A key part of the theory of the Singularity is Moore’s Law. Developed by Gordon\n      Moore,  a computer  scientist and businessman,  it  states  that  the  capability  of\n 15   computers doubles every two years. If this law is true, starting from now, by 2045,\n      computing power will be two thousand and forty-eight times its current level. This\n      huge upgrade  in computer power  will  enable  the second requirement  for  the\n       Singularity: the development of Artificial Super Intelligence. Artificial Intelligence\n        is classified into three stages. There is Artificial Narrow Intelligence (ANI), which\n 20   includes examples such as virtual assistants Siri, Alexa, and Google Assistant. Then,\n       there will be Artificial General Intelligence (AGI), which will include the ability t o\n     mimic all human behaviour. Despite technologies such as ChatGPT, humanity is not\n       yet at the stage of AGI. Finally, there is Artificial Super Intelligence (ASI). ASI\n      has intelligence superior to that of human intelligence. When ASI is developed, the\n 25   Singularity will be reached.\n\n     _________________ (See the appropriate question.) People are afraid that at this\n       point ASI will develop the ability to improve  itself, rewriting  its own code and\n      upgrading itself in an infinite and continuous process known as recursive self-\n 30   improvement. When ASI rewrites its own code, there is no guarantee it will do so\n       in a way that prevents harm to human beings. There is a fear that ASI will develop\n       the ability to use other technologies such as medical technology, nanotechnology or\n       genetic engineering. There are also those who fear that the next state of evolution\n       will be the incorporation of computer technology into human biology, for example,\n 35   the uploading and storage of human consciousness in digital form. Then there is the\n       final  state  of  Artificial  Intelligence:  sentience. Computers  will have become\n        artificial but living creatures. In the last part of the nightmare, humanity will have\n       created a new species, which takes control of the planet.\n\n 40   These  fears probably owe more  to  science  fiction  than  reality.  Increasingly,\n      however, well-known figures in science and technology are speaking out about the\n       possible dangers of Artificial Intelligence and the Singularity. Stephen Hawking,\n       for example, one of history’s greatest scientists, expressed fears that ASI could\n       result in human extinction, the complete death of the human species. Elon Musk has\n 45   spoken of being concerned with potential dangers of Artificial Intelligence, and has\n       called of a regulatory authority to ensure it operates in the public interest.\n", "questions": [{"n": 1, "stem": "If something is hypothetical (Line 1), it is ______.", "options": ["a future point", "a theory", "impossible", "plural"], "key": 1, "explanation": "a theory"}, {"n": 2, "stem": "Paragraph One (Lines 1 – 11) STATES or IMPLIES that the Singularity taking place in 2045 is ______.", "options": ["believed in by some people", "impossible, and can never happen", "something certain to happen", "the only prediction that has been made"], "key": 0, "explanation": "believed in by some people"}, {"n": 3, "stem": "What is the MAIN SUBJECT of Paragraph Two (Lines 13 – 25)?", "options": ["How Artificial Intelligence benefits us in our daily lives.", "How Moore’s Law has been proven to be completely wrong", "Moore’s Law and the development of Artificial Intelligence.", "The life and work of computer scientist Gordon Moore."], "key": 2, "explanation": "Moore's Law and the development of Artificial Intelligence."}, {"n": 4, "stem": "Paragraph Two (Lines 13 – 25) DOES NOT STATE or IMPLY that ______.", "options": ["Alexa and Google Assistant are examples of Artificial Narrow Intelligence", "for ASI to develop, computers will need to be much more powerful", "it is certain that by 2045 computers will be 2048 times more powerful", "Moore’s Law is named after a computer scientist and businessman"], "key": 2, "explanation": "it is certain that by 2045 computers will be 2048 times more powerful"}, {"n": 5, "stem": "What does it in Line 14 refer to?", "options": ["A key part", "Moore’s Law", "the Singularity", "the theory"], "key": 1, "explanation": "Moore's Law"}, {"n": 6, "stem": "What is the BEST sentence to BEGIN Paragraph Three (Lines 27 – 38)?", "options": ["Artificial Intelligence is commonly used to benefit people.", "Astonishingly, the Singularity was reached 17 years ago.", "Some fear that at this point humanity will lose control.", "This will be a wonderful day for the human race."], "key": 2, "explanation": "Some fear that at this point humanity will lose control."}, {"n": 7, "stem": "What is the MAIN SUBJECT of Paragraph Three (Lines 27 – 38)?", "options": ["Fears about what might happen after the Singularity.", "Medical technology, nanotechnology and genetic engineering.", "The benefits that the Singularity will bring to the world.", "What we know for certain will take place in the future."], "key": 0, "explanation": "Fears about what might happen after the Singularity."}, {"n": 8, "stem": "In Lines 29 - 30, recursive self-improvement is ______.", "options": ["anything popular amongst young people because it is technological", "getting better after suffering from a serious illness", "something using its own abilities to make its own abilities better", "what people do to computers, for example by adding memory cards"], "key": 2, "explanation": "something using its own abilities to make its own abilities better"}, {"n": 9, "stem": "Who has expressed the most negative opinions of Artificial Intelligence and the Singularity?", "options": ["Elon Musk", "Gordon Moore", "Ray Kurzweil", "Stephen Hawking"], "key": 3, "explanation": "Stephen Hawking"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Uses of Computer Technology in the Modern World", "The Singularity", "The Work of Google Engineer Ray Kurzweil", "What We Know for Sure Will Happen in the Future"], "key": 1, "explanation": "The Singularity"}], "vocab": [{"word": "explosive", "meta": "C1, adjective", "meaning": "extremely rapid and dramatic", "group": "Text 22", "page": 237}, {"word": "vast", "meta": "B2, adjective", "meaning": "extremely large or wide-ranging", "group": "Text 22", "page": 237}, {"word": "numerous", "meta": "B2, adjective", "meaning": "many; a large number", "group": "Text 22", "page": 237}, {"word": "widely accepted", "meta": "B2, adjective", "meaning": "believed or agreed to be true by many", "group": "Text 22", "page": 237}, {"word": "computing", "meta": "B2, noun", "meaning": "the ability of a computer to process information", "group": "Text 22", "page": 237}, {"word": "upgrade", "meta": "B2, noun", "meaning": "an improvement or increase in quality, capability, or performance", "group": "Text 22", "page": 237}, {"word": "enable", "meta": "B2, verb · AWL", "meaning": "to make something possible or provide the means to do something", "group": "Text 22", "page": 237}, {"word": "mimic", "meta": "B2, verb", "meaning": "to copy or imitate the behaviour, speech, or actions of something", "group": "Text 22", "page": 237}, {"word": "superior", "meta": "B2, adjective", "meaning": "higher in quality, ability, or importance than something else", "group": "Text 22", "page": 237}, {"word": "recursive", "meta": "C1, adjective", "meaning": "a continuous process where a system repeatedly improves itself", "group": "Text 22", "page": 237}, {"word": "guarantee", "meta": "B2, noun", "meaning": "no certainty or assurance that something will happen", "group": "Text 22", "page": 237}, {"word": "nanotechnology", "meta": "B2, noun", "meaning": "the science of manipulating matter at the molecular or atomic level", "group": "Text 22", "page": 238}, {"word": "genetic", "meta": "B2, adjective", "meaning": "relating to the deliberate modification of an organism's genes", "group": "Text 22", "page": 238}, {"word": "sentience", "meta": "C1, noun", "meaning": "the ability to feel, perceive, or experience subjective awareness", "group": "Text 22", "page": 238}, {"word": "regulatory", "meta": "C1, adjective · AWL", "meaning": "relating to an official organisation that makes and enforces rules", "group": "Text 22", "page": 238}], "vocabularyPages": [237, 238], "topic": "The Singularity"}, {"id": "reading-23", "unit": 5, "skill": "Reading", "title": "Text 23", "label": "Text 23", "pages": [93, 94], "text": "                                         Text 23\n     Reading\n\n               ________________ (See question the appropriate question.)\n\n     Counterfactual history is a way of looking at the past in which we consider not what\n      actually happened, but instead the consequences had history gone the other way. As\n     an example to illustrate the concept,  let’s take the following: what would have\n     happened  if the American War of Independence had never taken place? Would\n 5   America still be run from London? Or we might ask what would have happened if\n     Germany had won the Second World War. Would London still be called London? Or\n     would it be called Adolf Hitler Stadt, and its inhabitants all converse with each other\n      in German? In this article,  I want to ask a different question: what would have\n     happened if the Internet had never been invented?\n     So let’s imagine that Professor Tim Berners-Lee never invented the Internet: he did\n      not, while a researcher in Switzerland, create the World Wide Web between March\n     and November 1989, but instead became a mildly successful pastry chef. Nor is he\n      currently employed as a teacher at the Massachusetts Institute of Technology. If this\n 15  hypothetical world were reality, what would our world now be like?\n\n     ________________ (See question the appropriate question.) People wouldn’t spend\n     hours browsing the Internet, for a start, and smartphones wouldn’t be smart. They’d\n       just be phones. When you booked a flight or a holiday somewhere, you’d go to a\n 20   travel agent, or use your non-smart phone to contact a call-centre. Amazon, ebay and\n     souq.com wouldn’t exist. If you wanted to buy something, you’d have to go to an\n      actual shop. This itself would be more difficult, because there’d be no GPS on your\n     phone to guide you there. No Hunger Station, Uber Eats and absolutely no Netflix.\n     Nobody would be downloading movies from the Internet, and there’d be no online\n 25  gaming. You wouldn’t care about your Facebook page because you wouldn’t have\n      one, and you’d watch TV shows instead of funny cat videos on Youtube. Worst of\n       all, Whatsapp wouldn’t exist. To communicate with friends, you’d have to speak to\n     people face-to-face.\n\n 30  This may seem like a dystopia, a nightmare place in which 95% of your hobbies and\n      leisure activities are no longer possible. But this is just how our world was, not too\n     long ago. Would I want to go back to that world? Not really, but it didn’t seem too\n      bad, back then. Perhaps you only miss something when you’ve already had it. And\n      there is one massive benefit that the Internet has brought us: you do not want to be\n 35  without the Internet in the days of a global pandemic.\n\n    We should be thankful for the Internet in the days of Coronavirus. Without the\n      Internet, very few people would have enjoyed the protection of working from home\n      (avoiding close physical contact with others) and the social distancing that has\n 40  brought. In a very real sense, the Internet has saved  lives. And without online\n      learning platforms such as Blackboard, Microsoft Teams and Zoom, education would\n      either  have  stopped  altogether  or  continued  in  potentially  unsafe  conditions.\n     Imperfect as it is, the Internet has allowed education to continue, and we should all\n     be thankful for that.\n     So the Internet has brought problems, but it’s brought benefits as well. Would the\n     world be a better place had  it never been invented? So massive is the impact the\n      Internet has had on all of our lives, that that question simply cannot be answered.\n    We can’t answer the question, because we genuinely can’t imagine a life without it.\n 50   Its influence on our lives has become total.\n", "questions": [{"n": 1, "stem": "What is the MAIN SUBJECT of Paragraph One (Lines 1 – 9)?", "options": ["What counterfactual history is.", "What if Germany had won the Second World War?", "What if the American War of Independence had never taken place?", "Why people need to study history carefully."], "key": 0, "explanation": "What counterfactual history is."}, {"n": 2, "stem": "To converse (Line 7) means to ______.", "options": ["feel worried about something", "have a conversation with somebody", "think about something carefully", "translate a foreign language"], "key": 1, "explanation": "have a conversation with somebody"}, {"n": 3, "stem": "Most PROBABLY, in REAL LIFE, Tim Berners-Lee is a ______.", "options": ["rich businessman", "science fiction writer", "scientist and teacher", "well-known cook"], "key": 2, "explanation": "scientist and teacher"}, {"n": 4, "stem": "A hypothetical situation (Line 14) is one that is _______.", "options": ["imaginary or unreal", "known to be real", "very bad or dangerous", "what people want to be true"], "key": 0, "explanation": "imaginary or unreal"}, {"n": 5, "stem": "What is the BEST sentence to BEGIN Paragraph Three (Lines 17 – 28)?", "options": ["It would actually be exactly the same as reality.", "Let’s see how it would impact the world of medicine.", "Our day-to-day lives would certainly be different.", "The world would be a truly horrible dreadful place."], "key": 2, "explanation": "Our day-to-day lives would certainly be different."}, {"n": 6, "stem": "In Line 30, a dystopia is ______.", "options": ["a method of communication", "a series of problems with technology", "a very bad imaginary world", "an Internet-based app that doesn’t work"], "key": 2, "explanation": "a very bad imaginary world"}, {"n": 7, "stem": "How does the writer feel about the world before the Internet?", "options": ["Everybody was healthier because there was more social contact.", "It felt okay because the benefits of the Internet were unknown.", "Life was better then and he wants to return to that time.", "People were miserable because they couldn’t do anything online."], "key": 1, "explanation": "It felt okay because the benefits of the Internet were unknown."}, {"n": 8, "stem": "What does that in Line 39 refer to?", "options": ["close physical contact with others", "social distancing", "the Internet", "working from home"], "key": 3, "explanation": "working from home"}, {"n": 9, "stem": "In Paragraph Six (Lines 46 – 50), what conclusion does the writer come to about the Internet? The writer ______.", "options": ["believes that, by and large, the Internet has been a bad thing", "cannot say if the Internet has been a good or a bad thing", "has decided that the Internet has had a very negative impact on our lives", "thinks that, generally, the Internet has more advantages than disadvantages"], "key": 1, "explanation": "cannot say if the Internet has been a good or a bad thing"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["How Counterfactual History Helps Us Study the Past", "How the Internet Has Helped Us During Coronavirus", "The Work of Tim Berners-Lee", "What If the Internet Had Never Been Invented?"], "key": 3, "explanation": "What If the Internet Had Never Been Invented?"}], "vocab": [{"word": "counterfactual", "meta": "C1, adjective", "meaning": "relating to what might have happened if past events had occurred differently", "group": "Text 23", "page": 238}, {"word": "consequences", "meta": "B2, noun · AWL", "meaning": "the results or effects of an action or event", "group": "Text 23", "page": 238}, {"word": "converse", "meta": "B2, verb", "meaning": "to have a conversation or talk with one another", "group": "Text 23", "page": 23 a": "B2, adjective", "meaning": "digital systems or websites that deliver educational content", "group": "Text 23", "page": 238}, {"word": "imperfect", "meta": "B2, adjective", "meaning": "having faults or limitations", "group": "Text 23", "page": 238}, {"word": "genuinely", "meta": "B2, adverb", "meaning": "truly; really", "group": "Text 23", "page": 238}], "vocabularyPages": [238], "topic": "Counterfactual History / Internet"}, {"id": "reading-24", "unit": 5, "skill": "Reading", "title": "Text 24", "label": "Text 24", "pages": [102, 103], "text": "                                  Text 24\n     Reading\n\n                  ________________ (See the appropriate question.)\n\n                                        Is the Moon made of cheese, or  is the Moon made of\n                          moon? I think most people understand that the Moon is\n                           made of moon. And not cheese. But what do you do when\n                                people stop believing that the Moon is made of moon,\n 5                            and start believing that the Moon  is made of cheese:\n                           when they start believing that Bill Gates and Elon Musk\n                                   are Space Lizards. That forest fires in California are the\n                                     result of Space Lazers fired (by Space Lizards?) from\n                                  space. That Covid vaccines are part of a plot to inject us        Made of Moon or Made of Cheese?\n 10                                      all with 5G nanotechnology. That there is a plot, hidden\n     and of unimaginably vast scale, to take over the world. I’m talking about conspiracy\n      theories, and it’s really not funny.\n\n     There’s an idiom in English: to fall down the rabbit\n 15  hole.   It  refers  to  what  happens  when  someone\n    becomes both obsessed by and addicted to conspiracy\n      theories.  These  theories become  a  “reality”  that\n     influence  perceptions  of  the world around  them.\n     Social media plays a key  role. Believers typically\n 20  spend  long  periods  of  time  on  platforms  like\n     Facebook or Tiktok, being exposed to more and more\n     extreme conspiracy theory materials. According to psychologists, the cause of this\n     behaviour is the human need for understanding. The brain needs to identify patterns.\n      In a confusing and complex world, where truth and clarity are so difficult to find,\n 25  conspiracy theories offer a simple explanation for everything. These explanations are\n      also attractive in that everything is always somebody else’s fault. Did badly in the\n     midterm exam? It’s because the test-writer’s a Space Lizard.\n\n    ________________ (See the appropriate question.) More specifically, it is classified\n 30  as a behavioural addiction, which is when someone engages in behaviours which they\n     cannot stop, such as gambling or shopping, and which become pathological.  It is\n     harmful for a wide range of reasons, but probably most significantly for the damage\n        it does  to  relationships between  friends and family members. Friendships and\n     marriages can end when someone falls down the rabbit hole. Psychologists report a\n 35  range of symptoms amongst those addicted to conspiracy theories. These include\n     anxiety and fear for no specific reason alongside a perceived lack of control and low\n     self-esteem. Then there is the sense of isolation, alienation and disengagement from\n      society. Down the rabbit hole is not a good place to be.\n\n 40  Here’s the scary part: some or a lot of the conspiracy theory materials available on\n      social media were not created by conspiracy theorists. They were\n     created by  state  actors,  working  at  the  direction  of  foreign\n     governments. In August 2020, the United States’ State Department\n     published a report in which it identified certain sites as the proxies\n 45  of foreign governments,  the purpose  of which were  to spread\n     conspiracy theories amongst other countries’ populations. That\n     Youtube  video  about how Covid was  spread  by 5G -Internet\n     transmitters? It wasn’t posted by Honest Brent from Texas. It was posted by a faceless\n     government employee in a faceless government office somewhere in the world, whose\n 50  actual job is to make you believe things that aren’t true.\n", "questions": [{"n": 1, "stem": "The writer asks the question if the Moon is made of cheese to ______.", "options": ["give an example of something that obviously isn’t true", "inform people of the materials the Moon is made of", "show that students really like eating Kiri cheese", "suggest the Moon might not be made of moon"], "key": 0, "explanation": "give an example of something that obviously isn't true"}, {"n": 2, "stem": "In Line 10, a plot is ______.", "options": ["a secret plan to do something bad", "an area of building land", "something used in Internet technology", "the main events in a story or movie"], "key": 0, "explanation": "a secret plan to do something bad"}, {"n": 3, "stem": "What is the MAIN SUBJECT of Paragraph Two (Lines 14 – 27)?", "options": ["Common English idioms about conspiracy theories.", "The disadvantages of social media such as Tiktok.", "The psychology of believing in conspiracy theories.", "Why it’s difficult to know what’s true and what isn’t."], "key": 2, "explanation": "The psychology of believing in conspiracy theories."}, {"n": 4, "stem": "Paragraph Two (Lines 14 – 27) STATES or IMPLIES that people believe in conspiracy theories because they _______.", "options": ["are more exciting than the news on TV or in newspapers", "are the truth, but nobody understands this", "can be so much more difficult to understand than reality", "help us feel we are making sense of the world"], "key": 3, "explanation": "help us feel we are making sense of the world"}, {"n": 5, "stem": "What is the BEST sentence to BEGIN Paragraph Three (Lines 29 – 38)?", "options": ["A conspiracy theory, however, can also have advantages.", "It is an addiction, and it is harmful.", "There’s another idiom in English.", "What else do we know about the test-writer?"], "key": 1, "explanation": "It is an addiction, and it is harmful."}, {"n": 6, "stem": "What is the MAIN SUBJECT of Paragraph Three (Lines 29 – 38)?", "options": ["Fear of the modern world.", "Harm done by conspiracy theory addiction.", "The motivations for people to believe conspiracy theories.", "What is a behavioural addiction?"], "key": 1, "explanation": "Harm done by conspiracy theory addiction."}, {"n": 7, "stem": "In Line 35, These refers to ______.", "options": ["conspiracy theories", "Friendships and marriages", "Psychologists", "symptoms"], "key": 3, "explanation": "symptoms"}, {"n": 8, "stem": "In Line 42, an actor is ______.", "options": ["a person who plays a role in a movie or play", "an organisation with a role in government or society", "any social media platform", "someone who believes stories that are not true"], "key": 1, "explanation": "an organisation with a role in government or society"}, {"n": 9, "stem": "Brent from Texas is ______.", "options": ["a man who wrote a report for the US State Department", "someone who is an expert on the dangers of 5G-Internet transmitters", "someone who is completely addicted to conspiracy theories", "the false identity of someone posting online conspiracy theories"], "key": 3, "explanation": "the false identity of someone posting online conspiracy theories"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Conspiracy Theories", "What the Moon is Really Made Of", "Trust Social Media", "Bill Gates and Elon Musk: the Truth"], "key": 0, "explanation": "Conspiracy Theories"}], "vocab": [{"word": "conspiracy", "meta": "C1, noun", "meaning": "secret plans to do something bad", "group": "Text 24", "page": 238}, {"word": "unimaginably", "meta": "C1, adverb", "meaning": "to an extent that is difficult to comprehend", "group": "Text 24", "page": 238}, {"word": "obsessed", "meta": "B2, adjective", "meaning": "unable to stop thinking about something", "group": "Text 24", "page": 238}, {"word": "addicted", "meta": "B2, adjective", "meaning": "unable to stop doing or using something habitually", "group": "Text 24", "page": 238}, {"word": "perceptions", "meta": "B2, noun · AWL", "meaning": "the ways in which someone understands or views the world", "group": "Text 24", "page": 238}, {"word": "psychologists", "meta": "B2, noun", "meaning": "scientists who study the human mind and behaviour", "group": "Text 24", "page": 238}, {"word": "confusing", "meta": "B2, adjective", "meaning": "difficult to understand", "group": "Text 24", "page": 238}, {"word": "clarity", "meta": "B2, noun", "meaning": "the quality of being clear and easy to understand", "group": "Text 24", "page": 238}, {"word": "attractive", "meta": "B2, adjective", "meaning": "appealing or interesting because of seeming beneficial", "group": "Text 24", "page": 238}, {"word": "pathological", "meta": "C1, adjective", "meaning": "relating to behaviour that is extreme and uncontrollable", "group": "Text 24", "page": 238}, {"word": "gambling", "meta": "B2, noun", "meaning": "the activity of betting money on games, races, or other uncertain outcomes", "group": "Text 24", "page": 238}, {"word": "perceived", "meta": "B2, adjective · AWL", "meaning": "the feeling or belief that one has no power over a situation", "group": "Text 24", "page": 239}, {"word": "self-esteem", "meta": "B2, noun", "meaning": "a positive or negative opinion of one's own worth", "group": "Text 24", "page": 239}, {"word": "isolation", "meta": "B2, noun · AWL", "meaning": "the state of being separated or alone", "group": "Text 24", "page": 239}, {"word": "alienation", "meta": "C1, noun", "meaning": "the feeling of being separated from or not belonging to a group", "group": "Text 24", "page": 239}, {"word": "disengagement", "meta": "C1, noun", "meaning": "the withdrawal from normal social interactions", "group": "Text 24", "page": 239}, {"word": "state actors", "meta": "C1, noun", "meaning": "individuals or organisations acting officially on behalf of a government", "group": "Text 24", "page": 239}, {"word": "proxies", "meta": "C1, noun", "meaning": "agents or intermediaries acting on behalf of another", "group": "Text 24", "page": 239}, {"word": "faceless", "meta": "C1, adjective", "meaning": "anonymous or impersonal", "group": "Text 24", "page": 239}], "vocabularyPages": [238, 239], "topic": "Conspiracy Theories"}, {"id": "reading-25", "unit": 5, "skill": "Reading", "title": "Text 25", "label": "Text 25", "pages": [104, 105], "text": "                                  Text 25\n     Reading\n\n                   ________________ (See the appropriate question.)\n\n      Marco Polo: one of the world’s great explorers and travellers ? This is the story:\n      amongst the first Europeans to visit China, the Italian Marco Polo (1254 – 1324)\n        set off in 1271 on a four-year land journey to China, where he became a trusted\n      emissary of the Chinese emperor Kublai Khan. After performing various impo rtant\n 5     functions for the emperor, including serving as Governor of Yangzhou Province, he\n        left China after 17 years, arriving back in Italy in 1295. It was here that he wrote\n       his book The Travels of Marco Polo, which introduced Europeans to Chinese life\n      and customs, and made Marco a legend.\n\n 10   ________________ (See the appropriate question.) In recent years, some historians\n      have claimed that, far from being a great explorer, Marco Polo was a liar and a\n      conman. In 1995, historian Frances Wood argued in her book Did Marco Polo Go\n        to China? that the famous Italian never left Italy. Far from spending 17 years in\n      China, he’d learned everything he knew of China from sailors he met in the port of\n 15   Venice, which he then used  in  his famous book, and passed  off  as  his own\n       experiences.\n\n     What support  is there for  this hypothesis?  Firstly, there  is no mention  in any\n       historical Chinese record of anybody called Marco Polo, which, if he’d really been\n 20    a ‘trusted emissary’ of Kublai Khan, there would have been. Secondly, in his famous\n      book, Marco makes no mention of typically Chinese things such as chopsticks,\n       drinking tea or the Great Wall of China. Thirdly, Marco Polo claimed to have helped\n       the Chinese during the Battle of Xiangyang: impossible because this battle occurred\n      long before he arrived in China. Fourthly, in his book, Marco Polo is frequently\n 25    inaccurate. He describes Kublai Khan’s fleet as consisting of five -masted ships,\n      whereas in reality they were three-masted.\n\n      So was Marco Polo just a  liar and a mental? We should probably not jump to\n       conclusions. While recent research suggests that he did not go to China, even more\n 30    recent research suggests that he did. In 2012, Hans Vogel, professor of Chinese\n       history at Tubingen University, published a book entitled Marco Polo Was In China.\n       In this, Vogel outlines the case for believing that Marco Polo did spend many years\n        in China after all.\n\n 35   Marco Polo’s failure to mention the Great Wall of China, for example, should not\n      be taken as evidence of his never visiting China, argues Vogel. The Great Wall only\n      reached  its great size under the Ming Dynasty, several hundred years later. In\n       addition, Polo’s never being mentioned in any historical Chinese records should be\n       discounted. During that period, foreigners were constantly visiting China, and few\n 40   were mentioned in historical records. According to Vogel, there are also examples\n       of Polo being  so  historically  accurate  that he must have  visited China. His\n       descriptions of currency and salt production in the Yuan era are more detailed than\n       those of his Western, Arab or Persian contemporaries, which, in Vogel’s opinion,\n       strongly suggests he was an eyewitness.\n      Did he, or didn’t he? Was Marco Polo a great explorer or was he just a liar? The\n       truth is this is probably a question that will remain forever unanswered.\n", "questions": [{"n": 1, "stem": "The MAIN PURPOSE of Paragraph One (Lines 1 – 8) is to describe what ______.", "options": ["is commonly believed about Marco Polo’s life", "Marco Polo believed about China", "Marco Polo did when he was in China", "we know for certain of Marco Polo’s life"], "key": 0, "explanation": "is commonly believed about Marco Polo's life"}, {"n": 2, "stem": "Where does here (Line 6) refer to?", "options": ["China", "Italy", "Yangzhou", "Yangzhou Province"], "key": 1, "explanation": "Italy"}, {"n": 3, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 10 – 16)", "options": ["But is any of this true?", "His book became an immediate success.", "So was he as important as Christopher Columbus?", "What did Marco Polo do after he came back from China?"], "key": 0, "explanation": "But is any of this true?"}, {"n": 4, "stem": "When you pass something off (Line 15), you ______.", "options": ["are successful in doing it", "give it to somebody else", "make money from it", "pretend it is something else"], "key": 3, "explanation": "pretend it is something else"}, {"n": 5, "stem": "What is the MAIN SUBJECT of Paragraph Three (Lines 18 – 26)?", "options": ["Marco Polo’s cultural experiences in China.", "Marco’s Polo work for the Chinese emperor, Kublai Khan.", "Reasons for believing Marco Polo did not go to China.", "What Marco Polo learned while he was in China."], "key": 2, "explanation": "Reasons for believing Marco Polo did not go to China."}, {"n": 6, "stem": "A mental (Line 28) is a ______.", "options": ["crazy person", "historian", "traveller", "writer"], "key": 0, "explanation": "crazy person"}, {"n": 7, "stem": "Paragraph Four (Lines 28 – 33) suggests that ______.", "options": ["Hans Vogel believes Marco Polo never visited China", "Marco Polo was a liar and definitely did not visit China", "the most recent research tells us that Marco Polo did not visit China", "we should not decide what is true before knowing all the facts"], "key": 3, "explanation": "we should not decide what is true before knowing all the facts"}, {"n": 8, "stem": "Paragraph Five (Lines 35 – 44) DOES NOT say that ______.", "options": ["most foreigners who visited China were not recorded in historical documents", "Polo probably learned about salt and currency from Western contemporaries", "Polo probably visited China because some of what he said is so accurate", "when Polo visited China, the Great Wall was smaller than it later became"], "key": 1, "explanation": "Polo probably learned about salt and currency from Western contemporaries"}, {"n": 9, "stem": "What CONCLUSION does the article reach about Marco Polo’s visit to China?", "options": ["We now know that it really happened.", "We now know that it really did not happen.", "We should not care if it happened or not.", "We will never know if it really happened."], "key": 3, "explanation": "We will never know if it really happened."}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Chinese Emperor: Kublai Khan", "Frances Wood: Historical Author", "Hans Vogel: Professor of Chinese History", "Marco Polo: Did He Really Visit China?"], "key": 3, "explanation": "Marco Polo: Did He Really Visit China?"}], "vocab": [{"word": "explorers", "meta": "B2, noun", "meaning": "people who travel to unknown places to discover new things", "group": "Text 25", "page": 239}, {"word": "emissary", "meta": "C1, noun", "meaning": "a reliable representative or messenger sent on a diplomatic mission", "group": "Text 25", "page": 239}, {"word": "functions", "meta": "B2, noun · AWL", "meaning": "significant duties
