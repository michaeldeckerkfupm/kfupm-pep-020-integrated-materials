 Common European\n         Framework of Reference for Languages (CEFR).\n 3)   •   The Speaking Exam is worth 6% of your overall score in 002.\n 4)   •   The Speaking Exam lasts approximately 12 minutes. It is conducted in pairs.\n          There are two teachers and two students.\n 5)   •   The Speaking Exam consists of three sections. These are:\n       o  Part A Giving Personal Information (3-4 Minutes) (Teacher-Student)\n       o  Part B Comparing and Contrasting Two Photographs (3-4 Minutes) (Teacher-\n            Student)\n       o  Part C Joint Communication Activity (3-4 Minutes) Student-Student\n 6)   •    There are four separate categories of mark for the Speaking Exam, each of\n         which is worth 25% of the overall score.\n 7)   •   How can you prepare for the speaking exam?\n      •   You get better at speaking by speaking. The most effective way of improving\n          your speaking skills is by speaking with other students (your partner or\n           partners) in class.\n\n\n\n\n\n               Marks for the Speaking Exam\n •   There are four separate categories of mark for the Speaking Exam, each of\n     which is worth 25% of the overall score. These are:\nGrammar and Vocabulary (1-5)\n\n Grammar and Vocabulary assesses your ability to use a wide range of structures and\n lexical items accurately and appropriately to communicate. It focuses on both simple\n and complex grammatical control, as well as using varied vocabulary for familiar\n topics without needing to search for words, with minimal errors.\n\n The candidate can:\n •    accurately use simple grammatical forms\n •    accurately use complex grammatical forms\n •    accurately use a range of appropriate vocabulary (appropriate to everyday\n      situations / familiar topics / a wide range of familiar topics)\n\n Discourse Management (1-5)\n\n Discourse Management refers to your ability to communicate in long, coherent turns\n by organizing ideas logically, maintaining flow, and using a range of cohesive devices\n and discourse markers without excessive hesitation or repetition. It assesses how well\n you structure your spoken language.\n\n The candidate can:\n •   produce answers at an appropriate length for the task\n •   respond with little hesitation\n •   produce relevant contributions\n •   speak without unnecessary repetition\n •    organise their response appropriately\n •    use cohesive devices\n •    use appropriate discourse markers\n\n Pronunciation (1-5)\n\n Pronunciation refers to how clearly you produce sounds, stress, and intonation to be\n easily understood. You are assessed on whether your speech is intelligible, you use\n correct word/sentence stress, and employ natural rhythm and pitch.\n\n The candidate can:\n •   produce clear answers\n •    be generally understood\n •   produce appropriate intonation\n •    use sentence stress correctly\n •    use word stress correctly\n •   produce clear individual sounds\n\n Interactive Communication (1-5)\n\n Interactive Communication measures your ability to take an active part in\n conversation, engaging with your partner by initiating, responding, developing topics,\n and negotiating decisions. It assesses how well you use social, conversational skills to\n maintain a dialogue, rather than just delivering a monologue.\n\n The candidate can:\n •    start discussions\n •    introduce new ideas\n •    react appropriately to what the interlocutor or other candidate says\n •   keep the interaction going\n •    say more than the minimum\n •    try to involve the other speaker\n •   move the interaction in an appropriate direction (developing and negotiating\n     towards an outcome\n\n\n\nPart A Giving Personal Information (3-4 Minutes) (Teacher-Student)\n\nPractice: Complete the sentences below with an appropriate word.\n\nDuring the real exam, the teacher will only ask you two or three questions like these. It is\nyour responsibility to speak as naturally and as fluently as you can when asked these\nquestions.\n\n1)  Where __________ __________ from?\n\n2)  What __________ your hometown?\n\n3)  What __________ the good and bad things about your hometown?\n\n4)  What __________ you like doing in your free time?\n\n5)   __________ you live in a flat or a house? How big is your house?\n\n6)   __________ you have a large or small family?\n\n7)  How long __________ you lived in Dammam/Riyadh/Jeddah?\n\n8)  What __________ your high school like?\n\n9)  How __________ you spend your last holiday?\n\n10) Have you ever been outside Saudi Arabia?\n\n11) How __________ studying at KFUPM different from studying at high school?\n\n12) What __________ your father do?\n\n13) What __________ you like doing in your free time?\n\n14) How __________ young people in Saudi Arabia usually spend their weekends?\n\n15) What job __________ you like to do in the future?\n\n16) What kind of car __________ you like to have?\n\n17) What ambitions __________ you have for the future?\n\n\n\n\n\nPart B Comparing and Contrasting Two Photographs (3-4 Minutes) (Teacher-Student)\nStudent A speaks about the photographs below for at least 60 seconds, answering questions asked by the teacher.\n\n\n\n\n\nStudent B speaks about the photographs below for at least 60 seconds, answering questions asked by the teacher.\n\n\n\n\n\nPart C Joint Communication Activity (3-4 Minutes) Student-Student\n\nHere are examples of the questions you might be asked in Part C. In the real exam, you will\nonly be asked one question.  It is your responsibility to have a natural conversation with\nyour partner.\n\n   •   If your partner  isn’t really trying, you  will receive credit for trying  to  initiate\n      communication.\n   •   If your partner  is being overly dominant, you  will receive  credit  for trying  to\n       interrupt.\n\n\n1)  How much do you use AI in your day-to-day life? Do you think AI is more of a good\n     thing or a bad thing?\n\n2)  How concerned about Global Warming and Climate Change are you? Why  is  it a\n    problem and what solutions are there?\n\n3)  Do you enjoy driving in Saudi Arabia? What are some of the problems with driving,\n    and can you think of any solutions?\n\n4)  Do you think people use their smartphones too much? Do you think smartphones should\n     be allowed in class? Why, or why not?\n\n5)  What are some of the problems with not eating a good diet or not taking enough\n     physical exercise? What could the university do to encourage better health amongst\n     students?\n\n6)  Do you enjoy studying English at KFUPM? What do you enjoy most and what are some\n     of the problems?\n\nThank you both. That is the end of the exam.\n\n\n\n\n", "linkedUnits": [1]}, {"id": "reference-165", "unit": 0, "skill": "Writing", "title": "Writing Overview", "label": "Reference", "pages": [165, 166, 167, 168, 169, 170, 171, 172, 173, 174, 175, 176, 177], "text": "\n One: Parts of an Essay\n\n 1) An essay has three basic parts:\n        1) the introduction\n        2) the body\n        3) the conclusion\n\n   The introduction is the first paragraph, the conclusion is the last paragraph, and the\n    body is made up of two paragraphs in between. This is called a four-paragraph essay.\n\n    In a typical four-paragraph essay, paragraph one introduces the topic and the main\n    idea or thesis statement, paragraphs two and three develop the topic, and paragraph\n    four concludes the essay\n 2) The introduction should follow a simple 3-step structure:\n\n        1. The Hook (1-2 sentences): Catch the reader's attention.\n        2. The Connecting Sentence (1-2 sentences): Give a little bit of background\n          information or context about the topic.\n        3. The Thesis Statement (1 sentence): Clearly state your main argument and the\n         two points you will discuss in your body paragraphs.\n\n    Tip: Avoid hooks that are too simple, like \"Today I am going to talk about...\" or\n    \"What is technology?\" Instead, try to use active verbs and precise vocabulary.\n\n 3) Two Common Types of Hooks\n\n         •  The Rhetorical Question: Ask an interesting question that makes the reader\n           think about your topic.\n             o  Example: \"Have you ever wondered how much social media actually\n               changes our real-world friendships?\"\n         •  The General Statement (The \"Big Picture\"): Start with a broad, universally\n          understood truth about life or society, then narrow it down to your specific\n           topic.\n             o  Example: \"In today’s fast-paced world, finding a healthy work-life\n                balance has become harder than ever.\"\n\n 4) The body should follow the T.E.E.R. Method.\n\n   T - Topic Sentence (1 sentence): It clearly states the main point you will discuss.\n   E - Explanation  / Evidence (2-3 sentences): Explain your point in more detail. Give\n    reasons or logical arguments.\n   E - Example (1-2 sentences): Provide a specific real-world example to prove your\n    point. This shows that you can apply your ideas.\n   R - Result  / Resulting Link (1 sentence): Summarize the paragraph and link it back\n     to your main thesis.\n\n 5) Essay Type   Body Paragraph 1          Body Paragraph 2\n                 The arguments in favor (the    The arguments against (the\n    For / Against\n                    benefits/pros) of the topic.     drawbacks/cons) of the topic.\n\n    Cause /      The main reasons or roots of   The results, consequences, and\n    Effect       why the situation happens.     impacts of that situation.\n\n\n\n    Problem  /    The specific details of the     The practical, actionable ways to fix\n    Solution      problem  and why it is a        or solve the problem.\n                    serious issue.\n\n                 The background, the build-up,\n    Narrative                              What happened right after the event\n                  and       the main dramatic\n                                               and how the story ended.\n                   event (climax).\n 6) Conclusion\n\n        •   It is important for an essay to have a good conclusion.\n        •  The introduction and the conclusion often share some of the same ideas in\n          order to remind the reader of the main idea of the essay.\n\n 7) Role               What it does\n   The Restated Thesis          Rewrite your main argument using different words.\n   The Summary                  Briefly mention the two main points from your body\n    paragraphs again.\n   The Conclusion Sentence     Your final prediction, recommendation, or reflection.\n\n    Tip: Never introduce new information in the conclusion.\n\n\n\n\n\n Two: Decode the Topic\n\n 1)      •  The first and most important step when writing an essay is to decode the\n            topic to determine the intended outline.\n         •  Writing topics generally give very clear clues about how your answer should\n           be constructed. It is important to follow the clear clues provided in the topic\n          when planning your answer.\n         •  You probably will not receive much credit for a response that does not cover\n             the topic as intended. Study the following essay topic:\n 2)  Essay Topic\n         •  Some people prefer large weddings with lots of people, while others prefer\n            small weddings with only very close friends and family. Discuss the\n           advantages of each type of wedding. Then indicate which you prefer and\n           why.\n 3)      •  As you read this topic, you should think about the organization of the\n            intended response that will be expected by test graders.\n         •  Your essay should start with an introduction, and that introduction should\n           mention large weddings, small weddings, and their advantages.\n         •  This introduction should be followed by supporting paragraphs that describe\n             the advantages of large weddings and the advantages of small weddings.\n         •  In the final paragraph, you should discuss whether you prefer large weddings\n             or small weddings and why.\n         •  This final paragraph serves as your conclusion because it brings together the\n            ideas in the previous paragraphs about large and small weddings.\n\n 4)  The following is  Paragraph 1:\n     an appropriate   INTRODUCTORY PARAGRAPH (mentioning the advantages of\n      outline for an     large and small weddings)\n      essay on the     Paragraph 2:\n      topic above:     FIRST SUPPORTING PARAGRAPH\n                            (listing and discussing the advantages of large weddings)\n                    Paragraph 3:\n                SECOND SUPPORTING PARAGRAPH\n                            (listing and discussing the advantages of small weddings)\n                    Paragraph 4:\n                CONCLUDING PARAGRAPH\n                       (whether you prefer large or small weddings and why)\n 5)  THE WRITING  ACTIVITY\n    TOPIC\n                       For each of the following writing topics, indicate the type of\n     Each writing      information that you will include in each paragraph of your\n      topic shows you   response.\n      exactly what\n     you should      Many students in the preparatory year develop a habit of reading\n      discuss and how  novels in English. Discuss the causes of this habit and the\n     you should        effects it has on language learning.\n      organize your\n      response. You     Introduction:                          the growing trend of\n     must carefully    reading for                                pleasure among\n     decode the topic  students\n      to determine the  Supporting Paragraph 1 (cause):    why students start reading\n      intended            (e.g. the                                    influence of social\n      organization of   media book                             recommendations or\n     your response.    univ ACTIVITY: Read the paragraph. Then answer the questions below.\n\n      Another characteristic that you must have if you are going to be a good student is a clear\n      understanding of your university. First of all, for you to be a successful learner, you must understand\n      where the institution places its academic standards. You must, for example, know if the university\n      most values research quality, punctual attendance, exam performance, or participation. If you\n      understand the institution's standards, then you will be able to do your work in accordance with\n      them. However, in addition to understanding a university's standards if you want to be a good\n       student, you must also understand the style for behaving within the campus. The atmosphere of the\n      classroom could, for instance, be strict or relaxed, with perhaps very formal or informal ways of\n      speaking to professors. It could also be either flexible or inflexible. In a very rigid type of major, you\n      follow the rules to the letter (i.e., arriving at the lecture precisely on time, using English only, and\n      submitting work before the deadline); in a less rigid major, the rules are not followed so precisely.\n\n 8)  ACTIVITY: Answer these questions from the above paragraph.\n\n       1. (A) Find the word student in the passage. How many times does it appear?\n         (B) How is the word student restated in the second sentence?\n\n       2. (A) Find the word standards in the passage. How many times does it appear?\n         (B) Which pronoun refers to the noun standards?\n\n       3. (A) Find the word atmosphere in the passage. Atmosphere is a rephrasing of which word in the\n             previous sentence?\n         (B) What pronoun refers to atmosphere?\n\n       4. (A) Find the transition expression that indicates the first way you must understand your\n               university.\n         (B) Find the transition sentence that relates the first way to the sec an thrive. By choosing to cooperate\n                               rather than compete, students develop the essential social and professional\n                                  skills needed for a successful career. Ultimately, we achieve much more\n                      when we work as a team than when we view our peers as obstacles to our\n                     own success.\n\n 4)   In this conclusion, the writer clearly indicates the belief that cooperation and teamwork are more\n      important than individual rivalry. The writer also refers to the experiences in English and Science\n      labs that support this position.\n\n 5)   The following         Conclusion for Introduction 2\n      paragraph is a\n      conclusion to the     To sum up, it is clear that a strong competitive drive is the most effective\n      essay that began with  way to ensure academic excellence. Although working in groups has its\n    INTRODUCTION 1   place, it is the personal desire to be the best that prevents laziness and forces\n       (in Skill 4).           a student to reach their highest potential. My experiences in math and\n                            chemistry prove that the pressure of outshining others provides the\n                             necessary spark to work harder and study longer. In the end, it is the spirit of\n                             competition that pushes us past our limits and prepares us to succeed in a\n                           world that rewards only the most dedicated individuals.\n\n 6)   In this conclusion, the writer clearly indicates the belief that a strong competitive drive is more\n      important than working in groups. The writer also refers to the experiences in math and\n      chemistry that support this position.\n\n\n\n\n\n 7)  THE             ACTIVITY: Write concluding paragraphs for the essays that you\n    CONCLUDING       introduced in Skill 4. In each concluding paragraph, circle your overall idea.\n    PARAGRAPH        Underl and\nparagraph structure. The writer can express opinions and make recommendations clearly\nbut may still make minor language errors.\n\nWriting Objectives\nBy the end of this task, students will be able to:\n    •  Write a clear 4-paragraph review with logical organization\n    •  Describe when, where, and why a product or service was used\n    •  Explain personal experiences with specific details and examples\n    •  Use appropriate evaluative and descriptive language\n    •  Give a clear recommendation with reasons\n    •  Maintain a formal or semi-formal tone (B2 level)\n    •  Use the appropriate grammar correctly\n    •  Produce coherent and well-connected writing\n    •  Avoid informal language and irrelevant content\n\n\n\n\n\nTask Requirements\n\nTask Type: Product or Service Review\nWord Count: 180–240 words\nTime Allowed: 45 minutes\nNumber of Paragraphs: 4\n\nStructure:\nParagraph 1 – Introduction: Introduce the product or service (name, type, and general\npurpose). Mention when and where it was used, and state the overall purpose of the\nreview.\n\nParagraph 2 – Body 1 (Description of the Experience): Describe the experience in detail.\nExplain what happened, including specific facts about the service (e.g., booking process,\npunctuality, staff behavior, vehicle condition).\n\nParagraph 3 – Body 2 (Evaluation and Issues): Explain the problems or negative aspects\nof the experience. Provide specific examples to support your claims. Highlight what went\nwrong and why it was unsatisfactory.\n\nParagraph 4 – Conclusion: Summarize your overall impression. State clearly whether you\nwould recommend the service to others, and give a final reason or warning based on your\nexperience.\n\n\n\n\n\nLanguage Requirements\n\n    •  Use descriptive and evaluative language:\n         o  Positive: reliable, punctual, professional, courteous, efficient\n         o  Negative: unreliable, late, unprofessional, rude, disorganized, overpriced\n    •  Use past tenses (Past Simple, Past Continuous) to describe the experience\n    •  Use Present Simple for general facts and recommendations\n    •  Use opinion phrases: In my opinion, I believe, I would/would not recommend\n    •  Maintain a formal or semi-formal tone (no contractions)\n    •  Avoid emotional exaggeration; stick to factual evaluation\n    •  Use clear explanations and logical reasoning\nAssessment:\n    •  Organization and clarity\n    •  Language range and accuracy\n    •  Grammar control (especially past tenses)\n    •  Spelling, punctuation, capitalization\nImportant:\n    •  Stay focused on the service and your personal experience only\n    •  Do not memorize reviews\n    •  Use original and realistic details\n    •  Avoid unrelated details or off-topic complaints\n\n\n\n\n\nProduct/Service Review\n\nYou recently went on holiday to Britain. When you flew\nback from Leeds Bradford Airport to Dammam Airport,\nyou used Ken’s Leeds Bradford Airport Taxi Service\n(see photo) to get to the airport.\n\nYou were very unhappy with your experiences with Ken’s\nLeeds Bradford Airport Taxi Service.\n\n•    Write a product or service review.\n•    Write about why, where and when you used this product or service.\n•    Write about your experiences, saying whether you would recommend it to others.\n•    Write from 180 to 240 words.\n•    Write 4 paragraphs.\n\n_______________________________________________________________________________________\n\n_______________________________________________________________________________________\n\n_______________________________________________________________________________________\n\n_______________________________________________________________________________________\n\n_______________________________________________________________________________________\n\n_______________________________________________________________________________________\n\n_______________________________________________________________________________________\n\ Paragraph 1 – Introduction: Introduce the topic, explain the situation briefly, and include a clear thesis\nstatement showing that both sides of the issue will be discussed.\nParagraph 2 – Body 1 (Arguments For): Present the advantages or supporting opinions related to the topic.\nExplain and support ideas with examples or reasons.\nParagraph 3 – Body 2 (Arguments Against): Present the disadvantages or opposing opinions related to the\ntopic. Explain and support ideas with examples or reasons.\nParagraph 4 – Conclusion: Summarize both viewpoints and give a balanced final opinion, recommendation,\nor insight.\n\nLanguage Requirements:\n   ▪  Use contrast and comparison linkers:\n         however, although, on the other hand, while, whereas, despite\n   ▪  Use addition linkers:\n          furthermore, moreover, in addition\n   ▪  Use Present Simple for general facts and opinions\n   ▪  Use Present Perfect for recent developments or changes over time\n   ▪  Maintain a formal academic tone (no contractions)\n   ▪  Avoid personal stories and informal language\n   ▪  Use clear explanations and logical reasoning\n\nAssessment:\n   ▪  Organization and clarity\n   ▪  Language range and accuracy\n   ▪  Grammar control\n   ▪   Spelling, punctuation, capitalization\n\n\nImportant:\n   ▪  Discuss both sides of the topic clearly\n   ▪  Keep a balanced academic tone\n   ▪  Do not memorize essays\n   ▪  Use original and logical ideas\n   ▪  Avoid unrelated details\n\n\n\n For and Against Essay\n\n 1)  A for–and–against  Students must:               Paragraph 1 – Introduction\n      essay discusses two      •   present both viewpoints  Introduce the topic and include a thesis\n       sides of a topic or            clearly                  statement showing that both sides will be\n       issue. It explains        •  organize ideas logically   discussed.\n      arguments for and       •  support arguments with  Paragraph 2 – Arguments For\n       against the topic             explana anced final opinion or recommendation.\n\n     The conclusion should include:\n         •   restating the topic\n         •  summarizing both sides\n         •  giving a final opinion or recommendation\n\n     Example Conclusion\n       In conclusion, online learning has both advantages and disadvantages. It offers flexibility and\n      convenient access to education; however, it may reduce communication and motivation for some\n       students. Therefore, students should use online learning responsibly and develop effective study\n       habits to achieve better academic success.\n\n 5)  ACTIVITY 1: Classify    Topic\n      the Arguments\n                                   University students should work part-time while studying.\n       Skill: Distinguishing                            Example: Students can improve their communication skills. F\n      between “for” and\n       against”                          1.  Students learn responsibility. _____\n\n                                          2.  Part-time jobs may reduce study time. _____       Instructions: Read the\n       ideas below. Write:                                          3.  Students can earn money for expenses. _____\n     F = argument FOR\n    A = argument AGAINST        4.  Working may cause stress and fatigue. _____\n\n                                          5.  Students gain practical experience. _____\n\n                                          6. Some students may find it difficult to attend all lectures\n                                           regularly due to work commitments, which can affect their\n                                     academic performance. _____\n\n                                          7.  Balancing a job alongside university studies can help students\n                                      develop stronger organizational and time-management skills,\n                                        although it may also increase their workload. _____\n\n         • allows students to manage their monthly budget more efficiently\n                                         • availability of discounted monthly or student travel passes\n       Instructions: Use the                                         • helps create a more affordable and sustainable lifestyle\n       notes to complete the\n      paragraph.                              Linking words you may use:\n                                         • for example\n                                         • as a result\n                                         • in addition\n\n                             _________________________________________________________\n\n                             _________________________________________________________\n\n                             _________________________________________________________\n\n                             _________________________________________________________\n\n                             _________________________________________________________\n\n                             _________________________________________________________\n\n                             _________________________________________________________\n\n\n                             _________________________________________________________\n\n                             _________________________________________________________\n\n                             _________________________________________________________\n\n                             _________________________________________________________\n\n\n 10)  Model Essay – For and Against\n\n     Some students choose to take a gap year before starting university, while others begin their studies\n       immediately. Discuss the advantages and disadvantages of both choices. Which option do you prefer\n      and why?\n\n      Deciding whether to go straight to university or take a year off is a difficult choice. A gap year\n      allows students to work, save money, and see the world, which often leads to greater maturity. On\n       the other hand, starting university immediately keeps a student’s academic skills sharp. Both paths\n      have merit, but the choice depends on an individual's readiness.\n\n     The main advantage of a gap year is the perspective it provides. Many 18-year-olds are not sure\n      what they want to study. By working for a year, they can discover their true interests. However, a\n      major disadvantage is that students might forget their math or writing skills after being out of school\n       for so long. This can make the first year of university much harder than it needs to be.\n\n      Furthermore, for some students, a break is necessary to avoid burnout. After twelve years of school,\n      a year of travel can refresh their motivation. For others, the lack of structure during a gap year leads\n       to laziness. Therefore, a gap year is only useful if it is planned with clear goals.\n\n       In summary, the decision to take a gap year offers a unique chance to gain maturity before the rigors\n       of university. Despite the risks of losing academic momentum, the real-world perspective gained\n      through work or travel is invaluable. Starting university with a clear sense of purpose outweighs the\n       benefit of beginning studies immediately.\n\n 11)  Analyzing the For and Against Model Essay (see #11 above)\n\n           1. What is the main purpose of this essay?\n            Begin with: The purpose is… __________________________________________________\n\n            __________________________________________________________________________\n\n           2. What is the thesis statement? __________________________________________________\n\n            __________________________________________________________________________\n\n           3. What kind of hook does the writer use? Circle the best answer.\n\n           •   question\n\n           •   interesting observation\n\n  Second main cause/effect with supporting details.\nParagraph 4 – Conclusion: Summarize, restate thesis, give final insight.\n\nLanguage Requirements:\n   ▪  Use cause/effect linkers (because of, as a result, therefore, consequently, due to)\n   ▪  Use Present Simple (facts) and Present Perfect (changes)\n   ▪  Neutral tone (no contractions)\n   ▪  Avoid storytelling, personal opinions, and informal language\n   ▪  Use general examples and logical reasoning\n\nAssessment:\n   ▪  Organization and clarity\n   ▪  Language range and accuracy\n   ▪  Grammar control\n   ▪   Spelling, punctuation, capitalization\n\nImportant:\nStay focused on cause and effect only\nDo not memorize essays\nEnsure original, logical ideas\n\n\n\n\n\n Writing Three: Cause and Effect Essay\n\n 1)  A cause-and-effect essay explains why           Students should:\n      something happens (causes) and/or what             •  explain ideas clearly\n      happens because of it (effects).                     •  organize ideas logically use linking\n                                                      words correctly\n                                                      •  support ideas with examples\n                                                      •  use neutral language\n                                                      •  use accurate grammar and punctuation\n 2)   Option A – Effects Essay                    Option B – Causes Essay\n\n     Paragraph 1 – Introduction                 Paragraph 1 – Introduction\n      Introduce the topic and state the main effects.      Introduce the topic and state the main causes.\n     Paragraph 2 – Effect 1                     Paragraph 2 – Cause 1\n      Explain the first effect and support it with         Explain the first cause and support it with\n      examples.                                     examples.\n     Paragraph 3 – Effect 2                     Paragraph 3 – Cause 2\n      Explain the second effect and support it with      Explain the second cause and support it with\n      examples.                                     examples.\n     Paragraph 4 – Conclusion                   Paragraph 4 – Conclusion\n     Summarize the main points and give a final      Summarize the main points and give a final\n     comment or recommendation.                comment or recommendation.\n\n\n 3)   Paragraph 1 – Introduction\n     The introduction presents the topic and the essay's main idea.\n\n     The introduction should:\n         •  introduce the topic\n         •  give brief background information\n         •  include a clear thesis statement\n\n     Example Thesis Statements\n         •   (Effect) Excessive smartphone use affects students’ grades and sleep quality.\n         •  (Cause) Students experience stress because of heavy coursework and poor time\n            management.\n\n     Example Introduction\n      Smartphones and social media are now an important part of modern life, especially for young adults.\n       In Saudi Arabia, university students often spend many hours on their devices every day. Although\n       these technologies are useful for communication and learning, excessive use can create serious\n      problems for students’ academic performance and sleep habits.\n\n\n\n\n\n 4)   Paragraph 2 – Body Paragraph 1             Paragraph 3 – Body Paragraph 2\n     Body Paragraph 1 explains the first main cause   Body Paragraph 2 explains the second main\n       or effect from the thesis statement.               cause or effect from the thesis statement.\n\n     The paragraph should include:                The paragraph should include:\n         •  a topic sentence                            •  a topic sentence\n         •  explanations                               •  explanations\n         •  an example                                •  an example\n         •  a concluding sentence                      •  a concluding sentence\n\n     Example Topic Sentences                  Example Topic Sente e competitive.\n\n           To conclude, the shift toward online shopping is driven by an irreversible demand for\n      convenience and competitive pricing. While local malls and traditional markets face significant\n       challenges, they are adapting by offering social experiences. The evolution of the Saudi retail\n      landscape reflects a broader global trend toward a more integrated, digital-first economy.\n 12)  Analyzing the Cause and Effect Model Essay (see #11 above)\n\n           1. What is the main purpose of this essay?\n            Begin with: The purpose is… __________________________________________________\n\n            __________________________________________________________________________\n\n           What is the thesis statement?\n\n            __________________________________________________________________________\n\n            __________________________________________________________________________\n\n           3.  Is the essay mainly focused on causes, effects, or both?\n\n            __________________________________________________________________________\n\n\n           4. What cause of online shopping is explained in the introduction?\n\n            __________________________________________________________________________\n\n            __________________________________________________________________________\n\n           5.  Write the topic sentence of Paragraph 2.\n\n            __________________________________________________________________________\n\n            __________________________________________________________________________\n\n           6. What social effect of online shopping does the writer describe?\n\n            __________________________________________________________________________\n\n            __________________________________________________________________________\n\n           7.  In Paragraph 2, how are malls adapting to changes in shopping habits?\n\n            ____________________ y identifies a problem, explains its causes and effects, and proposes practical solutions. Ideas are\nlogically developed, and the writing shows control of basic academic style, linking devices, and paragraph\nstructure. The writer can explain problems and suggest solutions clearly but may still make minor language\nerrors.\n\nWriting Objectives\nBy the end of this task, students will be able to:\n   ▪  Write a clear 4-paragraph essay with logical organization\n\n   ▪   Identify and explain a problem clearly\n\n   ▪  Suggest realistic and relevant solutions\n\n   ▪  Use appropriate linking words\n\n   ▪  Develop ideas with explanations and examples\n\n   ▪  Use a neutral tone (B2 level)\n\n   ▪  Use the appropriate grammar correctly\n\n   ▪  Produce coherent and well-connected writing\n\n    ▪  Avoid informal language and irrelevant content\n\n\nTask Requirements\nTask Type: Problem–Solution Essay\nWord Count: 180–240 words\nTime Allowed: 45 minutes\nNumber of Paragraphs: 4\n\nStructure:\nParagraph 1 – Introduction: Introduce the topic, explain the situation, and include a clear thesis statement\nidentifying the problem and the proposed solutions.\nParagraph 2 – Body 1 (Problem): Explain the main problem in detail, including its causes and effects,\nsupported with explanations or examples.\nParagraph 3 – Body 2 (Solutions): Present one or two realistic solutions to the problem. Explain how each\nsolution works and support it with examples or reasons.\nParagraph 4 – Conclusion: Restate the problem and summarize the solutions. End with a final\nrecommendation, suggestion, or insight about the issue.\n\nLanguage Requirements\n   ▪  Use problem/solution linkers:\n\n       Problem: leads to, causes, results in\n       Solution: should, can, need to, one solution is\n   ▪  Use Present Simple (facts) and Present Perfect (recent changes or developments)\n\n   ▪  Maintain a neutral tone (no contractions)\n\n   ▪  Avoid personal stories and informal language\n\n   ▪  Use clear explanations and logical reasoning\n\nAssessment:\n   ▪  Organization and clarity\n\n   ▪  Language range and accuracy\n\n   ▪  Grammar control\n\n   ▪   Spelling, punctuation, capitalization\n\n\nImportant:\n   ▪  Stay focused on the problem and its solutions only\n\n   ▪  Do not memorize essays\n\n   ▪  Use original and logical ideas\n\n   ▪  Avoid unrelated details\n\n\n\n\n\n Writing Four: Problem and Solution Essay\n\n 1)  A problem–solution essay      Students should:                Paragraph 1 – Introduction\n      explains a problem and            •  explain the problem         Introduce the topic and include\n      suggests ways to solve it.                clearly                    a thesis statement identifying\n                                      •  organize ideas logically      the problem and possible\n                                      •  suggest realistic solutions    solutions.\n                                      •  support ideas with         Paragraph 2 – Problem\n                                                                     Explain the main problem,                                        examples\n                                      •  use neutral language        including its causes or effects,\n                                                                and support ideas with                                      •  use correct grammar\n                                                                     examples.\n                                                            Paragraph 3 – Solutions\n                                                                     Explain one realistic solution\n                                                                and how it can improve the\n                                                                                   situation.\n                                                            Paragraph 4 – Conclusion\n                _____\n\n 10) Model Essay – Problem and Solution\n\n    Many students rely heavily on AI tools to complete assignments. Describe the problems this creates\n     and suggest practical solutions universities can use to address the issue.\n\n          The rise of AI tools like ChatGPT has made it easier for students to complete assignments,\n      but it has also created a crisis of academic honesty. Although AI tools like ChatGPT can help students\n     complete assignments more easily, relying on them too much can weaken critical thinking skills and\n      create problems with academic honesty.\n\n          The problem is that AI provides \"perfect\" answers without the student having to do any\n      research. This makes students lazy and prevents them from developing their own \"voice\" in writing.\n   A practical solution is for universities to change how they test students. Instead of asking for take-\n    home essays, professors should require more in-class, handwritten assignments and oral exams.\n\n                If a student has to explain their ideas out loud, the teacher can easily see if they actually\n      understand the material. Additionally, universities could use AI-detection software, but the real\n      solution is teaching students to value their own intellectual effort. Promoting academic integrity is\n     about more than just rules; it is about learning.\n\n          To sum up, the threat that AI dependency poses to critical thinking requires a shift in how we\n      assess work. By implementing more in-class assessments and oral exams, universities can ensure\n      students engage with the material. Promoting academic integrity in the age of AI is about\n     encouraging students to value their own intellectual development.\n\n 11) Analyzing the Problem and Solution Model Essay (see #10 above)\n\n          1. What is the main purpose of this essay?\n           Begin with: The purpose is… _______________________________________ ________________________________________\n\n           __________________________________________________________________________\n\n         10. In the space below, write your own additional solution to this problem.\n\n           __________________________________________________________________________\n\n           __________________________________________________________________________\n\n           __________________________________________________________________________\n\n\n\n\n\nProblem and Solution\n\nDo you agree or disagree with the following statement?\n\nJoining a university sports club or student organization is the best way for first -year\nstudents to make new friends. Use specific reasons and examples to support your position.\n\nWrite from 180 to 240 words. Write 4 paragraphs. Time: 45 minutes.\n__________________________________________________________________________\n\n__________________________________________________________________________\n\n__________________________________________________________________________\n\n__________________________________________________________________________\n\n__________________________________________________________________________\n\n__________________________________________________________________________\n\n__________________________________________________________________________\n\n__________________________________________________________________________\n\n__________________________________________________________________________\n\n__________________________________________________________________________\n\n__________________________________________________________________________\n\n__________________________________________________________________________\n\n__________________________________________________________________________\n\n__________________________________________________________________________\n\n__________________________________________________________________________\n\n_ dependent (B2, adjective) (AWL) – relying on someone or something for help\nmuppet (C1, noun) – a foolish or incompetent person (informal UK slang)\n\n\nText 2 – Reading Skills and Question Types\nascribe (C1, verb) (AWL) – to attribute or explain something as being caused by a particular reason\ncritical (B2, adjective) (AWL) – involving careful judgement; able to analyse and evaluate information\nengage (B2, verb) (AWL) – to actively interact with or focus attention on a text or idea\nmemorise (B2, verb) – to learn something exactly so that it can be recalled from memory\nrote (C1, adjective) – learning by repetition without understanding the underlying meaning\nextract (B2, verb) (AWL) – to draw out or obtain meaning from something\nlargesse (C1, noun) – generosity in giving or willingness to provide things\nreferent (C1, noun) (AWL) – the specific person, thing, or idea that a pronoun or word refers to\nparaphrase (B2, verb) (AWL) – to restate in different words, usually to simplify or clarify meaning\n\n\nText 3 – Reading and Personal Engagement\nfacepalm (C1, noun) – a gesture or reaction of embarrassment, frustration, or disbelief\ngeneralise (B2, verb) (AWL) – to make a broad statement or conclusion based on limited examples\nshift (B2, verb) (AWL) – to change the focus or direction of a discussion\nengaged (B2, adjective) (AWL) – fully involved and paying close attention to something\ncomprehend (B2, verb) – to understand the meaning of something\nmotivation (C1, noun) (AWL) – the reason or driving force behind an action\nknackered (C1, adjective) – extremely tired or exhausted (informal UK slang)\nfamiliarity (B2, noun) (AWL) – good knowledge or understanding of something through repeated\nexperience\ncommand (B2, noun) – the ability to use or control something effectively\n\n\nText 4 – Professor Norman Smith on Smartphones\nprohibit (B2, verb) (AWL) – to officially forbid or ban something by law or rule\npossession (B2, noun) – the state of having or owni function renderMatching(outer){outer.replaceChildren();let words=active.vocab;state.matching||={group:0,answers:{},submitted:{},orders:{}};let m=state.matching,g=m.group,start=g*5,items=words.slice(start,start+5);m.orders[g]||=shuffled(items.length);m.answers[g]||={};let answers=m.answers[g],submitted=!!m.submitted[g],selected='';outer.append(E('h3','Match words and meanings'),E('p','Drag a word to its meaning, or select a word and then select a gap.','muted'));let toolbar=E('div',undefined,'actions');toolbar.append(B('Flashcards',()=>renderActivityVocabulary()),E('span','Set '+(g+1)+' of '+Math.ceil(words.length/5),'muted'));outer.append(toolbar);let bank=E('div',undefined,'bank');m.orders[g].forEach(i=>{let b=B(items[i].word,()=>{selected=String(i);bank.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});b.draggable=!submitted;b.ondragstart=e=>e.dataTransfer.setData('text/plain',String(i));bank.append(b)});outer.append(bank);items.forEach((v,i)=>{let row=E('div',undefined,'match-row');row.append(E('span',(i+1)+'. '+v.meaning));let controls=E('div',undefined,'actions'),gap=B(answers[i]!==undefined?items[answers[i]].word:'Select gap',()=>{if(selected!==''&&!submitted)set(Number(selected))},'drop');gap.setAttribute('aria-label','Match for meaning '+(i+1));gap.ondragover=e=>e.preventDefault();gap.ondrop=e=>{e.preventDefault();let data=e.dataTransfer.getData('text/plain');if(/^\d+$/.test(data)&&Number(data)<items.length&&!submitted)set(Number(data))};gap.disabled=submitted;function set(value){answers[i]=value;save();gap.textContent=items[value].word;select.value=String(value)}let select=E('select');select.setAttribute('aria-label','Word for meaning '+(i+1));let prompt=E('option','Choose a word');prompt.value='';select.append(prompt);m.orders[g].forEach(k=>{let opt=E('option',items[k].word);opt.value=String(k);select.append(opt)});select.value=answers[i]===undefined?'':String(answers[i]);select.disabled=submitted;select.onchange=()=>{if
