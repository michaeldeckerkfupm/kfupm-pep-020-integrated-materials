rb", "meaning": "to stay permanently without a solution", "group": "Text 25", "page": 239}], "vocabularyPages": [239], "topic": "Marco Polo"}, {"id": "reading-26", "unit": 6, "skill": "Reading", "title": "Text 26", "label": "Text 26", "pages": [107, 108], "text": "                                            Text 26\n     Reading\n\n           ________________ (See the appropriate question.)\n\n     Eric Smith remembers life before the Preston Bypass. ‘We lived\n     on the main road through town,’ he says. ‘And you couldn’t move\n      for the traffic.’  It was the mid-1950s, and the English town of\n     Preston was at the confluence of three north-south streams of cars:\n 5   holidaymakers travelling to the seaside resort town of Blackpool,\n      tourists  visiting  the Lake  District,  England’s  area  of  natural\n     beauty, and traffic between England and Scotland. It had become\n     famous for its traffic jams. ‘It was a nightmare,’ says Eric Smith.\n    ‘When  they  were  switching  on  Blackpool  Illuminations, you\n                                                                                     The Presto n Bypass\n 10  couldn’t sleep for all the drivers beeping their horns and stuck in a\n     jam  stretching  30  miles down  the  road  to  Manchester. Ohh  the  traffic! The\n     congestion! Indescribable!  It was  a disgrace!’ Understandably, Eric Smith was\n     delighted when, on 5 December, 1958, the Preston Bypass, a 13.3 kilometre stretch\n      of highway and Britain’s very first motorway, opened for the first time. ‘Finally!’ he\n 15  says. ‘I could sleep at night!\n\n    ________________ (See the appropriate question.) This was a main road that had\n      originally opened in 1926, and which was no longer adequate to deal with all the\n     north-south traffic.  It had become clear in the 1930s that, to keep pace with the\n 20  growth in road traffic, Britain’s road network needed to exp and. There needed not\n     only to be longer roads, but also wider roads, with two or three lanes in either\n      direction. In 1938, engineer James Drake visited Germany, and was inspired by the\n     autobahns he saw there, the latest in highway technology. He drew up plans for his\n    own 13.3 kilometre stretch of highway and submitted them to Lancashire County\n 25  Council for planning approval. In Drake’s plan, the volume of north -south traffic\n     along the A6 and through Preston centre would be reduced. A bypass would be built\n      that would, literally, bypass Preston, leaving the original A6 at Bamber Bridge and\n      re-joining it 13.3 kilometres later at Broughton. Construction work began in 1956.\n\n 30   It took two years. In total, 3,400,000 tonnes of earth were dug out of the ground, and\n     668,000 tonnes of material used in the motorway’s construction. The foundation\n     consisted  of  a base  layer  of  shale, with  a thickness depending on  the ground\n     conditions. On top of this was added wet mix (the mixture obtained when water is\n     added to cement, sand, and coarse aggregate) to a depth of 23 centimetres. This was\n 35  covered with a 7.5 centimetre layer of tarmac, and finally a 2.5 centimetre layer of\n      asphalt. The motorway’s construction also required that 22 new bridges be built. To\n      alleviate driver boredom, these were all painted in different colours. The motorway’s\n     construction period had to be extended by 25% due to 1956 and 1957’s heavy r ainfall.\n      In  total, 774 people worked on the project, 750 labourers and 24\n 40  engineers. It utilised 50 tractors, 24 excavators, 12 dump trucks and\n     100 lorries. It was finally opened to public traffic by British prime\n     minister Harold MacMillan on 5 December, 1958.\n\n    The Preston Bypass was the first motorway in Britain, but it was not\n 45  the last.  It is now part of a 3,700-kilometre network of motorway,\n     having been subsumed into the 373.7-kilometre M6 motorway. It is       The M6\n     believed that the M6 is used by 18.3 million vehicles every year.\n", "questions": [{"n": 1, "stem": "The MAIN POINT of Paragraph One (Lines 1 – 15) is to show ______.", "options": ["how necessary the Preston Bypass was", "some of Britain’s tourist attractions", "that Eric Smith is an angry old man", "what a great town Preston is"], "key": 0, "explanation": "shows how necessary the Preston Bypass was by describing traffic nightmare before it opened"}, {"n": 2, "stem": "In Line 4, confluence means the ______.", "options": ["benefit something has brought to people", "effect something has on something else", "final point on any kind of journey", "place where two or more things meet"], "key": 3, "explanation": "place where two or more things meet – three streams of traffic came together at Preston"}, {"n": 3, "stem": "In Line 7, It refers to ______.", "options": ["Blackpool", "Preston", "Scotland", "the Lake District"], "key": 1, "explanation": "Preston was famous for its traffic jams"}, {"n": 4, "stem": "Eric Smith was made happy by ______.", "options": ["a reduction in the noise made by cars", "a visit to Blackpool Illuminations", "being able to travel around much faster", "living in a beautiful part of the world"], "key": 0, "explanation": "he was delighted because he could finally sleep at night without noise from traffic"}, {"n": 5, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 17 – 28)?", "options": ["Eric Smith’s road had only been designed to be used by horses.", "He later moved to Paris and became a famous writer and poet.", "His road had originally been built 2,000 years previously, by the ancient Romans.", "Up till that day, traffic had had to use the A6."], "key": 3, "explanation": "paragraph two explains that before the bypass, traffic had to use the A6"}, {"n": 6, "stem": "James Drake was ______.", "options": ["a friend of Eric Smith’s", "a German road designer", "in charge of all British roads", "the Preston Bypass’ architect"], "key": 3, "explanation": "James Drake drew up plans for the Preston Bypass, making him its architect/designer"}, {"n": 7, "stem": "To bypass something (Line 27) means to ______.", "options": ["avoid something by going round it", "destroy something completely", "dig a long tunnel under something", "reduce the importance of something"], "key": 0, "explanation": "to avoid something by going round it – a bypass goes around a town"}, {"n": 8, "stem": "What is the MAIN SUBJECT of Paragraph Three (Lines 30 – 42)?", "options": ["Basic facts about the construction of the Preston Bypass.", "How long it took the build the Preston Bypass.", "The different layers of materials used in the Preston Bypass.", "The route used in the construction of the Preston Bypass."], "key": 0, "explanation": "paragraph three gives basic construction facts: materials, labour, equipment, time"}, {"n": 9, "stem": "To subsume (Line 46) means to ______.", "options": ["bury something deep in the ground", "continue at the side of something else", "include something in a bigger thing", "stop using something"], "key": 2, "explanation": "include something in a bigger thing – the Preston Bypass is now part of the M6"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Changes in British Transport Policy", "Eric Smith’s Feelings", "Roads in Britain", "The Preston Bypass"], "key": 3, "explanation": "the article focuses entirely on the Preston Bypass – its history, construction, and legacy"}], "vocab": [{"word": "confluence", "meta": "C1, noun", "meaning": "the place where two or more things meet", "group": "Text 26", "page": 239}, {"word": "holidaymakers", "meta": "B2, noun", "meaning": "people travelling away for a vacation", "group": "Text 26", "page": 239}, {"word": "traffic jams", "meta": "B2, noun", "meaning": "long lines of vehicles moving very slowly", "group": "Text 26", "page": 239}, {"word": "beeping", "meta": "B2, verb", "meaning": "making a short, loud noise using a vehicle horn", "group": "Text 26", "page": 239}, {"word": "congestion", "meta": "B2, noun", "meaning": "extreme crowding, especially of roads", "group": "Text 26", "page": 239}, {"word": "indescribable", "meta": "C1, adjective", "meaning": "so extreme that it cannot be adequately expressed", "group": "Text 26", "page": 239}, {"word": "disgrace", "meta": "B2, noun", "meaning": "something unacceptable or shameful", "group": "Text 26", "page": 239}, {"word": "keep pace", "meta": "B2, verb", "meaning": "to progress at the same speed as something else", "group": "Text 26", "page": 239}, {"word": "autobahns", "meta": "B2, noun", "meaning": "the high-speed highway system in Germany", "group": "Text 26", "page": 239}, {"word": "foundation", "meta": "B2, noun · AWL", "meaning": "the solid base upon which something is built", "group": "Text 26", "page": 239}, {"word": "shale", "meta": "C1, noun", "meaning": "a soft sedimentary rock that splits easily", "group": "Text 26", "page": 240}, {"word": "aggregate", "meta": "C1, noun", "meaning": "rough granular materials used in construction", "group": "Text 26", "page": 240}, {"word": "alleviate", "meta": "C1, verb", "meaning": "to make less severe or unpleasant", "group": "Text 26", "page": 240}, {"word": "subsume", "meta": "C1, verb", "meaning": "to absorb or incorporate into a larger structure", "group": "Text 26", "page": 240}, {"word": "vehicles", "meta": "B2, noun", "meaning": "machines used for transporting people or goods", "group": "Text 26", "page": 240}], "vocabularyPages": [239, 240], "topic": "Preston Bypass"}, {"id": "reading-27", "unit": 6, "skill": "Reading", "title": "Text 27", "label": "Text 27", "pages": [110, 111], "text": "                                                     Text 27\n     Reading\n\n         ________________ (See the appropriate           Leeds and Liverpool Canal\n                          question.)\n\n    On the 2nd of July, 1766, during a public meeting at\n      the Sun Inn, Bradford,  a proposal was made. A\n     canal should be built that would link the Yorkshire\n 5    cities of Bradford and Leeds with the west coast\n      port city of Liverpool. Those present at the meeting\n     saw clearly the benefits of such a link. The North\n      of England was then  in  the  throes  of profound\n     socioeconomic change: the early Industrial Revolution was making  it the world’s\n 10   first industrialised society, and the burgeoning factories of Liverpool desperately\n     needed access to a steady supply of coal from the coalfields of Yorkshire. Likewise,\n      the textile manufacturers of Yorkshire needed to supply their mills with imported\n     cotton shipped through the port of Liverpool. A Mr John Longbotham was engaged\n      to survey a potential route.\n     ________________  (See  the  appropriate  question.) The  canal’s  backers  from\n     Liverpool were unhappy with that favoured by the Leeds and Bradford businessmen,\n     which followed the Ribble Valley through Preston. They felt  it ran too far to the\n      north, missing key towns such as Wigan. Their counter -proposal was rejected by the\n 20  ever-parsimonious men from Yorkshire: the valley crossing at Burnley would be far\n     too costly for their liking, and money did not grow on trees. Finally, a compromise\n      solution was reached. The original plan was amended with a diversion through Wigan.\n      In 1768, the project was finalized. The canal would have a length of 204 kilometres,\n     and the building cost was estimated at £259,777 (equivalent to about £32.67 million\n 25  in today’s money.) Work began on the 5 th of November, 1770.\n\n     The canal finally opened in 1816. It wends its way on a circuitous route starting at\n     Leeds’ Granary Wharf, running north-west through Shipley, Keighley and Silsden to\n     Skipton, and then making a sharp bend south-west to Burnley. From here,  it runs\n 30  gently west to Preston. After Preston  it turns directly south to Blackburn, and then\n     west to Liverpool’s Stanley Dock, where it terminates. The canal is unusual in that\n        it avoids tunnels wherever possible, instead using locks to deal with the region’s\n    many  hills, the most spectacular example being the famous Five -Rise Locks  at\n     Bingley.\n     Astonishingly, the canal remained in regular use by industry for the next 150 years,\n     transporting goods between Leeds and Liverpool. Not even the development of the\n     railway in Britain from the 1830s onwards managed to put a dent in its popularity. It\n     was only in the 1950s, when power stations switched to natural gas rather than coal\n 40  that industrial use of the canal began to dwindle: natural gas had its own pipeline.\n     The final recorded industrial use of the canal occurred in 1972, with a last shipment\n      of coal to Wigan Power Station. It was the end of an era.\n\n     Nowadays, the canal is a popular beauty spot. It’s a place to relax and enjoy nature.\n 45  Cyclists cycle there, dog-walkers walk their dogs there, and if it has any industry at\n       all, it is tourism. Hiring a boat for a week is a popular leisure activity. You can spend\n      a week living and boating along the canal, all the while appreciating this quiet and\n     gentle reminder of Britain’s industrial heritage.\n", "questions": [{"n": 1, "stem": "What is the MAIN SUBJECT of Paragraph One (Lines 1 – 14)?", "options": ["The early Industrial Revolution in Britain.", "The origins of and reasons for the canal.", "The Sun Inn, Bradford, on 2 n d July, 1766.", "The Yorkshire cities of Bradford and Leeds."], "key": 1, "explanation": "paragraph one explains the origins of the canal and the economic reasons for building it"}, {"n": 2, "stem": "What does it in Line 9 refer to?", "options": ["profound socioeconomic change", "the early Industrial Revolution", "The North of England", "the throes of profound socioeconomic change"], "key": 2, "explanation": "the North of England was in the throes of profound socioeconomic change"}, {"n": 3, "stem": "If something is burgeoning (Line 10), it is______.", "options": ["becoming old and out-of-date", "developing very quickly", "intended to protect the environment", "losing a great deal of money"], "key": 1, "explanation": "developing very quickly – the factories of Liverpool were growing rapidly"}, {"n": 4, "stem": "MOST PROBABLY, Mr John Longbotham was ______.", "options": ["a textile manufacturer", "an engineer", "somebody who worked at the Sun Inn, Bradford", "the owner of a Liverpool factory"], "key": 1, "explanation": "he was engaged to survey a potential route for a canal, so he was likely an engineer"}, {"n": 5, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 16 – 25)?", "options": ["But what about the train route?", "The first question was which boats to use.", "Various routes were proposed.", "Which company would build the canal?"], "key": 2, "explanation": "paragraph two discusses different proposed routes and the compromise reached"}, {"n": 6, "stem": "Paragraph Two (Lines 16 – 25) DOES NOT say that ______.", "options": ["by 1768, the plan for the canal had been agreed upon", "the canal’s construction began on the 5 th of November 1770", "the cost was estimated at over a quarter of a million pounds", "the first plans included the town of Wigan on the route"], "key": 3, "explanation": "the first plans did NOT include Wigan; Wigan was added later as a compromise"}, {"n": 7, "stem": "If somebody is parsimonious (Line 20), they are ______.", "options": ["depressed", "mean", "self-obsessed", "sensitive"], "key": 1, "explanation": "mean/stingy – the Yorkshire businessmen did not want to spend too much money"}, {"n": 8, "stem": "Which picture shows a lock, as mentioned in Line 32? Choose the picture labelled A, B, C or D on the original page.", "options": ["Picture A", "Picture B", "Picture C", "Picture D"], "key": 0, "explanation": "Picture A shows a canal lock. The supplied key B points to a padlock and has been corrected.", "picture": true}, {"n": 9, "stem": "The MAIN reason why industry stopped using the canal was that it was ______.", "options": ["cheaper to rely on train transport", "considered environmentally damaging to use the canal", "no longer used to transport fossil fuels", "redesigned as a place of natural beauty"], "key": 2, "explanation": "industry stopped using the canal when power stations switched from coal to natural gas"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Bradford, Leeds and Liverpool", "Britain’s Industrial Heritage", "The Leeds and Liverpool Canal", "The Sun Inn, Bradford"], "key": 2, "explanation": "the entire article describes the Leeds and Liverpool Canal – its history, route, and legacy"}], "vocab": [{"word": "proposal", "meta": "B2, noun · AWL", "meaning": "a formal suggestion or plan put forward", "group": "Text 27", "page": 240}, {"word": "canal", "meta": "B2, noun", "meaning": "a man-made waterway for boats", "group": "Text 27", "page": 240}, {"word": "profound", "meta": "C1, adjective", "meaning": "deep and significant", "group": "Text 27", "page": 240}, {"word": "socioeconomic", "meta": "C1, adjective", "meaning": "relating to social and economic aspects of society", "group": "Text 27", "page": 240}, {"word": "burgeoning", "meta": "C1, adjective", "meaning": "growing or developing rapidly", "group": "Text 27", "page": 240}, {"word": "survey", "meta": "B2, verb", "meaning": "to examine, measure, and map a potential route", "group": "Text 27", "page": 240}, {"word": "backers", "meta": "B2, noun", "meaning": "people who provide financial support", "group": "Text 27", "page": 240}, {"word": "counter-proposal", "meta": "C1, noun", "meaning": "an alternative suggestion offered in response", "group": "Text 27", "page": 240}, {"word": "parsimonious", "meta": "C1, adjective", "meaning": "extremely unwilling to spend money", "group": "Text 27", "page": 240}, {"word": "compromise", "meta": "B2, noun · AWL", "meaning": "an agreement reached by both sides giving up some demands", "group": "Text 27", "page": 240}, {"word": "amend", "meta": "B2, verb", "meaning": "to change or modify by adding something", "group": "Text 27", "page": 240}, {"word": "diversion", "meta": "B2, noun", "meaning": "an alternative route", "group": "Text 27", "page": 240}, {"word": "circuitous", "meta": "C1, adjective", "meaning": "long and indirect (of a route)", "group": "Text 27", "page": 240}, {"word": "spectacular", "meta": "B2, adjective", "meaning": "very impressive or beautiful to look at", "group": "Text 27", "page": 240}, {"word": "locks", "meta": "B2, noun", "meaning": "sections of a canal with gates for raising or lowering boats", "group": "Text 27", "page": 240}, {"word": "dwindle", "meta": "B2, verb", "meaning": "to gradually become smaller or weaker", "group": "Text 27", "page": 240}, {"word": "heritage", "meta": "B2, noun", "meaning": "the remains and traditions of a region's past", "group": "Text 27", "page": 240}], "vocabularyPages": [240], "topic": "Leeds and Liverpool Canal"}, {"id": "reading-28", "unit": 6, "skill": "Reading", "title": "Text 28", "label": "Text 28", "pages": [112, 113], "text": "                                   Text 28\n     Reading\n\n       ________________ (See the appropriate question.)\n\n      The Channel Tunnel is an undersea railway tunnel that\n       spans the distance between England’s southern coast\n      and northern France. Cutting  largely through chalk\n      marl, it runs beneath the English Channel at an average\n 5     depth of 45 metres. At its very lowest point, it reaches\n      75 metres beneath the seabed, and 115 metres beneath\n       sea level. Linking two terminals, on the English side\n       Folkestone and on the French side Calais, the Channel                                                       The Channel Tunnel\n      Tunnel has an entire length of 50.46 kilometres, of\n 10   which 37.9 kilometres run underwater. It has the longest underwater section of any\n       tunnel in the world, and is the world’s third longest railway tunnel. Construction\n      work with boring equipment began in 1988. It finally opened to traffic in 1994. At\n       the time, it was the world’s most expensive construction project, with costs finally\n      amounting to £9 billion pounds, the equivalent of £21.8 billion in 2021 prices, far\n 15                                    more than the initial budget of £5 billion. In\n                                           2017,   it  carried  a  total  of  10.3  million\n                                             passengers,  less  than  the  11.7  million\n                                            passengers carried by cross-channel ferry\n                                         between the ports of Dover and Calais.\n             Eurostar Train      Cross Channel Ferry\n      ________________ (See the appropriate question.) Firstly, there are passenger\n        train services. In 1994, the Eurostar rail service began operating these between\n      European  capitals. Currently,  it offers  direct services between London,  Paris,\n       Brussels and Lille. Passengers departing from London’s St Pancra s International\n 25    disembark at Paris’s Gard du Nord two hours and sixteen minutes later. Overall,\n       taking waiting times into consideration, it is faster than flying. Secondly, drivers\n       can take their cars through the Channel Tunnel. At Folkestone and Calais, there are\n       car terminals where drivers drive their cars onto car shuttle wagons, and drive off\n       again once they reach their destination terminal. (The Channel Tunnel does not\n 30    permit public access  for  drivers.) There  are up  to  four  services  every hour,\n       operating 365 days a year. The entire journey lasts 35 minutes, whereas the car\n        ferry from Dover to Calais takes, at its absolute fastest, 100\n       minutes.  Finally,  the  Channel  Tunnel  is  used  for  the\n       transport  of  freight.  In  2020,  the  haulage  of  freight\n 35   amounted  to  a  total  of 1,138,213  tonnes. The Channel\n      Tunnel  is more commonly used by hauliers transporting\n       perishable cargo such as fruits and vegetables because of\n       the time involved in their transport. The freight of harmful goods is banned.\n\n 40   A tunnel beneath the Channel had existed as an idea long before it became reality.\n          It was first mooted in 1802 by Albert Mathieu-Favier, a French engineer. Under\n        his proposal, horse-drawn coaches would transport passengers through a tunnel\n       illuminated by oil lamps. An artificial island would be constructed halfway across\n       the Channel to allow for changing and feeding the horses. This was only the first\n 45    of several unsuccessful plans. There were further proposals in 1875, and 1882.\n      However, fear of a foreign army from mainland Europe making use of the tunnel\n       reduced the British government’s enthusiasm for any project. In 1973, construction\n      work actually began on a project. Using British boring equipment, a 300-metre\n       tunnel was built, but the project was cancelled on 20 January 1975 over concerns\n 50    with escalating costs.\n", "questions": [{"n": 1, "stem": "Paragraph One (Lines 1 – 19) DOES NOT STATE or IMPLY that ______.", "options": ["in 2017, more passengers travelled by ferry than by the Channel Tunnel", "more than half of the Channel Tunnel is under the sea", "the Channel Tunnel cost £5 billion to build", "the Channel Tunnel took about six years to build"], "key": 2, "explanation": "the text states the final cost was £9 billion, far more than the initial £5 billion budget"}, {"n": 2, "stem": "Chalk marl (Lines 3 - 4) is ______.", "options": ["a tunnel", "a type of rock", "railway track", "saltwater"], "key": 1, "explanation": "chalk marl is the type of rock through which the tunnel was cut"}, {"n": 3, "stem": "At its lowest point, the Channel Tunnel is ______.", "options": ["115 metres below sea level", "235 metres below seal level", "45 metres below sea level", "75 metres below sea level"], "key": 0, "explanation": "115 metres below sea level – line 6: \"115 metres beneath sea level\""}, {"n": 4, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 21 – 38)?", "options": ["Air pollution caused by transport is a concern for many.", "Flying is the fastest and most convenient way to travel.", "Now let’s turn our attention to cross-channel ferries.", "The Channel Tunnel offers three main services."], "key": 3, "explanation": "paragraph two describes the three main services the Channel Tunnel offers"}, {"n": 5, "stem": "The Gard du Nord (Line 25) is MOST LIKELY ______.", "options": ["a bus station", "a railway station", "a sea port", "an airport"], "key": 1, "explanation": "Gare du Nord is a railway station in Paris, where Eurostar arrives"}, {"n": 6, "stem": "Hauliers probably prefer to use the Channel Tunnel to transport certain goods because ______.", "options": ["it is much cheaper than the ferry", "some goods need to be transported quickly", "these goods are harmful", "they are farmers"], "key": 1, "explanation": "perishable goods like fruits and vegetables need to be transported quickly"}, {"n": 7, "stem": "To moot (Line 41) means to ______.", "options": ["have a meeting", "make a suggestion", "stop making noise", "write something down"], "key": 1, "explanation": "make a suggestion – the idea was first suggested/proposed in 1802"}, {"n": 8, "stem": "In the 19th century, the British government probably did not want to build a tunnel because ______.", "options": ["it was thought a tunnel could be used to invade Britain", "the costs were likely to be too high to make it a good idea", "there were disagreements with the French about who should pay", "they did not believe the engineering technology was sufficient"], "key": 0, "explanation": "the British government feared a foreign army could use the tunnel to invade"}, {"n": 9, "stem": "In Line 48, boring means ______.", "options": ["not interesting", "spreading liquid over a wide area", "the activity of creating holes", "too expensive"], "key": 2, "explanation": "the activity of creating holes – boring equipment refers to tunnel-boring machines"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Dover to Calais", "Eurostar Passenger Services", "Island Transport", "The Channel Tunnel"], "key": 3, "explanation": "the article is entirely about the Channel Tunnel – its features, services, and history"}], "vocab": [{"word": "undersea", "meta": "B2, adjective", "meaning": "built beneath the sea floor", "group": "Text 28", "page": 240}, {"word": "span", "meta": "B2, verb", "meaning": "to extend or stretch across a distance", "group": "Text 28", "page": 240}, {"word": "chalk marl", "meta": "C1, noun", "meaning": "a type of soft sedimentary rock", "group": "Text 28", "page": 240}, {"word": "seabed", "meta": "B2, noun", "meaning": "the ground at the bottom of the sea", "group": "Text 28", "page": 240}, {"word": "terminals", "meta": "B2, noun · AWL", "meaning": "buildings at the end of a transport route", "group": "Text 28", "page": 240}, {"word": "boring equipment", "meta": "B2, noun", "meaning": "large machines used to dig tunnels", "group": "Text 28", "page": 240}, {"word": "cross-channel ferry", "meta": "B2, noun", "meaning": "a boat that carries passengers across the English Channel", "group": "Text 28", "page": 240}, {"word": "disembark", "meta": "B2, verb", "meaning": "to leave a ship, aircraft, or train after a journey", "group": "Text 28", "page": 240}, {"word": "waiting times", "meta": "B2, noun", "meaning": "periods spent waiting when comparing options", "group": "Text 28", "page": 240}, {"word": "freight", "meta": "B2, noun", "meaning": "goods transported for commercial purposes", "group": "Text 28", "page": 240}, {"word": "haulage", "meta": "C1, noun", "meaning": "the commercial transport of goods by road or rail", "group": "Text 28", "page": 240}, {"word": "perishable", "meta": "B2, adjective", "meaning": "goods that can decay or spoil quickly", "group": "Text 28", "page": 240}, {"word": "moot", "meta": "C1, verb", "meaning": "to raise or suggest for discussion", "group": "Text 28", "page": 240}, {"word": "horse-drawn", "meta": "B2, adjective", "meaning": "pulled by horses", "group": "Text 28", "page": 240}, {"word": "artificial island", "meta": "B2, noun", "meaning": "a man-made land mass", "group": "Text 28", "page": 240}, {"word": "enthusiasm", "meta": "B2, noun", "meaning": "eager interest or support", "group": "Text 28", "page": 241}, {"word": "escalating", "meta": "B2, verb · AWL", "meaning": "continuously increasing", "group": "Text 28", "page": 241}], "vocabularyPages": [240, 241], "topic": "Channel Tunnel"}, {"id": "reading-29", "unit": 6, "skill": "Reading", "title": "Text 29", "label": "Text 29", "pages": [121, 122], "text": "                                         Text 29\n     Reading\n\n         ________________ (See the appropriate          Speed Camera Outside Keighley\n                           question.)\n\n      Speed cameras have become a ubiquitous sight\n      on British roads. Feared by many drivers, painted\n       bright yellow and preceded by warning  signs,\n       they  are  relied upon  all over  the country  to\n 5     regulate  traffic  speeds. Everybody knows  the\n        rules. If you break the speed limit - 20 miles per hour in some town centres, 30 in\n      most built-up areas, 60 outside town and 70 on motorways and dual carriageways –\n      you might get photographed by a speed camera, meaning a minimum £100 fine and\n       3 points on your licence, which,  if you get 12 points, you will lose. All in the\n 10    interests of safety. After  all, in 2013 there were a shocking 1,713 road traffic\n       accident (RTA) fatalities, with a further 2,341 injuries. But do they actually work?\n      Are they genuinely effective in reducing the numbers of people killed or injured on\n       the road?\n\n 15   Nowadays,  an  increasing  number  of  public  bodies  are  questioning  their\n       effectiveness. The assumption behind speed cameras, they argue, is that the primary\n       causal factor behind RTAs is driving too fast, whereas contemporary research has\n      begun  to suggest  rather  that  a  lack  of concentration and focus  is  to blame.\n      Worldwide, statistics show that driving above the speed limit was a factor in only\n 20   12% of RTA fatalities. So if driving too fast is not to blame, what are the primary\n       causes of road deaths? Here, statistics tell an interesting story. Globally, the most\n     common factors in RTAs are the consumption of alcohol and use of mobile phones\n       while driving, crimes neither of which are prevented by speed cameras. Resources\n       used for speed cameras, campaigners argue, would be better spent on policing the\n 25    roads, arresting those using mobiles or consuming alcohol.\n\n      ________________ (See the appropriate question.) In Britain, where speed cameras\n       are painted bright yellow, and there are signs warning motorists that they are\n       entering a speed camera zone, they may have the effect of reducing speeds in areas\n 30   where there are speed cameras, and having absolutely no impact where there are\n       none. In fact, leaving a speed camera zone could be said to be a green light to drive\n       as  fast as you  like. There are even maps of  Britain, available  in  print or  to\n      download, which give the locations of every spe ed camera in the country, so you\n       can plan your route to avoid them. Statistics show that while average speeds have\n 35   been lowered in speed camera zones, national average traffic speeds have been\n        rising consistently for the last fifteen years.\n\n     Some campaigners even claim that speed cameras have actually become a causal\n       factor in RTAs. It is not the speed at which motorists travel that is dangerous, they\n 40    argue.  It is the distance between cars. If drivers are inhibited by speed cameras\n      from accelerating out of hazardous driving conditions, accidents ensue. When cars\n       drive too closely together, even if below the legal speed limit, there is an enhanced\n        risk of an RTA. Speed cameras do not catch those failing to maintain appropriate\n       stopping distance.\n      Are speed cameras, then, going to become a thing of the past in Britain? Given the\n       revenue they produce,  it is next to impossible. Were speed cameras to be phased\n        out, a valuable source of income would be lost. Effective or not, speed cameras are\n       here to stay.\n", "questions": [{"n": 1, "stem": "If something is ubiquitous (Line 1), it ______.", "options": ["can only be seen at night", "is connected with riding horses", "is something everybody loves", "seems to be everywhere"], "key": 3, "explanation": "seems to be everywhere – speed cameras are common on British roads"}, {"n": 2, "stem": "What does they (Line 4) refer to?", "options": ["British roads", "many drivers", "Speed cameras", "warning signs"], "key": 2, "explanation": "speed cameras are relied upon to regulate traffic speeds"}, {"n": 3, "stem": "The most common speed limit in British towns is ______.", "options": ["20", "30", "60", "70"], "key": 1, "explanation": "30 miles per hour – \"30 in most built-up areas\""}, {"n": 4, "stem": "What does which (Line 9) refer to?", "options": ["3 points", "a £100 fine", "meaning a minimum £100 fine and 3 points on your licence", "your licence"], "key": 3, "explanation": "your licence – if you get 12 points on your licence, you will lose it"}, {"n": 5, "stem": "Paragraph Two (Lines 15 – 25) suggests that ______.", "options": ["it has been known for many years that speed cameras are ineffective", "most accidents are caused by driving at too high a speed", "speed cameras don’t prevent the main causes of accidents", "using a mobile phone while driving is surprisingly safe"], "key": 2, "explanation": "speed cameras don't prevent the main causes: alcohol and mobile phone use"}, {"n": 6, "stem": "What is the BEST sentence to BEGIN Paragraph Three (Lines 27 – 36)?", "options": ["Driving too fast is not the only cause of accidents on the road.", "How effective, anyway, are speed cameras in reducing speeds on the roads?", "Others, however, have argued that speed cameras have become a form of art.", "The evidence proves that speed cameras reduce average speeds on the road."], "key": 1, "explanation": "paragraph three asks how effective speed cameras really are at reducing speeds"}, {"n": 7, "stem": "The map of Britain that you can download ______.", "options": ["allows you to avoid traffic accidents", "gives you your exact location in the country", "helps you plan your route to avoid speed cameras", "tells you about beautiful locations in Britain"], "key": 2, "explanation": "maps show locations of every speed camera so you can plan your route to avoid them"}, {"n": 8, "stem": "What is the MAIN SUBJECT of Paragraph Four (Lines 38 – 44)?", "options": ["How speed cameras might actually cause accidents.", "The different factors that create hazardous driving conditions.", "What is an appropriate safe stopping distance?", "Why it is necessary to obey the legal speed limit."], "key": 0, "explanation": "paragraph four argues that speed cameras may actually cause accidents by reducing safe distance"}, {"n": 9, "stem": "Paragraph Five (Lines 46 – 49) suggests that speed cameras will be kept in use because ______.", "options": ["a lot of money is made through speed cameras", "it is not certain that they are ineffective", "nobody believes they do not work", "they are effective in reducing RTAs"], "key": 0, "explanation": "speed cameras produce revenue, so they are unlikely to be removed"}, {"n": 10, "stem": "What is the BEST TITLE for this Article?", "options": ["Do Speed Cameras Reduce the Number of Road Traffic Accidents?", "How Dangerous Are Roads in Britain Compared to Other Countries?", "How Many Road Traffic Accidents Were There in the UK in 2013?", "What Speeds Are Allowed on Roads in the United Kingdom?"], "key": 0, "explanation": "the article questions whether speed cameras actually reduce road traffic accidents"}], "vocab": [{"word": "ubiquitous", "meta": "C1, adjective", "meaning": "found everywhere", "group": "Text 29", "page": 241}, {"word": "precede", "meta": "B2, verb", "meaning": "to go before or be placed in front of something", "group": "Text 29", "page": 241}, {"word": "built-up areas", "meta": "B2, noun", "meaning": "places where many buildings are located close together", "group": "Text 29", "page": 241}, {"word": "dual carriageways", "meta": "B2, noun", "meaning": "major roads with two separate lanes in opposite directions", "group": "Text 29", "page": 241}, {"word": "fine", "meta": "B2, noun", "meaning": "an amount of money paid as punishment", "group": "Text 29", "page": 241}, {"word": "causal", "meta": "C1, adjective · AWL", "meaning": "relating to the cause of something", "group": "Text 29", "page": 241}, {"word": "campaigners", "meta": "B2, noun", "meaning": "people who actively support a cause", "group": "Text 29", "page": 241}, {"word": "consistently", "meta": "B2, adverb · AWL", "meaning": "in a way that does not change", "group": "Text 29", "page": 241}, {"word": "stopping distance", "meta": "B2, noun", "meaning": "the distance a vehicle travels before it comes to a complete stop", "group": "Text 29", "page": 241}, {"word": "phase out", "meta": "B2, verb", "meaning": "to gradually remove or discontinue", "group": "Text 29", "page": 241}], "vocabularyPages": [241], "topic": "Speed Cameras"}, {"id": "reading-30", "unit": 6, "skill": "Reading", "title": "Text 30", "label": "Text 30", "pages": [123, 124], "text": "                                     Text 30\n     Reading\n\n         ________________ (See the appropriate question.)           Poland\n\n      Located in northern Europe and with a population of 38\n       million, Poland certainly has a dramatic history. In the 16 th\n      and  17th  centuries  one  of  Europe’s  largest  and  most                   Poland\n      populous states, in the 18 th century it disappeared from the\n 5     face of the map when its territory was shared between the\n      empires of Russia, Prussia and Austria-Hungary. It was to\n      remain under occupation  until the close of the First World War, when Poland\n      regained its independence. The country was then to experience 20 years of peace\n        until the disaster of the Second World War, in which a quarter of the population\n 10    perished. At the close of the war, Poland came under military occupation by the\n      armies of the Soviet Union, finally becoming independent once more with the Soviet\n      Union’s break-up in 1989. Today, however, Poland is more prosperous and vibrant\n       than it has ever been, and there are many reasons to visit this fascinating country.\n\n 15   ________________ (See the appropriate question.) Krakow               Krakow\n       ranks  as  one  of  the  world’s  great  cities. An  unspoiled\n      medieval gem,   it  still  retains  its  13 th  and  14th  century\n       architecture, centred around the Rynek Główny, the largest\n               Da Vinci’s Lady with an  market square  in Europe.  Visitors can spend\n 20                 Ermine     hours  wandering  around   the  warrens   of\n                   cobblestone streets of the Old Town, or lazing with an espresso or\n                  cappuccino in the pavement cafes. For lovers of culture, its main art\n                     gallery contains one of the few verified works of Leonardo Da Vinci,\n                 Lady With An Ermine, and, for lovers of nightlife, Krakow has many\n 25               hundreds of cafes and restaurants.\n\n         If the noise and bustle of Krakow are too much, the southerly               Cable Car\n      town of Zakopane is a must, especially for lovers of winter\n       sports. Located in the foothills of the High Tatra Mountains,\n 30    close to the border with Slovakia, Zakopane  is one of the\n      world’s great skiing resorts, in winter time playing host to a\n       variety of sporting events. If winter sports are not of interest,\n      you can always take a ride in the cable car to the summit of\n      Kasprowych Wierch, the region’s highest mountain.  It can be terrifying, as you\n 35   sway over the trees 100 metres below, but once it’s over and you get to the top, the\n      views are truly spectacular.\n\n       Finally, for those who love peace, quiet and all sorts of water -sports,\n       there is the northern region of the Masurian Lakes. An area of over\n 40   2,000 lakes,  it is centred around the city of Olsztyn. If you come\n       here, you can spend lazy summer afternoons in your boat, unruffled\n       as you are rocked by the gentle breeze.\n\n      Poland is now easier to reach than it has ever been. There are direct flights from all\n 45   major European capitals, and direct flights from Abu Dhabi and Sharjah have started\n       recently. Hotels and accommodation range in price from budget to very expensive,\n      although they tend to be more expensive in summer. Poland has not joined the euro,\n      and you will need to change your money into the national currency, the złoty.\n", "questions": [{"n": 1, "stem": "What is the MAIN SUBJECT of Paragraph One (Lines 1 – 13)?", "options": ["Poland in the Second World War.", "The history of Poland.", "The location of Poland.", "The population of Poland."], "key": 1, "explanation": "paragraph one summarizes Poland's dramatic history from the 16th century to 1989"}, {"n": 2, "stem": "Paragraph One (Lines 1 – 13) DOES NOT say that Poland ______.", "options": ["has been part of the Soviet Union since 1989", "lost 25% of its population during the Second World War", "used to be one of the most heavily populated countries in Europe", "was taken over and shared between different empires"], "key": 0, "explanation": "Poland became independent in 1989 after the Soviet Union broke up – not part of it since 1989"}, {"n": 3, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 15 – 25)?", "options": ["No visit to Poland would be complete without a visit to its ancient capital.", "Nowhere shows the horrors of Poland’s past more effectively than Krakow.", "The history of Poland since 1989 has been even more complicated.", "There are reasonably-priced flights from a variety of European airports."], "key": 0, "explanation": "paragraph two introduces Krakow as an essential visit – Poland's ancient capital"}, {"n": 4, "stem": "When the writer describes Krakow as a gem (Line 17), he wants to suggest that it is very ______.", "options": ["expensive", "beautiful", "hard", "small"], "key": 1, "explanation": "a gem suggests something precious and beautiful – Krakow is described as an unspoiled medieval gem"}, {"n": 5, "stem": "A visit to Krakow would probably be best for people who like ______.", "options": ["art and history", "doing sports", "modern architecture", "peace and quiet"], "key": 0, "explanation": "Krakow has medieval architecture, an art gallery with Da Vinci, and cultural attractions"}, {"n": 6, "stem": "Lady With An Ermine (Line 24) is most probably a ______.", "options": ["book", "building", "painting", "restaurant"], "key": 2, "explanation": "Lady With An Ermine is a painting by Leonardo Da Vinci"}, {"n": 7, "stem": "What does It (Line 34) refer to?", "options": ["a ride in the cable car", "the region’s highest mountain", "the summit", "Zakopane"], "key": 0, "explanation": "it refers to the ride in the cable car, which can be terrifying"}, {"n": 8, "stem": "In Line 41, unruffled is closest in meaning to ______.", "options": ["excited", "bored", "made cold", "relaxed"], "key": 3, "explanation": "relaxed – being rocked by a gentle breeze on a boat is calming"}, {"n": 9, "stem": "What is the MAIN SUBJECT of Paragraph Five (Lines 44 – 48)?", "options": ["How Poland has developed economically.", "How to reach Poland.", "Information for tourists.", "Why you should visit Poland in the winter."], "key": 2, "explanation": "paragraph five gives practical tourist information: flights, accommodation, currency"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Northern Europe", "Poland", "Prussia and Austria-Hungary", "Russia"], "key": 1, "explanation": "the article is a travel guide to Poland – its history, cities, and attractions"}], "vocab": [{"word": "dramatic", "meta": "B2, adjective", "meaning": "sudden, exciting, or extreme (of history)", "group": "Text 30", "page": 241}, {"word": "territory", "meta": "B2, noun · AWL", "meaning": "an area of land under a particular control", "group": "Text 30", "page": 241}, {"word": "occupation", "meta": "B2, noun · AWL", "meaning": "controlled and governed by foreign forces", "group": "Text 30", "page": 241}, {"word": "regain", "meta": "B2, verb", "meaning": "to obtain freedom and self-rule again", "group": "Text 30", "page": 241}, {"word": "perish", "meta": "B2, verb", "meaning": "to die, especially in a tragic way", "group": "Text 30", "page": 241}, {"word": "prosperous", "meta": "B2, adjective", "meaning": "rich, successful, and doing well financially", "group": "Text 30", "page": 241}, {"word": "vibrant", "meta": "B2, adjective", "meaning": "full of energy, activity, and life", "group": "Text 30", "page": 241}, {"word": "unspoiled", "meta": "C1, adjective", "meaning": "beautiful and well-preserved; not damaged", "group": "Text 30", "page": 241}, {"word": "medieval", "meta": "B2, adjective", "meaning": "relating to the Middle Ages", "group": "Text 30", "page": 241}, {"word": "gem", "meta": "C1, noun", "meaning": "a beautiful and precious place", "group": "Text 30", "page": 241}, {"word": "retain", "meta": "B2, verb · AWL", "meaning": "to keep or continue to have something", "group": "Text 30", "page": 241}, {"word": "warrens", "meta": "C1, noun", "meaning": "a confusing, maze-like network of streets", "group": "Text 30", "page": 241}, {"word": "cobblestone", "meta": "B2, noun", "meaning": "small round stones used to pave roads", "group": "Text 30", "page": 241}, {"word": "laze", "meta": "B2, verb", "meaning": "to relax and do very little", "group": "Text 30", "page": 241}, {"word": "verified", "meta": "B2, adjective", "meaning": "confirmed or proven to be authentic", "group": "Text 30", "page": 241}, {"word": "bustle", "meta": "B2, noun", "meaning": "busy, noisy, and energetic activity", "group": "Text 30", "page": 241}, {"word": "foothills", "meta": "B2, noun", "meaning": "low hills at the base of a mountain range", "group": "Text 30", "page": 241}, {"word": "summit", "meta": "B2, noun", "meaning": "the highest point or top of a mountain", "group": "Text 30", "page": 241}, {"word": "spectacular", "meta": "B2, adjective", "meaning": "extremely beautiful or impressive", "group": "Text 30", "page": 241}, {"word": "unruffled", "meta": "C1, adjective", "meaning": "calm, peaceful, and not disturbed", "group": "Text 30", "page": 241}], "vocabularyPages": [241], "topic": "Poland Travel Guide"}, {"id": "reading-31", "unit": 6, "skill": "Reading", "title": "Text 31", "label": "Text 31", "pages": [125, 126], "text": "                           Text 31     Reading\n\n                   ________________ (See the appropriate question.)\n\n     On the 22 December, 1888, at a café in the southern French town of Arles, a fierce\n      argument erupted between two artists. It related to the question of where artistic\n      inspiration should come from. One claimed  it should come from the imagination,\n      while the other claimed it should come from nature. They were roommates, and had\n 5    been living together for 63 days. The tensions that had been building  in  their\n      relationship were now causing the argument to become increasingly violent. Finally,\n       in rage, one of the artists threw his drink over the other, who at this point, decided\n       to leave Arles to return to Paris. His name was Paul Gauguin, and he could no longer\n      stand sharing a room with the other artist, whose name was van Gogh. The following\n 10   night, 23rd December, 1888, van Gogh committed history’s most famous act of self -\n      mutilation, when he cut off his own ear.\n\n     ________________ (See the appropriate question.) A year earlier, he had returned\n       to Paris from the Caribbean island of Martinique, where he had developed his own\n 15   innovative colour-style, developing beyond the pastel colours of the Impressionists.\n         It was his Martinique works that drew him to the attention of the van Gogh brothers,\n      Vincent and wealthy art-dealer Theo. They viewed his work at the Parisian apartment\n       of Émile Schuffenecker, Theo paying 400 francs for The Mango Trees (1887). Later,\n     when van Gogh moved from Paris to the more relaxed environment of Arles, he\n 20   hoped  that Gauguin would  join him  there, and  they would found  an  artistic\n     community together. He repeatedly wrote to Gauguin, doing his best to persuade\n     him to come to Arles. Eventually Gauguin agreed, probably motivated more by the\n     150 francs a week Theo van Gogh offered him than by any artistic ambitions.\n\n 25   The two painters moved in together, sharing a single room in a     Place Lamartine in Arles\n      building on Place Lamartine in Arles. The relationship was probably\n     doomed from the start. Gauguin hated Arles, seeing his stay in this\n       rural French backwater primarily as a way of earning his ticket back\n       to the exotic island of Martinique. In addition, he was reportedly\n 30   arrogant and domineering towards van Gogh. For his part, van Gogh\n     was a messy and impractical roommate who did nothing to keep their accommodation\n       clean. Their friendship was deteriorating. The tension was building.\n\n\n                                                              rd           Vincent van Gogh   The evening of the 23  December,1888, was cold and wet. Shaken by\n 35                the  previous  day’s  argument, Gauguin  informed van Gogh  of  his\n                  decision to end their co-habitation and return to Paris. He then left their\n                accommodation, planning to stay the night at a hotel. Van Gogh caught\n                up with him on Avenue Victor Hugo. In Gauguin’s account, van Gogh\n                  attacked him with a razor blade, though, as there were no witnesses,\n 40   there is no independent verification of this. What we know for sure is that at some\n      time that night, van Gogh cut off his own ear. He gave  it to a cleaner at a nearby\n      hotel (a woman named Gabrielle, who we now know to have died in Arles at age 80\n       in 1952.)\n\n 45   Clearly suffering from mental illness, van Gogh was committed to an asylum in\n      Saint-Rémy-de-Provence. In the 17 months of life that remained to him, Gauguin\n      and van Gogh never again met, though they remained in contact via correspondence.\n     Van Gogh’s mental state continued to decline until his death by his own hand in\n      Auvers-sur-Oise, succumbing to a self-inflicted gunshot, on the 27 th July, 1890.\n", "questions": [{"n": 1, "stem": "In Line 2, what does It refer to?", "options": ["a café", "a fierce argument", "the 22n d December, 1888", "the southern French town of Arles"], "key": 1, "explanation": "the fierce argument related to the question of where artistic inspiration should come from"}, {"n": 2, "stem": "It is IMPLIED that the argument became violent because the artists were ______.", "options": ["bored with being painters", "both crazy and violent people", "serious enemies of each other", "stressed because of living together"], "key": 3, "explanation": "the tensions from living together for 63 days caused the argument to become violent"}, {"n": 3, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 13 – 23)?", "options": ["Cutting off his own ear had long been part of van Gogh’s business strategy.", "Gauguin had been staying in Arles at the invitation of van Gogh.", "Paul Gauguin became an artist after meeting van Gogh for the first time.", "Vincent van Gogh did not enjoy the cold weather in Arles."], "key": 1, "explanation": "paragraph two explains that Gauguin came to Arles at van Gogh's invitation"}, {"n": 4, "stem": "The Mango Trees ______.", "options": ["are some mango trees", "is a painting", "is a play", "is a poem"], "key": 1, "explanation": "The Mango Trees is a painting Theo van Gogh bought for 400 francs"}, {"n": 5, "stem": "Paul Gauguin MOST LIKELY went to Arles because ______.", "options": ["he wanted money", "he wanted to found an artistic community", "of an ambition to become a great artist", "van Gogh was his best friend"], "key": 0, "explanation": "Gauguin was motivated by the 150 francs a week, not artistic ambitions"}, {"n": 6, "stem": "In Line 28, a backwater is ______.", "options": ["a boring place where not very much happens", "a place on the edge of a river", "an industrialised area with a lot of pollution", "any place that is not an island"], "key": 0, "explanation": "a boring place where not very much happens – Gauguin saw Arles as a rural French backwater"}, {"n": 7, "stem": "What is the MAIN SUBJECT of Paragraph Four (Lines 34 – 43)?", "options": ["How Gauguin felt about his and van Gogh’s argument.", "The main events of 23 rd December,1888.", "The weather on 23 rd December, 1888.", "Why Paul Gauguin returned to Paris."], "key": 1, "explanation": "paragraph four describes the events of 23rd December 1888: the argument, van Gogh catching up, the ear incident"}, {"n": 8, "stem": "When Paragraph Four (Lines 34 – 43) talks about van Gogh attacking Gauguin with a razor blade, it is IMPLIED that ______.", "options": ["it was Gauguin that started it", "it was something that Gauguin deserved", "Paul Gauguin was seriously injured in the attack", "we are not certain what really happened"], "key": 3, "explanation": "there is no independent verification – we are not certain what really happened"}, {"n": 9, "stem": "When somebody dies by their own hand (Line 48), they ______.", "options": ["cut their hands off", "die very painfully", "have mental health problem", "kill themselves"], "key": 3, "explanation": "kill themselves – van Gogh died by suicide from a self -inflicted gunshot"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["History’s Greatest Artist", "Paul Gauguin and Vincent van Gogh", "The Southern French Town of Arles", "The World’s Worst Roommate"], "key": 1, "explanation": "the article focuses on the relationship between Paul Gauguin and Vincent van Gogh"}], "vocab": [{"word": "fierce", "meta": "B2, adjective", "meaning": "sudden, intense, and angry", "group": "Text 31", "page": 241}, {"word": "argument erupt", "meta": "B2, verb", "meaning": "a disagreement begins violently", "group": "Text 31", "page": 241}, {"word": "inspiration", "meta": "B2, noun", "meaning": "the mental stimulation that drives an artist to create", "group": "Text 31", "page": 241}, {"word": "tensions", "meta": "B2, noun", "meaning": "feelings of anxiety or hostility", "group": "Text 31", "page": 241}, {"word": "rage", "meta": "B2, noun", "meaning": "violent, uncontrolled anger", "group": "Text 31", "page": 242}, {"word": "self-mutilation", "meta": "C1, noun", "meaning": "deliberately injuring part of one's own body", "group": "Text 31", "page": 242}, {"word": "pastel colours", "meta": "B2, noun", "meaning": "soft, pale, light shades of colours", "group": "Text 31", "page": 242}, {"word": "art dealer", "meta": "B2, noun", "meaning": "a person who buys and sells works of art", "group": "Text 31", "page": 242}, {"word": "relaxed", "meta": "B2, adjective", "meaning": "calm and free from stress", "group": "Text 31", "page": 242}, {"word": "artistic community", "meta": "B2, noun", "meaning": "a group of artists sharing ideas and support", "group": "Text 31", "page": 242}, {"word": "doomed", "meta": "C1, adjective", "meaning": "certain to fail or end badly", "group": "Text 31", "page": 242}, {"word": "backwater", "meta": "C1, noun", "meaning": "a quiet, isolated, and unsophisticated area", "group": "Text 31", "page": 242}, {"word": "arrogant", "meta": "B2, adjective", "meaning": "behaving as if one is superior", "group": "Text 31", "page": 242}, {"word": "domineering", "meta": "C1, adjective", "meaning": "trying to control other people", "group": "Text 31", "page": 242}, {"word": "impractical", "meta": "B2, adjective", "meaning": "not sensible or good at dealing with tasks", "group": "Text 31", "page": 242}, {"word": "deteriorate", "meta": "B2, verb · AWL", "meaning": "to become gradually worse", "group": "Text 31", "page": 242}, {"word": "co-habitation", "meta": "C1, noun", "meaning": "the act of living together", "group": "Text 31", "page": 242}, {"word": "independent verification", "meta": "C1, noun", "meaning": "confirmation from a neutral source", "group": "Text 31", "page": 242}, {"word": "succumb", "meta": "C1, verb · AWL", "meaning": "to die from or be overcome by something harmful", "group": "Text 31", "page": 242}], "vocabularyPages": [241, 242], "topic": "Van Gogh and Gauguin"}, {"id": "reading-32", "unit": 7, "skill": "Reading", "title": "Text 32", "label": "Text 32", "pages": [128, 129], "text": "                                         Text 32\n     Reading\n\n          _______ (See the appropriate question.)\n\n       Native to China’s remote mountainous provinces\n        of Sichuan, Shaanxi and Gansu, the giant panda\n          is  a  bear  species  easily  recognisable by  the                        A Giant\n                                                                                    Panda\n        distinctive black patches around its eyes, over\n  5      its  ears and  across  its body. As  a  result  of\n        deforestation, giant pandas have been driven out\n        of the lowland areas where they once lived, but their natural habitat is cool wet\n        forest with an abundance of bamboo. In summer months, in order to feed, they leave\n         their natural habitats to go further up the mountain slopes. Matur e pandas grow up\n  10    to 1.5 metres in height and can weigh up to 136 kilograms. Currently, there are\n       about 1,600 pandas living in the wild, with a further 100 living in zoos around the\n       world.\n\n       Contrary to popular belief, giant pandas are omnivores, since they also eat fish,\n  15    rodents, insects and birds. But 99% of a panda’s diet is bamboo, for which their\n        appetite is legendary. An adult panda will eat bamboo continuously for 12 hours,\n       consuming up to 12.5 kilograms (this is due to bamboo’s relatively low nutrient\n        content). The panda’s stomach  is well-adapted  to bamboo, with an extremely\n       muscular stomach wall to aid in its digestion. The panda’s stomach walls are also\n  20    lined  with mucus  that  prevents   it  from  being  punctured  by  splinters. One\n       consequence of a diet relatively low in energy content is that the panda is a docile\n        species, avoiding physical activity whenever possible.\n\n      ________________ (See the appropriate question.) Solitary animals, they have a\n  25   heightened sense of smell that tells them when another panda is nearby, and will\n      move off into another part of their territory. Should contact be unavoidable, the two\n       pandas exhibit aggressive behaviour such as swatting, growling or even biting. A\n        giant panda’s territory usually extends to about 5 square kilometres. It is marked\n        out by scent, from which pandas can tell the gender and age of other pandas.\n       Giant pandas have held an elevated status in China for thousands of years. The\n       Empress Dowager Bo was buried with an panda skull, and the grandson of Emperor\n       Taizon of Tang gave the Japanese emperor two pandas as a gesture of goodwill.\n       Westerners  first learned of giant pandas on 11 March 1869, when Frenchman\n  35   Armand David received the skin of a giant panda from a hunter. The first westerner\n      known to have seen a living giant panda was German zoologist Hugo Weigold, who\n       bought  a panda cub  in 1916. The son of  a United States president, Theodore\n       Roosevelt  Jr, became the first westerner to shoot and kill a giant panda, on an\n        expedition funded by the Field Museum of Natural History in the 1920s. In 1936,\n  40   Ruth Harkness brought the first living panda to the United States, which went to\n         live at the Brookfield Zoo in Chicago. In 1938, 5 panda cubs were sent to London.\n       For the next 50 years, however, exports of pandas were halted because of wars and\n        other factors.\n\n  45   The giant panda is no longer classed as a species at threat of extinction. The number\n        of giant pandas living in the wild  is growing, and this  is largely the result of\n       conservation measures taken by the Chinese government. There are now 50 nature\n        reserves in China that protect 45% of giant pandas’ natural habitat.\n", "questions": [{"n": 1, "stem": "What is the MAIN SUBJECT of Paragraph One (Lines 1 – 12)?", "options": ["Basic facts about pandas.", "China’s remote provinces.", "Pandas’ size and weight.", "What pandas look like."], "key": 0, "explanation": "paragraph one provides basic facts: location, appearance, habitat, size, weight, population numbers"}, {"n": 2, "stem": "In summer, pandas go further up the mountain slopes ______.", "options": ["because of deforestation", "in order to escape dry conditions", "so they get enough to eat", "to avoid the hot weather"], "key": 2, "explanation": "they leave their natural habitats to go further up the mountain slopes in order to feed"}, {"n": 3, "stem": "An omnivore (Line 14) ______.", "options": ["does not eat plants", "eats a large amount of food", "eats both plants and meats", "enjoys eating very much"], "key": 2, "explanation": "omnivore means eats both plants and meats – pandas eat bamboo plus fish, rodents, insects, birds"}, {"n": 4, "stem": "What is legendary?", "options": ["How pandas will eat only one thing.", "How pandas will eat fish, rodents, insects and birds.", "How pandas go for so long without eating.", "How much bamboo a panda can eat."], "key": 3, "explanation": "the text says \"their appetite is legendary\" and describes how much bamboo a panda can eat"}, {"n": 5, "stem": "The giant panda’s diet makes it ______.", "options": ["unhealthy", "passive", "aggressive", "active"], "key": 1, "explanation": "the text says the panda is a \"docile species, avoiding physical activity whenever possible\" – passive"}, {"n": 6, "stem": "What is the BEST sentence to BEGIN Paragraph Three (Lines 24 – 29)?", "options": ["The giant panda is at risk of extinction.", "The Chinese are taking steps to preserve pandas’ habitats.", "Giant pandas avoid contact with each other.", "Giant pandas are loved by many human beings."], "key": 2, "explanation": "paragraph three describes pandas as solitary animals that avoid contact and behave aggressively when contact is unavoidable"}, {"n": 7, "stem": "Growling (Line 27) is ______.", "options": ["when an animal cleans itself with its tongue", "the action an animal digging a hole in the ground", "a way of eating very tough food", "a sound an animal makes when angry"], "key": 3, "explanation": "growling is a sound an animal makes when angry, listed alongside swatting and biting as aggressive behaviour"}, {"n": 8, "stem": "What does It (Line 28) refer to?", "options": ["A giant panda", "A giant panda’s territory", "aggressive behaviour", "scent"], "key": 1, "explanation": "it refers to \"a giant panda's territory\" which is marked out by scent"}, {"n": 9, "stem": "What is the MAIN SUBJECT of Paragraph Four (Lines 31 – 43)?", "options": ["Giant pandas and people.", "Hunting of the giant panda.", "The first scientific studies of giant pandas.", "The status of giant pandas in China."], "key": 0, "explanation": "paragraph four describes human interactions with pandas over thousands of years: Chinese history, Western explorers, zoos"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Giant Pandas", "Giant Pandas and People", "Saving the Giant Panda", "What the Giant Panda Eats"], "key": 0, "explanation": "the article covers basic facts, diet, behaviour, history with humans, and conservation – all about Giant Pandas"}], "vocab": [{"word": "mountainous", "meta": "B2, adjective", "meaning": "having many mountains", "group": "Text 32", "page": 242}, {"word": "distinctive", "meta": "B2, adjective", "meaning": "easily recognisable or unusual", "group": "Text 32", "page": 242}, {"word": "deforestation", "meta": "B2, noun", "meaning": "the clearing of trees over a large area", "group": "Text 32", "page": 242}, {"word": "natural habitat", "meta": "B2, noun", "meaning": "the environment where an animal normally lives", "group": "Text 32", "page": 242}, {"word": "abundance", "meta": "B2, noun", "meaning": "a very large quantity", "group": "Text 32", "page": 242}, {"word": "mature", "meta": "B2, adjective", "meaning": "fully grown; adult", "group": "Text 32", "page": 242}, {"word": "contrary to", "meta": "B2, preposition", "meaning": "opposite to what most people think", "group": "Text 32", "page": 242}, {"word": "omnivores", "meta": "B2, noun", "meaning": "animals that eat both plants and meat", "group": "Text 32", "page": 242}, {"word": "legendary", "meta": "C1, adjective", "meaning": "very famous and  after promotion, a corporal. He served\n                                       in the 22nd Artillery Supply Company, the 2 nd Polish\n      Supply Corps, and saw active service at the Battle of Monte Casino. The setting for\n        this story is the Second World War, but it isn’t about the Second World War. This\n         is the story of a bear: Wojtek the Bear.\n       Iran: 8 April, 1942. A group of Polish refugees and soldiers, forced by war from\n        their homeland, met a young boy who had with him a bear cub. The bear, a Syrian\n      brown bear, had been orphaned after its mother had been shot by hunters. The bear’s\n       story moved the Polish refugees, who saw in  it the loss of their own motherland.\n 15   They bought the bear and brought it to live in their refugee camp near Tehran. Three\n      months later, the bear was adopted by soldiers of the Polish 22 nd Artillery Supply\n      Company, and named Wojtek.\n\n     He travelled with the soldiers as their pet and became a\n 20   beloved member of their group. Wojtek was a growing bear,\n      and was given fruit, marmalade, honey, and syrup. However,\n        in  1943,  a  problem  arose.  The  Supply Company was\n      scheduled to travel to Italy by ship. The ship’s regulations\n      banned soldiers from bringing pets on board. Would they\n 25   have to leave their Wojtek behind?\n\n      ________________ (See  the appropriate  question.) The  rules  stated  that only\n       soldiers were allowed on the ship: no pets. However, there was no rule stating that\n       soldiers had to be human beings. Wojtek was conscripted into the Polish Army and\n 30   given the rank of private. He was now a serving member of the Polish armed forces\n      with his own paybook, salary and serial number. Later in the war, he was promoted\n        to the rank of corporal.\n\n                           As a soldier, Wojtek performed crucial tasks. His great\n 35                              strength allowed him  to  carry 45-kilogram  crates  of\n                                      artillery shells, which he would stack on the backs of\n                                      lorries, a task normally requiring four men. Reportedly,\n                             Wojtek never dropped a crate. In the freezing conditions\n                                        at Monte Casino, his fellow soldiers would sleep around\n 40                            him, his body warmth allowing them to stave off the cold.\n     He would stand in line with his fellow soldiers, and salute when he saw officers.\n       Unfortunately, the Polish soldiers taught him bad habits. They gave him cigarettes\n        to smoke. He did not smoke the cigarettes. He ate them instead. They became his\n       favourite treat.\n     When the Second World War ended in 1945, Wojtek was shipped along with the rest\n       of  his company  to Berwickshire, Scotland, and stationed  at Winfield Airfield.\n      Following his demobilization on 15 November, 1947, Wojtek went to live at his new\n      home, Edinburgh Zoo. He was often visited by his former comrades, who would\n\n 50    treat him with cigarettes to eat. He recognized them, and still responded to being\n      spoken to in Polish. Wojtek lived at Edinburgh Zoo until the end of his life: he died\n      on 2nd December, 1963, aged 21, and weighing 500 kilograms.\n", "questions": [{"n": 1, "stem": "From Paragraph One (Lines 1 – 9) we can INFER that Wojtek is or was ______.", "options": ["a great war leader", "a prince from Edinburgh", "remembered for having been special", "the man in the picture next to a bear"], "key": 2, "explanation": "the memorial in Edinburgh and description as \"unlikely hero\" indicate Wojtek was special and remembered"}, {"n": 2, "stem": "What does it in Line 8 refer to?", "options": ["the Battle of Monte Casino", "the Second World War", "The setting", "this story"], "key": 3, "explanation": "\"this story\" – the previous sentence says \"This is the story of a bear: Wojtek the Bear\""}, {"n": 3, "stem": "The story of the bear cub moved the Polish refugees because ______.", "options": ["hunting animals was a passion for them", "it had similarities to their own experience", "they felt sorry for the boy and wanted to help him", "they had never seen animals like bears"], "key": 1, "explanation": "the refugees saw in the orphaned bear cub the loss of their own motherland – similarity to their experience"}, {"n": 4, "stem": "What is the BEST sentence to BEGIN Paragraph Four (Lines 27 – 32)?", "options": ["However, there were other pets on the ship.", "In the end, they decided to leave him behind.", "The Polish soldiers found a solution.", "Yes, they would."], "key": 2, "explanation": "paragraph four explains how they solved the problem by conscripting Wojtek as a soldier"}, {"n": 5, "stem": "In Line 29, to conscript means to ______.", "options": ["be forced to leave the army as a punishment", "choose by yourself to join the army", "fight and be injured as a soldier", "make others become soldiers"], "key": 3, "explanation": "to make others become soldiers – Wojtek was conscripted into the Polish Army"}, {"n": 6, "stem": "What is the MAIN SUBJECT of Paragraph Five (Lines 34 – 44)?", "options": ["How strong Wojtek was.", "What Wojtek did as a soldier.", "Where Wojtek served as a soldier.", "Which treats Wojtek liked."], "key": 1, "explanation": "paragraph five lists Wojtek's soldier tasks: carrying crates, providing warmth, saluting, eating cigarettes"}, {"n": 7, "stem": "Which picture shows a crate (Line 35)? Choose the picture labelled A, B, C or D on the original page.", "options": ["Picture A", "Picture B", "Picture C", "Picture D"], "key": 0, "explanation": "a crate is a large wooden box for transporting heavy items like artillery shells", "picture": true}, {"n": 8, "stem": "When you stave something off (Line 40), you ______.", "options": ["are frightened of something", "begin to enjoy something", "k
