 are not sent to your teacher.</footer><script id="packet-data" type="application/json">{"units": [["Education", 8, 25], ["Dangerous journeys", 26, 43], ["Energy", 44, 65], ["Medicine and health", 66, 85], ["The dark side of technology", 86, 105], ["Engineering projects", 106, 126], ["Animals", 127, 149], ["Skin (and Crime)", 150, 164]], "activities": [{"id": "reading-1", "unit": 1, "skill": "Reading", "title": "Text 1", "label": "Text 1", "pages": [9, 10], "text": "                                 Text 1\n     Reading\n\n                  ________________ (See the appropriate question.)\n\n       If you really want to upset your English teacher, there are few more effective ways\n      of annoying them than playing with your smartphone in class. Teachers at KFUPM\n     say   that  inappropriate  smartphone   use,  checking  Whatsapp  messages   or\n      surreptitiously watching funny cat videos, for example, is the worst thing students\n 5   can do. And not only is it rude: the plural of anecdote is not data, but there seems to\n     be a relationship between students not putting their smartphones away and failing\n     English courses, often repeatedly, often to the point of leaving KFUPM. So serious\n       is the problem that many teachers now take boxes with them to class, into which\n     students must deposit their smartphones. At least for the class period, there is a\n 10  physical separation of student and phone. So why exactly has classroom phone use\n    become such a hot potato?\n\n    The reason  is that smartphone use prevents students fully engaging in classroom\n      activities.  Students  divide  their  attention  between complex  subjects  requiring\n 15  concentration and focus, and whatever rubbish pops up on their smartphones. This\n     doesn’t only happen when the teacher is explaining something. Teachers frequently\n     witness  students  racing  through  exercises,  mentally disengaged and  giving no\n     consideration to the activity, just to get back to their phones. Smartphone use inhibits\n      skill development in other ways. A lot of students, when they do reading practice,\n 20  have smartphones in their hands. If there’s any unknown vocabulary, they use Google\n     Translate. This stops students developing the skill of using context to infer meaning.\n    So how bad is all of this? Of a link between smartphones and poor exam performance\n      at KFUPM, I have only anecdotal evidence, by which I mean stories told by teachers:\n    Him? He comes late every day and sits there playing with his smartphone. Of course\n 25  he’s going to fail.  I do not have data. However, scientific research done on exam\n     performance in London schools shows a 6% difference between grades in schools\n     where smartphones are banned and schools where they are not. This is not good.\n\n    ________________ (See the appropriate question.) After all, this technology cannot\n 30  be uninvented. They’re always going to be present in our lives. Should the emphasis\n     perhaps be on helping students develop appropriate smartphone use, allowing them\n      as a classroom resource that enhances learning? I’ve seen classes where smartphones\n      are incorporated into the lesson, through phone -based applications such as Kahoot.\n    Some teachers allow the use of Google Translate when doing vocabulary exercises,\n 35  making it one more classroom resource- this can actually foster learner independence:\n     students become less dependent on the teacher for explanations. Then there’s the use\n      of Whatsapp to share ideas and resources. IF smartphones are used appropriately,\n     they can enhance the learning process. But it’s a big if.\n\n 40  Question: which of these two groups of teachers are right? Answer: we (the teachers)\n      are RIGHT, and you (the students) are WRONG. Well, students who play with their\n     smartphones, anyway. And  if you’re one of them? Come on! Don’t be a muppet.\n     You’re a smart young man or woman, so do what’s best for you. Put your phone away\n     and don’t upset your teacher.\n", "questions": [{"n": 1, "stem": "Paragraph One (Lines 1 – 11) DOES NOT STATE or IMPLY that ______.", "options": ["inappropriate smartphone use is known to be the main cause of exam failure", "playing with your smartphone in class is an impolite thing to do", "some teachers force students to give up their smartphones during class time", "teachers think that playing with phones in class is a very bad thing to do"], "key": 0, "explanation": "inappropriate smartphone use is known to be the main cause of exam failure – Paragraph 1 says there seems to be a relationship but no data; it does not state it is a known main cause"}, {"n": 2, "stem": "In Line 5, an anecdote is ______.", "options": ["a really rude action", "a story people tell", "something phones are used for", "the singular form of data"], "key": 1, "explanation": "a story people tell – \"Anecdote\" in line 5 is contrasted with data"}, {"n": 3, "stem": "What does which in Line 8 refer to?", "options": ["boxes", "class", "So serious is the problem considered", "the problem"], "key": 0, "explanation": "boxes – \"Which\" in line 8 refers to the boxes into which students deposit phones"}, {"n": 4, "stem": "What is the MAIN SUBJECT of Paragraph Two (Lines 13 – 27)?", "options": ["Why lecturers need to make classes interesting.", "Why smartphones are a problem in class.", "Why students come to class feeling tired.", "Why teachers should try to help their students."], "key": 1, "explanation": "Why smartphones are a problem in class – Paragraph 2 explains distraction, skill inhibition, and research evidence"}, {"n": 5, "stem": "According to the text, using Google Translate while doing reading practice exercises is a problem because ______.", "options": ["Google Translate is not very accurate", "students don’t practise certain skills", "students only get Arabic translations", "the translations are now how the word is used"], "key": 1, "explanation": "students don't practise certain skills – Using Google Translate stops students from using context to infer meaning"}, {"n": 6, "stem": "Paragraph Two (Lines 13 – 27) STATES or IMPLIES that ______.", "options": ["students at schools in London did a research project on smartphone use", "teachers are responsible because their classes are boring for students", "teachers don’t understand that students are using their phones to learn", "there is evidence students do less well when their schools allow phones"], "key": 3, "explanation": "there is evidence students do less well when their schools allow phones – The London research shows a 6% grade difference"}, {"n": 7, "stem": "What is BEST sentence to BEGIN Paragraph Three (Lines 29 – 38)?", "options": ["But should we ban any use of smartphones in class?", "I will tell you why phones should be kept out of the classroom.", "The research from the London schools produced some unexpected results.", "Why is this not good?"], "key": 0, "explanation": "But should we ban any use of smartphones in class? – Paragraph 3 asks whether to ban or use phones appropriately"}, {"n": 8, "stem": "In Paragraph Three (Lines 29 – 38), what opinion does the writer express?", "options": ["Smartphones are not a real problem in class because they are used to study.", "Smartphones can help learning but only when they are used in the right way.", "Students should always ask their teachers to explain new vocabulary.", "The real problem is teachers refusing to learn new ways of teaching English."], "key": 1, "explanation": "Smartphones can help learning but only when they are used in the right way – \"IF… appropriately… but it's a big if\""}, {"n": 9, "stem": "In Line 42, a muppet is ______.", "options": ["a badly dressed person", "a nice person", "an unintelligent person", "a very old person"], "key": 2, "explanation": "an unintelligent person – \"Muppet\" is used as an insult opposite to \"smart young man or woman\""}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["How Smartphones Have Brought Great Benefits to Learning at KFUPM", "Smartphones in the Classroom: Should We Ban Them or Use Them?", "The Most Effective Ways of Upsetting Your Teacher at KFUPM", "Why We Must Stop Using Smartphones in The Classroom at KFUPM"], "key": 1, "explanation": "Smartphones in the Classroom: Should We Ban Them or Use Them? – The article discusses both banning and using phones"}], "vocab": [{"word": "surreptitiously", "meta": "C1, adverb", "meaning": "in a secret or stealthy way so the teacher does not see", "group": "Text 1", "page": 229}, {"word": "anecdote", "meta": "B2, noun", "meaning": "a short, personal story about something that happened", "group": "Text 1", "page": 229}, {"word": "deposit", "meta": "B2, verb · AWL", "meaning": "to put or place something into a container", "group": "Text 1", "page": 229}, {"word": "inhibit", "meta": "C1, verb", "meaning": "to slow down, restrict, or prevent a process or development", "group": "Text 1", "page": 229}, {"word": "infer", "meta": "B2, verb · AWL", "meaning": "to deduce meaning from context rather than direct translation", "group": "Text 1", "page": 229}, {"word": "banned", "meta": "B2, adjective", "meaning": "officially prohibited or not allowed", "group": "Text 1", "page": 229}, {"word": "incorporate", "meta": "C1, verb · AWL", "meaning": "to integrate or include as a part of something", "group": "Text 1", "page": 229}, {"word": "foster", "meta": "C1, verb", "meaning": "to encourage or promote the development of something", "group": "Text 1", "page": 229}, {"word": "dependent", "meta": "B2, adjective · AWL", "meaning": "relying on someone or something for help", "group": "Text 1", "page": 229}, {"word": "muppet", "meta": "C1, noun", "meaning": "a foolish or incompetent person (informal UK slang)", "group": "Text 1", "page": 229}], "vocabularyPages": [229], "topic": "Smartphones in the Classroom"}, {"id": "reading-2", "unit": 1, "skill": "Reading", "title": "Text 2", "label": "Text 2", "pages": [12, 13], "text": "                                    Text 2\n\n\n\n                   ________________ (See the appropriate question.)\n\n      What is the BEST TITLE for this article? That’s the appropriate question for the\n      gap above, the purpose of which is to check whether you can identify the main\n       subject at whole text level. I always make the answers to this question as obvious\n       as I can (I don’t want there to be any trick: it should be really direct), but on average\n 5    20% of students still get this question wrong, which I ascribe to a lack of critical\n       thinking skills. So let me give you some advice. When you finish reading the text,\n       ask yourself, what was that all about? Whatever comes into your head is likely to\n       be the right answer. This is an example of you using your critical thinking skills to\n      engage with a text, which is the reading ability we most want you to develop.\n      Sometimes, some students memorise texts. It’s not a good idea. It’s a waste of time.\n      Learning vocabulary from texts is sensible, but memorising complete texts doesn’t\n       help you. (“Teacher! I saved the whole text but I only got 20% in the test!”) It’s\n      understanding  we’re  interested  in,  and  rote  learning  is  not  the  same  as\n 15    understanding.  Memorisation  is  like  a  string  of  random  words:  helicopter,\n       spaghetti, Toyota Garage, lizard. You may know each word individually, but cannot\n       extract further meaning from them. What should concern you is reading skills: your\n        ability to use critical thinking to engage with and draw meaning from a text. Let’s\n      have a look at some further question types that we hope both develop and check\n 20   your critical thinking and reading skills.\n\n       Let’s begin with using the context to infer the meaning of unknown vocabulary.\n      Here are some words, one of which is (probably) unknown vocab: apples, lemons,\n      mangos, oranges, bananas and cherimoyas. Now using  the  context,  infer  the\n 25   meaning of the word cherimoya. Tell you what: I’ll give you a multiple choice\n       question for this one. I’m feeling generous today. Then there’s the question asking\n      you to identify the MAIN SUBJECT of the paragraph, which is nearly the same as\n       the BEST TITLE question. Again, you’re asked to use critical thinking skills to\n       evaluate the text, only here it’s at paragraph rather than full text level. We may as\n 30    well throw one of them in as well: is there no limit to my largesse? By the way, I\n       really shouldn’t be capitalising and bolding the key words. It’s a BAD HABIT I’ve\n       got into over the years. Don’t you start doing it. I anyway only do it so you know\n      which words to focus on.\n\n 35   ________________ (See the appropriate question.) I like it because it can be used\n        to test more than one skill. It checks whether you can identify which sentence best\n       introduces subsequent text. Alternatively,  it can test pronoun reference: does the\n      second sentence contain pronouns that refer logically back to a referent in the first\n       sentence? Then, there’s the toughest question of the lot: negative detail questions,\n 40   Paragraph X DOES NOT say… This question requires very close reading of a short\n       selection of text. You need to find three details paraphrased in the question, and\n      one which is not. Many students say this is the hardest kind of question, so next\n       we’ll look at various ways in which you can improve your reading test scores.\n", "questions": [{"n": 1, "stem": "In Paragraph One (Lines 1 – 9), the writer of the article DOES NOT _______.", "options": ["say he tries to make the What is the BEST title question difficult", "give students advice on how to answer the What is the BEST title question", "say he wants students to use critical thinking skills when reading", "imply 80% of students are usually able to identify the main subject of a text"], "key": 0, "explanation": "say he tries to make the What is the BEST title question difficult – The writer says he makes it obvious, not difficult"}, {"n": 2, "stem": "What does which in Line 2 refer to?", "options": ["the gap above", "the appropriate question", "the gap", "this article"], "key": 1, "explanation": "the appropriate question – \"Which\" in line 2 refers to the BEST TITLE question"}, {"n": 3, "stem": "In Line 14, rote learning is ______.", "options": ["learning about rotes", "memorisation without understanding", "studying for a test", "focusing only on the importation information for a test"], "key": 1, "explanation": "memorisation without understanding – Rote learning is defined as memorisation without understanding"}, {"n": 4, "stem": "The writer mentions helicopter, spaghetti, Toyota Garage, lizard as an example of ______.", "options": ["phrases that are important for the understanding of the whole text", "a series of key words that need to be learned for the test", "words whose meaning can be guessed from the context", "a group of words that have no connection with each other"], "key": 3, "explanation": "a group of words that have no connection with each other – The random words illustrate memorisation without meaning"}, {"n": 5, "stem": "What is the MAIN SUBJECT of Paragraph Three (Lines 22 – 33)?", "options": ["Guessing the meaning of unknown vocabulary.", "Two common types of reading questions.", "Why you shouldn’t capitalise and bold key words.", "What to do if you don’t understand reading texts."], "key": 1, "explanation": "Two common types of reading questions – Paragraph 3 focuses on inferring vocabulary and main subject"}, {"n": 6, "stem": "In Lines 24 and 25, a cherimoya is ______.", "options": ["an example of critical thinking", "a reading skill", "a fruit", "a vegetable"], "key": 2, "explanation": "a fruit – Cherimoya is listed with apples, lemons, etc."}, {"n": 7, "stem": "In Line 30, largesse is CLOSEST in meaning to ______.", "options": ["desire to make problems for somebody", "physical size", "generosity", "understanding"], "key": 2, "explanation": "generosity – \"Largesse\" in context means generosity, joking about no limit to his generosity"}, {"n": 8, "stem": "What is the BEST sentence to BEGIN Paragraph Four (Lines 35 – 43)?", "options": ["What is the point of the multiple choice format reading question?", "What about the What is the BEST sentence to BEGIN Paragraph question?", "Why do we like to have so many of the vocabulary in context questions?", "How easy do you personally find reading test questions during exams?"], "key": 1, "explanation": "What about the What is the BEST sentence to BEGIN Paragraph question? – Paragraph 4 discusses that question type"}, {"n": 9, "stem": "The paragraph AFTER Paragraph Four (Lines 35 – 43) is MOST LIKELY to be about ______.", "options": ["other uses of critical thinking skills", "advice about how to do reading tests", "how to do negative detail questions in tests", "reasons why students do badly in reading tests"], "key": 1, "explanation": "advice about how to do reading tests – The paragraph ends saying \"next we'll look at various ways… to improve your reading test scores\""}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Reading Tests: Question Types and Critical Thinking Skills", "How to Do The Best Title Question for Reading Tests", "Why It Is Necessary for Students to Develop Reading Skills", "What is the BEST TITLE for this article?"], "key": 0, "explanation": "Reading Tests: Question Types and Critical Thinking Skills – The whole text explains question types and critical thinking"}], "vocab": [{"word": "ascribe", "meta": "C1, verb · AWL", "meaning": "to attribute or explain something as being caused by a particular reason", "group": "Text 2", "page": 229}, {"word": "critical", "meta": "B2, adjective · AWL", "meaning": "involving careful judgement; able to analyse and evaluate information", "group": "Text 2", "page": 229}, {"word": "engage", "meta": "B2, verb · AWL", "meaning": "to actively interact with or focus attention on a text or idea", "group": "Text 2", "page": 229}, {"word": "memorise", "meta": "B2, verb", "meaning": "to learn something exactly so that it can be recalled from memory", "group": "Text 2", "page": 229}, {"word": "rote", "meta": "C1, adjective", "meaning": "learning by repetition without understanding the underlying meaning", "group": "Text 2", "page": 229}, {"word": "extract", "meta": "B2, verb · AWL", "meaning": "to draw out or obtain meaning from something", "group": "Text 2", "page": 229}, {"word": "largesse", "meta": "C1, noun", "meaning": "generosity in giving or willingness to provide things", "group": "Text 2", "page": 229}, {"word": "referent", "meta": "C1, noun · AWL", "meaning": "the specific person, thing, or idea that a pronoun or word refers to", "group": "Text 2", "page": 229}, {"word": "paraphrase", "meta": "B2, verb · AWL", "meaning": "to restate in different words, usually to simplify or clarify meaning", "group": "Text 2", "page": 229}], "vocabularyPages": [229], "topic": "Reading Skills and Question Types"}, {"id": "reading-3", "unit": 1, "skill": "Reading", "title": "Text 3", "label": "Text 3", "pages": [14, 15], "text": "                             Text 3\n\n     ____________________ (See the appropriate question.)\n\n     1943, and Death Island was a bad place to be if your name was\n     Adolf Hitler. Relax! I’m joking! This text isn’t going to be about\n            war or history. This text  is actually about Chanel No. 5\n           Perfume, and how  it became an iconic symbol of fashion\n 5          and elegance. Relax! I’m still joking! And it’s  still not funny. But here’s a\n             question: which of these fake subjects made you do the biggest facepalm?\n\n    And was your facepalm A or B? Some students mither on about\n      reading about history, while other students hate reading about\n 10   the global perfume industry. You can’t generalise, but are there\n      different interests in reading according to gender? Does this\n     mean that test-writers should have reading tests that are of\n      interest to both men and women? I don’t know. Maybe. Here’s another question: if\n      there are subjects that are less interesting for some students, are there subjects that\n 15   are more interesting? Let’s shift the subject now, away from testing process and to\n      the process whereby students acquire reading skills.\n\n     Your  English language  skills develop more  effectively when you  are  actively\n     engaged in what you are communicating. “Felt” communication is really important.\n 20  When you say or write what you really feel, you write or speak more effectively.\n    When genuinely interested in what you listen to, you comprehend better. Reading is\n     no exception to this. If engaged in what you read, you comprehend at a deeper level.\n    And there are different levels of text comprehension, from whole text (What is the\n    BEST TITLE for this article?), to paragraph level (MAIN SUBJECT of Paragraph\n 25  Yada Yada Yada), to sentence, to word, to pronoun reference. You become better able\n      to use critical thinking skills to infer meaning from text, and not merely comprehend\n      stated text details. To develop these  skills, what you read needs to be actively\n     engaging for you. If it’s work, something you’re forced to do, your brain switches\n       off. Or if your primary motivation is the fear of low exam scores, that’s not going to\n 30  be very effective either. Here’s what I’m saying: if you want to improve your reading\n       skills, read stuff that is interesting to you.\n\n     ________________ (See the appropriate question.) What do you\n      dig? Aromatherapy? The Primacy of the Human Soul? Motorbikes?\n 35   British  indie rock band  of  the 90s from Leeds,  the Wedding\n      Present? I don’t have a clue, but it doesn’t matter. Just make sure\n      that you read stuff you are interested in. It is my belief that when\n     you do  this, you develop reading  skills more effectively. And          The Wedding Present\n    when you get knackered or bored, give up. Go and have a cup of tea instead . Or\n 40  watch Netflix. There’s no benefit doing  it when your mind has closed. Make sure\n      that what you read is at the right level, though. Too easy or too hard and you’ll lose\n      focus. And don’t just think that improving reading skills is a matter of doing agra -\n     bagra reading tests. That can help, but while  it certainly develops test familiarity,\n     and awareness of how and what reading skills you are tested on, it is absolutely not\n 45   a guaranteed way of developing reading skills. That is a personal thing, because  it\n       is something that goes on in your brain.\n\n    Why should you develop reading skills? I could bang on about TOEFL or how it is\n      the best way to improve your overall command of English. And it is. But honestly,\n 50   reading?  It is a bridge to worlds of imagination, thought and ideas, or a road to\n     becoming better versions of ourselves. Anyway, as I was saying about Death Island…\n", "questions": [{"n": 1, "stem": "In Paragraph One (Lines 1 – 6), the writer’s object is MOST PROBABLY to show students how______.", "options": ["funny he can be when writing reading texts", "it is better to read about perfume than war", "there are some topics they dislike reading about", "there is a connection between Hitler and Chanel No. 5"], "key": 2, "explanation": "there are some topics they dislike reading about – The fake subjects Hitler and perfume are meant to cause a \"facepalm\" over disliked topics"}, {"n": 2, "stem": "What is the MAIN SUBJECT of Paragraph Two (Lines 8 – 16)?", "options": ["Do men and women find different subjects interesting?", "Is the global perfume industry actually really interesting?", "Should facepalm emojis be used in written text?", "Why test-writers must write for both male and female students."], "key": 0, "explanation": "Do men and women find different subjects interesting? – Paragraph 2 asks this question"}, {"n": 3, "stem": "In Line 8, the Northern English slang phrase mither on means to ______.", "options": ["be able to understand something easily", "complain about something", "get very high exam scores", "see the benefit of something"], "key": 1, "explanation": "complain about something – \"Mither on\" is Northern English slang meaning complain"}, {"n": 4, "stem": "What is the MAIN SUBJECT of Paragraph Three (Lines 18 – 31)?", "options": ["Personal involvement when developing English skills.", "The best way of doing multiple choice reading tests.", "The necessity of working hard even when you are tired.", "Why students often get low marks in English exams."], "key": 0, "explanation": "Personal involvement when developing English skills – Paragraph 3 explains \"felt\" communication helps develop skills"}, {"n": 5, "stem": "In Line 20, to be engaged means to ______.", "options": ["be involved and interested in something", "be very frightened of failure", "be working extremely hard", "have plans to get married to someone"], "key": 0, "explanation": "be involved and interested in something – \"To be engaged\" means involved and interested"}, {"n": 6, "stem": "What is the BEST sentence to BEGIN Paragraph Four (Lines 33 – 46)?", "options": ["What is of interest to students?", "What is Pythagoras’ Theorem?", "Why do students need spades?", "Have you ever worked in the garden?"], "key": 0, "explanation": "What is of interest to students? – Paragraph 4 begins by asking what interests students"}, {"n": 7, "stem": "From Paragraph Four (Lines 33 – 46), what advice does the writer give about the best way of improving reading skills?", "options": ["It’s best to be relaxed and enjoying what you read.", "You should make sure you do all the agra-bagra reading tests.", "Don’t do agra-bagra reading tests, because they are rubbish.", "Don’t stop just because you get tired."], "key": 0, "explanation": "It's best to be relaxed and enjoying what you read – The writer advises reading what you enjoy and stopping when tired"}, {"n": 8, "stem": "What does it in Line 45 refer to?", "options": ["a guaranteed way of developing reading skills", "developing reading skills", "test familiarity", "That is a personal thing"], "key": 1, "explanation": "developing reading skills – \"It\" in line 45 refers to developing reading skills"}, {"n": 9, "stem": "What, in the writer’s opinion, is the MOST important reason for developing reading skills?", "options": ["Reading can help us improve as human beings.", "Reading helps us get higher marks in tests.", "Reading helps us learn about war and perfume.", "Reading is the best way to prepare for TOEFL."], "key": 0, "explanation": "Reading can help us improve as human beings – The writer calls reading a \"bridge… to becoming better versions of ourselves\""}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Chanel No. 5", "Death Island", "Facepalm", "Reading"], "key": 3, "explanation": "Reading – The article consistently returns to the act and value of reading"}], "vocab": [{"word": "facepalm", "meta": "C1, noun", "meaning": "a gesture or reaction of embarrassment, frustration, or disbelief", "group": "Text 3", "page": 229}, {"word": "generalise", "meta": "B2, verb · AWL", "meaning": "to make a broad statement or conclusion based on limited examples", "group": "Text 3", "page": 229}, {"word": "shift", "meta": "B2, verb · AWL", "meaning": "to change the focus or direction of a discussion", "group": "Text 3", "page": 229}, {"word": "engaged", "meta": "B2, adjective · AWL", "meaning": "fully involved and paying close attention to something", "group": "Text 3", "page": 229}, {"word": "comprehend", "meta": "B2, verb", "meaning": "to understand the meaning of something", "group": "Text 3", "page": 229}, {"word": "motivation", "meta": "C1, noun · AWL", "meaning": "the reason or driving force behind an action", "group": "Text 3", "page": 229}, {"word": "knackered", "meta": "C1, adjective", "meaning": "extremely tired or exhausted (informal UK slang)", "group": "Text 3", "page": 229}, {"word": "familiarity", "meta": "B2, noun · AWL", "meaning": "good knowledge or understanding of something through repeated experience", "group": "Text 3", "page": 229}, {"word": "command", "meta": "B2, noun", "meaning": "the ability to use or control something effectively", "group": "Text 3", "page": 229}], "vocabularyPages": [229], "topic": "Reading and Personal Engagement"}, {"id": "reading-4", "unit": 1, "skill": "Reading", "title": "Text 4", "label": "Text 4", "pages": [21, 22], "text": "                                             Text 4\n     Reading\n\n\n         ________________ (See the appropriate question.)                 Leeds University\n\n      Smartphones are evil. That, anyway, is the belief held by\n       Professor Norman Smith of the Leeds University Institute\n       for  Technological  Dread, who  would  like  to  see  the\n      government prohibit the sale and possession of smartphones\n 5    and related technology. Last week I visited Professor Smith\n        at his workplace, to ask why he holds a position seen by some as rather extreme. I\n      met him as his lecture concluded,  his students streaming  past, restarting  their\n      smartphones. When asked why he believes smartphones should be banned,  his\n      response was as follows: ‘Because they kill people.’\n      ________________  (See  the  appropriate  question.)  ‘They  kill  people,’  says\n       Professor Smith. ‘Globally, one of the most common factors in road traffic accident\n        fatalities is smartphone use, texting, reading texts, making calls and so on. Driving\n       requires  intense  concentration,  and  concurrent  actions  ser iously  impact  that\n 15    concentration. Using smartphones while driving is illegal but every day on the roads\n      you see those rules flouted. Were we to actually enforce those rules, our roads would\n      become far safer. That’s never going to happen, so the best answer is a total ban on\n      smartphones everywhere in Britain.’\n\n 20   So he wants to ban smartphones to make driving safer? ‘Yes, but it wouldn’t only\n      save lives on the road. You see people in responsible jobs, jobs where people’s very\n       lives hang in the balance, not doing those jobs properly because of smartphones.\n       Last week  I flew to Istanbul, and as my bags were X-rayed, the X-ray machine\n       operator was ignoring everything on the screen because he was playing with his\n 25   smartphone. I could have had a big Samurai sword in my bag and he wouldn’t have\n      blinked an eyelid. How long will  it be before some surgeon botches an operation\n      because the surgeon couldn’t keep his eyes off Snapchat? Or a bus driver drives his\n      bus off the side of a cliff because he was playing Flappy Birds?’\n\n 30   ‘And then,’ says Professor Smith, ‘There’s the impact on education. Louis -Philippe\n      Beland and Richard Murphy at the London School of Economics have done some\n       useful work. In their research, they found that in schools where smartphones were\n      banned, test results for 16-year-olds were 6.4% higher than in schools where no ban\n      was applied. Of course, we don’t need statistics to show us that smartphones are\n 35   having a negative impact on education. A lot of young people simply cannot stop\n      playing with their smartphones. They’re addicted, and it’s a major factor when they\n        fail in their educational lives.’\n\n     ‘Now look at this corridor!’ says Professor Smith. I look at the corridor. I don’t see\n 40    anything. ‘I don’t see anything,’ I tell Professor Smith. ‘Exactly!’ he says. ‘Twenty\n       years ago,  it would have been full of students, laughing, joking, talking, playing\n      and running. They would have been interacting with each other. Now where are\n      they? Huddled in some dark corner somewhere, not talking to anyone and goggling\n        at some youtube video of a funny cat. Now I might be just a typical old man who\n 45    can’t even be taught how to check email, and my dislike of smartphones stems from\n       frustration with my own technological  ineptitude, but young people don’t mix\n       together like they used to. Something’s going on. We don’t know what it is yet but\n        it’s something bad.’\n\n\n 50     I leave Professor Smith and set off down the rain-soaked streets to Leeds Station. I\n       ask myself whether Professor Smith’s dream of a smartphone -free Britain could ever\n      become reality? I look at the people in the street, ignoring the rain but engrossed in\n       their smartphones. Tell this lot they can’t have their smartphones? Forget  it. It’s\n       not going to happen.\n", "questions": [{"n": 1, "stem": "In Paragraph One (Lines 1 – 9) the WRITER OF THE ARTICLE ______.", "options": ["does not really express an opinion on smartphones", "shows he disagrees with Professor Smith", "shows he thinks that smartphones are good things", "suggests that smartphones are extremely bad"], "key": 0, "explanation": "does not really express an opinion on smartphones – The writer reports Professor Smith's views without agreeing or disagreeing"}, {"n": 2, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 11 – 18)?", "options": ["But is there anything positive about smartphones?", "Does he allow his students to use smartphones in class?", "They kill people?", "What do guns do?"], "key": 2, "explanation": "They kill people? – Paragraph 2 begins with Smith repeating \"They kill people,\" so the best preceding sentence is that question"}, {"n": 3, "stem": "Professor Smith IMPLIES that ______.", "options": ["rules on smartphone use while driving are not taken seriously", "the government are likely to enforce the rules on smartphone use", "the police work hard to make people obey the laws of smartphone use", "using a smartphone while driving is not a crime"], "key": 0, "explanation": "rules on smartphone use while driving are not taken seriously – Smith says rules are flouted every day"}, {"n": 4, "stem": "What is the MAIN SUBJECT of Paragraph Three (Lines 20 – 28)?", "options": ["Banning smartphones to make driving a lot safer.", "Professor Smith’s trip to Istanbul.", "Risks created by using smartphones in the workplace.", "The dangers of smartphones being used in airports."], "key": 2, "explanation": "Risks created by using smartphones in the workplace – Paragraph 3 gives examples of airport X ray, surgeon, bus driver"}, {"n": 5, "stem": "When you botch something (Line 26) you ______.", "options": ["are forced to do something", "avoid doing something", "conduct something", "do a very bad job of something"], "key": 3, "explanation": "do a very bad job of something – To \"botch\" an operation means to do it badly"}, {"n": 6, "stem": "Louis-Philippe Beland and Richard Murphy are ______.", "options": ["school teachers", "scientists or academics", "sellers of smartphones", "students"], "key": 1, "explanation": "scientists or academics – Beland and Murphy are researchers whose work Smith cites"}, {"n": 7, "stem": "Professor Smith IMPLIES that the statistics on smartphones in education ______.", "options": ["are not as bad as others think", "should probably not be taken seriously", "tell him something he already knew", "were a surprise to him as an educator"], "key": 2, "explanation": "tell him something he already knew – Smith says \"we don't need statistics to show us\" the negative impact"}, {"n": 8, "stem": "What is the MAIN SUBJECT of Paragraph Five (Lines 39 – 48)?", "options": ["The negative social impact of smartphones.", "What life was like for students 20 years ago.", "What students do in corridors.", "What students prefer to watch on youtube."], "key": 0, "explanation": "The negative social impact of smartphones – Paragraph 5 describes students no longer interacting, huddled over phones"}, {"n": 9, "stem": "In Line 46, ineptitude is ______.", "options": ["a concern for the well-being of young people", "a strong dislike or hatred of something", "being unable to do something well", "worrying about what will happen in the future"], "key": 2, "explanation": "being unable to do something well – \"Ineptitude\" means inability to do something well, here technological ineptitude"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Professor Smith’s Research into Road Accidents Involving Smartphones", "Professor Smith’s Study of the History of Smartphones", "The Good and Bad Things About Smartphones", "Why Professor Smith Believes Smartphones Are Bad"], "key": 3, "explanation": "Why Professor Smith Believes Smartphones Are Bad – The article explains Smith's arguments against smartphones"}], "vocab": [{"word": "prohibit", "meta": "B2, verb · AWL", "meaning": "to officially forbid or ban something by law or rule", "group": "Text 4", "page": 229}, {"word": "possession", "meta": "B2, noun", "meaning": "the state of having or owning something", "group": "Text 4", "page": 229}, {"word": "extreme", "meta": "B2, adjective", "meaning": "far beyond what is normal or reasonable", "group": "Text 4", "page": 229}, {"word": "fatalities", "meta": "C1, noun · AWL", "meaning": "deaths caused by an accident, disaster, or violence", "group": "Text 4", "page": 230}, {"word": "concurrent", "meta": "C1, adjective · AWL", "meaning": "happening at the same time as something else", "group": "Text 4", "page": 230}, {"word": "flout", "meta": "C1, verb", "meaning": "to deliberately disobey or ignore a rule or law", "group": "Text 4", "page": 230}, {"word": "enforce", "meta": "B2, verb · AWL", "meaning": "to make sure a law or rule is obeyed by people", "group": "Text 4", "page": 230}, {"word": "botch", "meta": "C1, verb", "meaning": "to do something badly or carelessly, ruining it", "group": "Text 4", "page": 230}, {"word": "addicted", "meta": "B2, adjective", "meaning": "physically or mentally unable to stop doing or using something", "group": "Text 4", "page": 230}, {"word": "huddle", "meta": "B2, verb", "meaning": "to crowd together closely in a small space", "group": "Text 4", "page": 230}, {"word": "goggle", "meta": "C1, verb", "meaning": "to stare with wide eyes, often in mindless absorption", "group": "Text 4", "page": 230}, {"word": "stem", "meta": "C1, verb · AWL", "meaning": "to originate or be caused by something", "group": "Text 4", "page": 230}, {"word": "ineptitude", "meta": "C1, noun", "meaning": "lack of skill, ability, or competence", "group": "Text 4", "page": 230}, {"word": "engrossed", "meta": "C1, adjective", "meaning": "completely absorbed or deeply focused on something", "group": "Text 4", "page": 230}], "vocabularyPages": [229, 230], "topic": "Professor Norman Smith on Smartphones"}, {"id": "reading-5", "unit": 1, "skill": "Reading", "title": "Text 5", "label": "Text 5", "pages": [24, 25], "text": "                                         Text 5\n     Reading\n\n                  ________________ (See the appropriate question.)\n\n                         Hwæt. We Gardena in geardagum,\n                              þeodcyninga, þrym gefrunon,\n       It is English, but not as you know it. To be specific, it’s Old English, taken from the\n     epic poem Beowulf, which is about a guy called Beowulf who pulls the arm off some\n 5   punter called Grendel. This Grendel then legs it back off to the cave where he lives\n     and bleeds to death. Anyway, composed between the years 700 and 1000, to ears used\n      to the sounds of modern English, it’s total gibberish. Even so, about half of the most\n    common words used in Modern English originated in Old English. But let’s now press\n      the anthropological linguistic fast-forward button to the Canterbury Tales, written\n 10  between 1387 and 1400:\n                     Whan that Aprill with his shoures soote\n                     The droghte of March hath perced to the roote\n     Unlike with Beowulf, I can just about make out what the writer’s banging on about.\n      It’s Middle English. Therefore, closer to Modern English than Old English. Now let’s\n 15  check out the first sentence in A Farewell to Arms, published in 1929:\n              In the late summer of that year we lived in a house in a village\n               that looked across the river and the plain to the mountains.\n     Not only can I understand that. You can understand it as well. (You might even have\n     seen the movie adaptation.) And these examples illustrate the point I’m trying to\n 20  make: there is no one correct form of English. It is in a constant state of evolution,\n      a process which will possibly never end.\n\n    ________________ (See the appropriate question.) Well, once upon a time, during\n      the mid-5 th to  7th centuries, Anglo-Saxon migrants from what  is now north-west\n 25  Germany, southern Denmark and the Netherlands settled in Britain. The language\n     they spoke, which was to form Old English, came to replace the Celtic languages\n     (and possibly British Latin) which had previously been dominant. Old English was\n      further impacted in the 6 th century by the arrival in Britain of Christianity. Around\n     600 words of Latin origin, including priest, paper and school, entered Old English at\n 30  this time. Then, in 865, following centuries of minor raids, Vikings from Scandinavia\n     launched a major invasion of England. They took control of much of the country.\n     Their language, Old Norse, had a strong influence on Old English. This is particularly\n      true of the region of Yorkshire, where many slang words have their origins in Old\n     Norse: the Yorkshire greeting Eh Up comes straight from Viking. However, the era\n 35  of Old English ended with the death of the last Anglo-Saxon king of England, Harold\n     Godwinson, at the Battle of Hastings in 1066. The Normans had conquered.\n\n    And Middle English had begun. The invading Normans (from the region of Normandy\n      in northern France) brought with them their variety of French (strongly influenced\n 40  by Latin). The key development in English at this time was its hybridization between\n     words of Germanic origin (from Old English) and words of Latin origin brought by\n      the invading Normans. The Normans, being the conquerors, became the rulers and\n     administrators, and French became the language of administration and the ruling\n      classes. This is partly why there are so many synonyms in English: there is one word\n 45  of Latin origin (brought by the Normans), and one word of Germanic origin (retained\n     from Old English). Contradict and gainsay, fatal and deadly, rage and anger. And,\n     because Norman French was the language of the ruling classes, words of Latin or\n     French origin are always more formal than their Germanic equivalents. Next up: the\n     end of Middle English, and what came after that.\n", "questions": [{"n": 1, "stem": "Grendel is ______.", "options": ["a character in a story", "a variety of spoken English", "an English place name", "the name of a poem"], "key": 0, "explanation": "a character in a story – Grendel is a character in the epic poem Beowulf"}, {"n": 2, "stem": "In Line 7, gibberish is ______.", "options": ["a very beautiful work of art of literature", "anything connected to the historical study of language", "language that doesn’t make any sense", "something historically very interesting"], "key": 2, "explanation": "language that doesn't make any sense – \"Gibberish\" means nonsense; Old English sounds like nonsense to modern ears"}, {"n": 3, "stem": "A Farewell to Arms is, MOST PROBABLY, a ______.", "options": ["famous 20 th century novel", "history of the English language", "very well-known work of Middle English", "poem the writer was forced to learn"], "key": 0, "explanation": "famous 20th century novel – A Farewell to Arms (1929) is a novel by Ernest Hemingway"}, {"n": 4, "stem": "Which statement would the writer MOST PROBABLY agree with?", "options": ["English is always changing.", "English is an easy language to learn.", "Students need to learn Old English.", "The best English is Middle English."], "key": 0, "explanation": "English is always changing – The writer says \"there is no one correct form of English… in a constant state of evolution\""}, {"n": 5, "stem": "What is the BEST sentence to BEGIN the paragraph from Line 23 to Line 36?", "options": ["English managed to survive invasions.", "Is it necessary to learn Old English?", "So, when did it actually start?", "When was proper English spoken?"], "key": 2, "explanation": "So, when did it actually start? – The paragraph from line 23 explains the origins of English"}, {"n": 6, "stem": "What is the MAIN SUBJECT of the paragraph from Line 23 to Line 36?", "options": ["English history from 500 to 700 CE.", "Historical influences on slang words in Yorkshire.", "The origins and development of Old English.", "The settlement of Anglo-Saxons in England."], "key": 2, "explanation": "The origins and development of Old English – That paragraph covers Anglo Saxon migration, Viking influence, and the end of Old English"}, {"n": 7, "stem": "In Line 31, They refers to ______.", "options": ["Around 600 words of Latin origin", "centuries of minor raids", "minor raids", "Vikings from Scandinavia"], "key": 3, "explanation": "Vikings from Scandinavia – \"They\" in line 31 refers to the Vikings who took control of much of England"}, {"n": 8, "stem": "From the final paragraph (Lines 38 - 49) we can INFER that ______.", "options": ["because they were immigrants, t u’s\n                           capital, Lima, to the north-eastern city of Iquitos,\n                        departed from Jorge Chavez International Airport\n        just before noon on the 24 th of December 1971. The  flight had\n 5     already  been  delayed  by  seven  hours  owing  to  the  weather     Juliane Koepcke in 2025\n       conditions, and the pilot was under pressure from passengers to get them home in\n      time for the holiday. Later reports were to show that, in response to this pressure,\n      he had knowingly and  intentionally flown  the  plane  into  an  area  of  severe\n      thunderstorms where the plane would be at great risk from lightning.\n      ________________ (See the appropriate question.) The child of German biologists\n     who had emigrated to Peru, she had been studying at high school in Peru. She was\n       travelling with her mother to meet her father, who was working in the city of\n       Pucallpa. Unlike  her mother, who always became nervous on plane s,  Juliane\n 15   Koepcke enjoyed flying but, an hour into the flight, the plane flew into a dark heavy\n       cloud, and it became clear that something was badly wrong. There was very heavy\n      turbulence, causing luggage to fall out of overhead compartments. Passengers were\n       crying and screaming. Then Juliane saw a very bright light coming from the port\n       side engine. The risk the pilot had chosen to ignore was to cause the destruction of\n 20    the plane. Her mother said, ‘That is the end. It’s all over.’ They were the last words\n       Juliane ever heard from her mother.\n\n      The plane broke up in mid-air. According to the accounts she later gave, Juliane’s\n      head seemed filled with the screams of the passengers and the roar of the engines.\n 25   And then she was outside the plane, still fastened by her seatbelt to her seat, and\n       the jungle floor was hurtling towards her. Juliane lost consciousness then, and so\n      remembers nothing of the impact, but when she came  to, she was lying on the\n      ground, surrounded by the trees and wildlife of the jungle. Her first thought was\n        that she had survived an air crash. She later discovered that she had survived a fall\n 30    of 3,200 metres without a parachute. She was the only survivor of a plane crash that\n      claimed the lives of ninety-one passengers and crew.\n\n                     Her injuries were not severe and, living with her parents in a\n                        jungle region of Peru, Juliane had learnt how to survive in the\n 35                     wild. She managed to walk to the crash-site, and found the bag of\n                       sweets that was to be her only sustenance for the next ten days.\n                  When she came to a narrow river, she walked in its waters. This\n      would, she knew, protect her from the poisonous plants and snakes of the jungle\n        floor. Piranhas were a threat too, but only in water that was not deep, so she kept\n 40    to the centre of the river. She encountered alligators, too, but knew they rarely\n       attacked humans.\n\n     On the tenth day, she came to a jungle hut, where she slept that night. She was\n      awakened the following day by local men speaking in Spanish. Juliane introduced\n 45    herself and explained what had happened. The men treated her injuries and fed her,\n      and then took her back to civilisation. The next day, she was reunited with her\n       father.\n", "questions": [{"n": 1, "stem": "Lansa Flight 508 ______.", "options": ["did not leave on time", "left in the middle of the night", "was an international flight", "was flying to Lima"], "key": 0, "explanation": "did not leave on time – The flight was delayed by seven hours"}, {"n": 2, "stem": "Why, MOST PROBABLY, did the pilot fly into the thunderstorm?", "options": ["He did not know it was there.", "He wanted to get his passengers home.", "He was trying to cause an accident.", "He had no n, ordered the crew to transfer their most vital\n       supplies and a lifeboat to the surrounding ice. Shortly after this had been done,\n        their ship finally sank. Their position at abandonment was 69°05′S, 51°30′W.\n\n 10       Men wanted for hazardous journey. Low wages, bitter cold, long hours of\n           complete darkness. Safe return doubtful. Honour and recognition in event\n             of success.\n\n      ________________ (See the appropriate question.)  It was a  call for sailors to\n 15    participate in the Imperial Trans-Antarctic Expedition, to be led by explorer Ernest\n       Shackleton. He’d come up with a plan to sail the Atlantic Ocean to the Antarctic,\n      which they would then traverse on foot, to be met by another ship on the Pacific\n      Ocean side. However, in January 1915, as they sailed towards the Pole, progress\n      became increasingly difficult, impeded by the heavy pack ice they encountered.\n 20    Finally, on 17 January 1915, the ship could go no further. Shackleton sent his men\n       out with picks to try to force a passage, but without success. The ship was held\n        fast. Meanwhile the crew on board began to hear strange sounds. They were the\n      sounds of the ship being crushed by ice.\n\n 25    After the ship sank on 28 October 1915, Ernest Shackleton and his men were left\n      on a piece of ice floating in the southern Atlantic Ocean. They had limited supplies\n      and had to endure freezing weather conditions. Their only hope was that the ice\n      might float close enough to land, allowing them to reach  it in their lifeboat. But\n       the ice was floating slowly. The sailors were to spend more than 6 months on the\n 30    ice, waiting for it to come close to land. Finally, on 8 April 1916, the ice began to\n        split and sink, forcing the men to their lifeboat. After a 6-day voyage, with little\n       food, in temperatures as low as -30 °C, they reached Elephant Island.\n\n       Elephant Island was too remote to be inhabited. Their ordeal was far from over. On\n 35   24 April 1916, they set off again into the freezing Atlantic Ocean, this time on a\n      voyage of 1,300 kilometres to the island of South Georgia. There, whaling stations\n      had been established. Help would be available. On 8 May, after a 15 -day voyage,\n       the cliffs of South Georgia came into view. They landed.\n\n 40    Unfortunately, they had landed on the wrong side of the island. There now remained\n        a crossing of some of the most inhospitable territory on earth, for which they lacked\n       basic climbing equipment, and were already close to starvation. The next successful\n       crossing of South Georgia would not be until October 1955, by Briton Duncan\n       Carse, who travelled the same route as Shackleton's party. In his autobiography My\n 45    Life On the Mountains, in tribute to them he wrote I do not know how they did it,\n       except that they had to, men of the heroic age of Antarctic exploration . On 20 May\n       1916, they reached the whaling station at Stromness, South Georgia. They were\n        safe. Their ordeal was over.\n", "questions": [{"n": 1, "stem": "The ship sank ______.", "options": ["after the crew removed supplies from the ship", "and the crew sailed away in their lifeboat", "shortly after sailing from South America", "soon after hitting an iceberg at sea"], "key": 0, "explanation": "after the crew removed supplies from the ship – Shackleton ordered supplies and a lifeboat transferred to the ice, then the ship sank"}, {"n": 2, "stem": "69°05′S, 51°30′W is a ______.", "options": ["location on a map", "radio message saying their ship was sinking", "route they wanted to take", "time"], "key": 0, "explanation": "location on a map – The coordinates 69°05′S, 51°30′W indicate a geographical position"}, {"n": 3, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 14 – 23)?", "options": ["Few would ever return from this hazardous journey to the Antarctic.", "However, after this ship sank, there was a second expedition.", "Two years earlier the ship’s crew had responded to this advertisement.", "What kind of man dreams of becoming an Antarctic explorer?"], "key": 2, "explanation": "Two years earlier the ship's crew had responded to this advertisement – This sentence introduces the famous recruitment ad that appears in Paragraph Two"}, {"n": 4, "stem": "What is the MAIN SUBJECT of Paragraph Two (Lines 14 – 23)?", "options": ["Dangers for South Atlantic sailors.", "Explorations of the Arctic and Antarctic.", "The life of explorer Ernest Shackleton.", "The main events before the ship sank."], "key": 3, "explanation": "Main events before the ship sank – Paragraph Two presents the advertisement that led to the expedition, which occurred before the Endurance became trapped"}, {"n": 5, "stem": "If something impedes you (Line 19), it ______.", "options": ["encourages you to change your mind", "makes it harder for you to do something", "reduces your body temperature", "stops you understanding a situation"], "key": 1, "explanation": "makes it harder for you to do something – \"Impedes\" means hinders or obstructs"}, {"n": 6, "stem": "The ship sank because ______.", "options": ["it was struck by an iceberg", "of the pressure of the ice around it", "the engine had mechanical problems", "there were very heavy storms"], "key": 1, "explanation": "of the pressure of the ice around it – The ship was crushed by pack ice"}, {"n": 7, "stem": "Paragraph Three (Lines 25 – 32) DOES NOT state or imply that ______.", "options": ["Shackleton’s men spent about half a year on the ice", "the crew experienced very bad living conditions", "the piece of ice they were on landed at an island", "the sailors were eventually forced off the ice"], "key": 2, "explanation": "the piece of ice they were on landed at an island – The men left the ice in a lifeboat; the ice itself did not reach land"}, {"n": 8, "stem": "What does There in Line 36 refer to?", "options": ["a voyage of 1,300 kilometres", "Elephant Island", "South Georgia", "the freezing Atlantic Ocean"], "key": 2, "explanation": "South Georgia – The whaling stations were on South Georgia"}, {"n": 9, "stem": "Duncan Carse was MOST PROBABLY a ______.", "options": ["climber", "journalist", "scientist", "whale hunter"], "key": 0, "explanation": "climber – Duncan Carse wrote \"My Life On the Mountains\" and crossed the same route"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Ernest Shackleton’s Expedition to the Antarctic", "How and Why Elephant Island Was Discovered", "The First Man To Reach The North Pole", "The Sinking of the RMS Endurance in 1916"], "key": 0, "explanation": "Ernest Shackleton's Expedition to the Antarctic – The article covers the entire Imperial Trans Antarctic Expedition from start to rescue"}], "vocab": [{"word": "abandon", "meta": "B2, verb · AWL", "meaning": "to leave a ship, vehicle, or place permanently, especially in an emergency", "group": "Text 7", "page": 231}, {"word": "trapped", "meta": "B2, adjective", "meaning": "unable to move or escape from a situation or place", "group": "Text 7", "page": 231}, {"word": "vessel", "meta": "B2, noun · AWL", "meaning": "a large ship or boat", "group": "Text 7", "page": 231}, {"word": "hull", "meta": "C1, noun", "meaning": "the main body of a ship, including the bottom and sides", "group": "Text 7", "page": 231}, {"word": "transfer", "meta": "B2, verb · AWL", "meaning": "to move something from one place to another", "group": "Text 7", "page": 231}, {"word": "vital", "meta": "B2, adjective · AWL", "meaning": "absolutely necessary or essential", "group": "Text 7", "page": 231}, {"word": "bitter", "meta": "B2, adjective", "meaning": "extremely cold; also showing anger or resentment", "group": "Text 7", "page": 231}, {"word": "recognition", "meta": "B2, noun · AWL", "meaning": "acknowledgment or praise for achievement", "group": "Text 7", "page": 231}, {"word": "participate", "meta": "B2, verb · AWL", "meaning": "to take part in an activity or event", "group": "Text 7", "page": 231}, {"word": "expedition", "meta": "B2, noun · AWL", "meaning": "an organised journey with a specific purpose, especially exploration", "group": "Text 7", "page": 231}, {"word": "traverse", "meta": "C1, verb", "meaning": "to travel across or through an area", "group": "Text 7", "page": 231}, {"word": "progress", "meta": "B2, noun · AWL", "meaning": "forward movement or development", "group": "Text 7", "page": 231}, {"word": "increasingly", "meta": "B2, adverb · AWL", "meaning": "more and more over time", "group": "Text 7", "page": 231}, {"word": "impede", "meta": "C1, verb", "meaning": "to slow down or block progress", "group": "Text 7", "page": 231}, {"word": "ordeal", "meta": "C1, noun", "meaning": "a very difficult or painful experience", "group": "Text 7", "page": 231}, {"word": "inhospitable", "meta": "C1, adjective", "meaning": "harsh and difficult to live in; unwelcoming", "group": "Text 7", "page": 231}, {"word": "starvation", "meta": "C1, noun", "meaning": "extreme suffering or death caused by hunger", "group": "Text 7", "page": 231}], "vocabularyPages": [231], "topic": "Ernest Shackleton and the Endurance"}, {"id": "reading-8", "unit": 2, "skill": "Reading", "title": "Text 8", "label": "Text 8", "pages": [33, 34], "text": "                                                      Text 8\n     Reading\n\n            ________________ (See the appropriate question.)\n\n       In 2002, when found again, the woman was living in her native\n       village, a remote settlement in the foothills of the Hindu Kush, the\n      mountain range separating Afghanistan from Pakistan. Life in her\n       village, a place which lacked schools, medical  facilities,  r oads,\n 5    even basic sanitation, was simple. She rose before dawn to pray.\n      She fetched water from the stream. She cooked, cleaned and did the\n       laundry. She took care of her three children. (A fourth child had\n       died in infancy.) She rarely saw her husband, whom she had married\n        at the age of 16. He worked as a baker over the border in the Pakistan city of\n 10   Peshawar, but her health (she suffered from asthma) rendered the pollution and\n       heat of Peshawar unbearable, so she stayed in Afghanistan. He returned to his family\n        in the village when he could. She had returned home in 1996.\n\n      ________________ (See the appropriate question.) In 1979, she, her grandparents,\n 15    her brother and three  sisters had  fled  to Pakistan when the Russians invaded\n      Afghanistan, killing her parents and destroying her village. Starving, they hiked\n      through the snow and ice of the mountains, begging for the food and blankets that\n      could keep them alive. After a week, they reached their destination: a refugee camp\n      on the Pakistani side of the border, a city of tents that would be home for the nex t\n 20   17 years.\n\n       Life in the camp was hard, without adequate provision of medical resources or\n       sanitation. In  its cramped conditions, like everybody else she lived with  little\n       privacy, constantly at the mercy of others, living the unstable life of a refugee.\n 25   However, there was a school at the camp which she was able to attend.\n\n     One day in 1984, journalists from National Geographic magazine came to visit the\n     camp and its school, and to photograph the refugees they saw there. For the first\n      time in her life, she had her photograph taken. The photographer, whose name was\n 30   Steve McCurry, later recalled that he had tricked her into agreein g to have her\n      photograph taken. He knew that she was unique. He wanted to photograph her as\n      soon as he saw her intense green eyes. But he also sensed her shyness, and that she\n      would refuse  if he immediately asked for permission to take her photograph. So\n       instead, he photographed all the other children first, without asking her, in the hope\n 35    that she would feel left out. McCurry’s trick was successful. Despite her discomfort\n      with being photographed by a man she didn’t know, she agreed. Her photograph was\n       taken. The team of National Geographic journalists left the refugee camp shortly\n        after.\n\n 40   She wasn’t photographed again until 2002, when the team of journalists found her,\n      and when for the first time she learned how famous her photograph had become.\n      Her initial response when she saw the photograph was anger: the famous red shawl\n       she had been wearing was torn at the shoulder. It was also in 2002 that the world\n       learned her name: Sharbat Gula.\n", "questions": [{"n": 1, "stem": "What is the MAIN SUBJECT of Paragraph One (Lines 1 – 12)?", "options": ["The differences between life in Pakistan and Afghanistan.", "The village where the woman lived.", "The woman’s husband.", "The woman’s life in 2002."], "key": 3, "explanation": "The woman's life in 2002 – Paragraph One describes her daily routines, family, and health in her village"}, {"n": 2, "stem": "Without changing the meaning, what can replace rendered (Line 10)?", "options": ["affected", "made", "reduced", "was caused by"], "key": 1, "explanation": "made – \"Rendered\" here means caused to become; her health made the pollution unbearable"}, {"n": 3, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 14 – 20)?", "options": ["Her eldest daughter also lived in Peshawar.", "She had originally left to find work in Pakistan.", "She was happy to see her village exactly as she had left it.", "Tragedy came to her family when she was a child."], "key": 3, "explanation": "Tragedy came to her family when she was a child – Paragraph Two begins with the Russian invasion and the death of her parents"}, {"n": 4, "stem": "Who or what does they in Line 16 refer to?", "options": ["her brother and three sisters", "her parents", "she, her grandparents, her brother and three sisters", "the Russians"], "key": 2, "explanation": "she, her grandparents, her brother and three sisters – \"They\" refers to the group that fled to Pakistan"}, {"n": 5, "stem": "She and her family went to Pakistan because ______.", "options": ["it was dangerous to stay in Afghanistan", "there were few jobs in Afghanistan", "they wanted to find jobs in Pakistan", "they wanted to visit family members in Pakistan"], "key": 0, "explanation": "it was dangerous to stay in Afghanistan – The Russians invaded, killed her parents, and destroyed her village"}, {"n": 6, "stem": "Paragraph Three (Lines 22 – 25) DOES NOT say that ______.", "options": ["other people had power over her", "the camp had no facilities of any kind", "there was not enough privacy at the camp", "there was not enough provision of medical services"], "key": 1, "explanation": "the camp had no facilities of any kind – The text says there was a school, so some facilities existed"}, {"n": 7, "stem": "Steve McCurry ______.", "options": ["had been told about the girl before he ever saw her", "had no idea that a photograph of the girl would be special", "had not planned to take photographs before he visited the camp", "knew the girl would not want to have her photograph taken"], "key": 3, "explanation": "knew the girl would not want to have her photograph taken – McCurry sensed her shyness and that she would refuse if asked directly"}, {"n": 8, "stem": "When you feel left out (Line 35), you feel _______.", "options": ["angry because something bad had been done to you", "nervous because you are doing something for the first time", "sad because people are doing something without you", "very reluctant to agree to something"], "key": 2, "explanation": "sad because people are doing something without you – To feel left out is to feel excluded"}, {"n": 9, "stem": "When the woman first learned of the photograph, she was ______.", "options": ["amazed that she had become so famous", "angry that her photograph had been used without her agreement", "excited because she could get money from the photograph’s use", "unhappy with how she looked in the photograph"], "key": 3, "explanation": "unhappy with how she looked in the photograph – Her first reaction was anger because her red shawl was torn at the shoulder"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["How A Famous Photograph Was Taken", "Sharbat Gula’s Difficult Life in Afghanistan", "The Hardships Faced By Refugees", "The Life Of Sharbat Gula"], "key": 3, "explanation": "The Life Of Sharbat Gula – The article traces her life from childhood in Afghanistan to refugee camp to being reunited with her father"}], "vocab": [{"word": "settlement", "meta": "B2, noun · AWL", "meaning": "a place where people have come to live", "group": "Text 8", "page": 231}, {"word": "sanitation", "meta": "C1, noun", "meaning": "systems for maintaining public health, especially clean water and waste disposal", "group": "Text 8", "page": 231}, {"word": "infancy", "meta": "C1, noun", "meaning": "the very early stage of childhood; also the early stage of development", "group": "Text 8", "page": 231}, {"word": "render", "meta": "C1, verb · AWL", "meaning": "to cause someone or something to become a particular state", "group": "Text 8", "page": 231}, {"word": "unbearable", "meta": "C1, adjective", "meaning": "too painful, unpleasant, or difficult to tolerate", "group": "Text 8", "page": 231}, {"word": "invade", "meta": "B2, verb · AWL", "meaning": "to enter a country by force with an army", "group": "Text 8", "page": 231}, {"word": "provision", "meta": "B2, noun · AWL", "meaning": "the act of supplying something; also a supply of food and equipment", "group": "Text 8", "page": 231}, {"word": "resources", "meta": "B2, noun · AWL", "meaning": "stocks of money, materials, or other assets that can be used", "group": "Text 8", "page": 231}, {"word": "conditions", "meta": "B2, noun · AWL", "meaning": "the state of the environment or circumstances in which someone lives", "group": "Text 8", "page": 231}, {"word": "unstable", "meta": "B2, adjective · AWL", "meaning": "not steady, secure, or predictable", "group": "Text 8", "page": 231}, {"word": "recall", "meta": "B2, verb · AWL", "meaning": "to remember or bring back a memory", "group": "Text 8", "page": 232}, {"word": "unique", "meta": "B2, adjective · AWL", "meaning": "being the only one of its kind; very special or unusual", "group": "Text 8", "page": 232}, {"word": "discomfort", "meta": "B2, noun · AWL", "meaning": "a feeling of slight pain, embarrassment, or unease", "group": "Text 8", "page": 232}, {"word": "permission", "meta": "B2, noun · AWL", "meaning": "approval or authorisation to do something", "group": "Text 8", "page": 232}, {"word": "shyness", "meta": "C1, noun", "meaning": "the quality of being nervous or timid around other people", "group": "Text 8", "page": 232}], "vocabularyPages": [231, 232], "topic": "Sharbat Gula"}, {"id": "reading-9", "unit": 2, "skill": "Reading", "title": "Text 9", "label": "Text 9", "pages": [42, 43], "text": "                                            Text 9\n     Reading\n\n                  ________________ (See the appropriate question.)\n\n     What do we mean when we talk about the tipping point for electric cars? It refers to\n      the point at which electric cars become more attractive to consumers than their petrol\n      or  diesel equivalents,  largely through being  overall, over  their whole  lifetime,\n     cheaper to buy, run and maintain. At this point, the theory goes, the mass adoption\n 5    of electric cars becomes inevitable. Petrol -driven cars, like horse-driven carts, steam\n      trains  or  telephone  landlines  before  them,  set  off  on  a downward  slope  to\n     obsolescence. A new Industrial Revolution will have begun: the global shift from\n      petrol to electrically-powered transport, EVs. This tipping point was reached in\n     2020.\n     ________________ (See the appropriate question.) Many commentators, however,\n      believe that 2020 marked the point where mass adoption of electric cars became\n      inevitable. And car manufacturers agree with them. Jaguar has announced that from\n     2025 onwards it will manufacture only electric cars, Lotus from 2028, and Volvo and\n 15  Ford Europe  (only  its European  division) from 2030, with VW planning 70%\n      electrical vehicles from the same year.\n\n    Why has this change taken place? In this article, issues of climate change or air\n      pollution caused by fossil fuel emissions will not be considered. These, anyway, are\n 20   all reasons why we should not use cars run on fossil fuels. They are not necessarily\n      factors  that make  electric  cars  attractive  to consumers. The  first  factor  to be\n     considered is that of cost.\n\n     As previously stated, in 2020, in markets around the world, for the first time  it\n 25  became cheaper to buy, run and maintain electrical cars than petrol cars. While the\n       initial cost of electric cars is still higher than petrol, a steep fall in the price of EV\n      batteries brought the unit cost closer to that of petrol. In 2010, a 30kWh battery cost\n     $30,000. In 2020, as a result of scale-ups in production and reductions in the cobalt\n      required in manufacturing, the same battery costs $4100. This has a knock -on effect\n 30  on the overall cost of the EV. Along with the already lower running and maintenance\n      costs of EVs, the overall cost is now lower than that of petrol or diesel cars. In\n      addition, the electricity used in home-charging is becoming cheaper, with utility\n     providers such as British Gas offering an off-peak tariff from 12:00 to 05:00, which\n     allows cheaper recharging (www.britishgas.co.uk/energy/ev -tariff-home).\n     Manufacturers anticipate further reductions in EV battery unit costs, and increases\n      in efficiency, as alternatives are found to traditional batteries. New technologies are\n     being developed, including solid state and lithium-ion batteries, which are cheaper\n     and more energy-dense. These technologies may be introduced as soon as mid-\n 40  decade.\n\n    An issue that has slowed the adoption of electric cars, which is now largely being\n     overcome, is that of range. Many drivers were dissuaded from EVs through range\n      anxiety: the fear of the battery running out mid-journey, leaving you stranded in two\n 45  tons of immovable metal. Three factors have soothed these anxieties. Firstly, average\n     range is far greater than  it was, with most EVs capable of b etween 300 and 500\n     kilometres on one charge. Secondly, there is now a far greater proliferation of fast -\n     charging points: in the UK, there are now 42,000 charge point connectors in over\n     15,500 locations. Finally,  it  is now possible to charge your car much faster: 30\n 50  minutes of fast-charging gives 150 kilometres of range.\n", "questions": [{"n": 1, "stem": "Paragraph One (Lines 1 – 9) IMPLIES that ______.", "options": ["a new Industrial Revolution has already begun", "electric cars may in the future become more attractive than petrol cars", "in 2020 electric cars became cheaper to buy than petrol cars", "the tipping point is a theory that hasn’t yet become true"], "key": 0, "explanation": "a new Industrial Revolution has already begun – The text states the tipping point was reached in 2020, and a new Industrial Revolution will have begun"}, {"n": 2, "stem": "Obsolescence (Line 7) is the state of something ______.", "options": ["being considered damaging and harmful to the natural environment", "no longer being in use, as it has been replaced by something better", "that exists only as an idea, and does not have any physical form", "that has not yet reached maturity, but is getting older very fast"], "key": 1, "explanation": "no longer being in use, as it has been replaced by something better – Obsolescence means falling into disuse because newer alternatives exist"}, {"n": 3, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 11 – 16)?", "options": ["Car manufacturers do not yet understand how important electric cars are.", "Elon Musk, founder of Tesla, has paid a key role in this process.", "Perhaps it hasn’t yet been reached in KSA, where petrol is still very cheap.", "What do we mean when we talk about climate change and global warming?"], "key": 2, "explanation": "Perhaps it hasn't yet been reached in KSA, where petrol is still very cheap – This contrast explains the \"however\" that begins Paragraph Two"}, {"n": 4, "stem": "Which company is MOST likely to STILL sell petrol cars from 2030 onwards?", "options": ["Ford", "Jaguar", "Lotus", "Volvo"], "key": 0, "explanation": "Ford – Only Ford's European division is committed to all electric by 2030; Ford elsewhere may still sell petrol cars"}, {"n": 5, "stem": "What does These (Line 19) refer to?", "options": ["emissions", "fossil fuel emissions", "issues of climate change", "issues of climate change or air pollution caused by fossil fuel emissions"], "key": 3, "explanation": "issues of climate change or air pollution caused by fossil fuel emissions – \"These\" refers back to the two issues mentioned in the previous sentence"}, {"n": 6, "stem": "What is the MAIN SUBJECT of Paragraph Four (Lines 24 – 34)?", "options": ["Companies offering cheaper electricity for home-charging.", "Reasons why electric car batteries have become cheaper.", "Reductions in the cost of buying and running electric cars.", "Why electric cars are now cheaper to buy than petrol cars."], "key": 2, "explanation": "Reductions in the cost of buying and running electric cars – Paragraph Four covers battery prices, running costs, and cheaper home charging"}, {"n": 7, "stem": "A utility (Line 32) is ______.", "options": ["a service used by the public", "an electricity supply to people’s homes", "gas that people buy for cooking", "something used to recharge electric cars"], "key": 0, "explanation": "a service used by the public – A utility provider supplies essential services like gas and electricity"}, {"n": 8, "stem": "Paragraph Six (Lines 42 – 50) DOES NOT say that electric cars ______.", "options": ["can be charged at over 15,500 places in the UK", "can do 150 kilometres after being charged for half an hour", "can usually do from 300 to 500 kilometres without being recharged", "frequently run out of power while you are driving somewhere"], "key": 3, "explanation": "frequently run out of power while you are driving somewhere – The text mentions \"range anxiety\" as a fear, not as a frequent occurrence"}, {"n": 9, "stem": "To dissuade somebody (Line 43) means to ______.", "options": ["absolutely hate something", "persuade somebody not to do something", "remove somebody from a vehicle", "sell something that you don’t want any more"], "key": 1, "explanation": "persuade somebody not to do something – To dissuade means to convince someone against an action"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Battery Technology: How Electric Car Batteries Work", "Climate Change: The Damage Caused by Vehicles That Use Fossil Fuels", "Is It Possible That Electric Cars Could Ever Replace Petrol Cars?", "Why Electric Cars Will Become More Common Than Petrol Cars"], "key": 3, "explanation": "Why Electric Cars Will Become More Common Than Petrol Cars – The article argues that cost and range improvements make EV adoption inevitable"}], "vocab": [{"word": "consumer", "meta": "B2, noun · AWL", "meaning": "a person who purchases goods or services for personal use", "group": "Text 9", "page": 232}, {"word": "maintain", "meta": "B2, verb · AWL", "meaning": "to keep something in good condition by regular repair and care", "group": "Text 9", "page": 232}, {"word": "adoption", "meta": "C1, noun · AWL", "meaning": "widespread acceptance and use of a product or technology", "group": "Text 9", "page": 232}, {"word": "inevitable", "meta": "B2, adjective · AWL", "meaning": "certain to happen; unavoidable", "group": "Text 9", "page": 232}, {"word": "obsolescence", "meta": "C1, noun", "meaning": "the state of becoming outdated or no longer useful", "group": "Text 9", "page": 232}, {"word": "shift", "meta": "B2, noun/verb · AWL", "meaning": "a change in position, direction, or focus", "group": "Text 9", "page": 232}, {"word": "commentator", "meta": "C1, noun", "meaning": "a person who provides analysis or opinions on events or developments", "group": "Text 9", "page": 232}, {"word": "manufacturer", "meta": "B2, noun · AWL", "meaning": "a company or person that produces goods in large quantities", "group": "Text 9", "page": 232}, {"word": "announce", "meta": "B2, verb · AWL", "meaning": "to make something known publicly or officially", "group": "Text 9", "page": 232}, {"word": "manufacture", "meta": "B2, verb · AWL", "meaning": "to produce goods in large quantities using machinery", "group": "Text 9", "page": 232}, {"word": "division", "meta": "B2, noun · AWL", "meaning": "a section or branch of a larger organisation", "group": "Text 9", "page": 232}, {"word": "emissions", "meta": "B2, noun · AWL", "meaning": "substances released into the atmosphere, especially waste gases", "group": "Text 9", "page": 232}, {"word": "factor", "meta": "B2, noun · AWL", "meaning": "an element or cause that contributes to a result", "group": "Text 9", "page": 232}, {"word": "steep", "meta": "B2, adjective", "meaning": "sharp or rapid (especially of a rise or fall)", "group": "Text 9", "page": 232}, {"word": "reduction", "meta": "B2, noun · AWL", "meaning": "the act of making something smaller or less", "group": "Text 9", "page": 232}, {"word": "maintenance", "meta": "B2, noun · AWL", "meaning": "the process of keeping something in good condition", "group": "Text 9", "page": 232}], "vocabularyPages": [232], "topic": "E
