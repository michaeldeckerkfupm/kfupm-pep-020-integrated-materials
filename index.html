ls reds but doesn’t hurt greys", "we are still not completely sure why greys replaced reds"], "key": 1, "explanation": "the text says \"There is no evidence of inter-species conflict, so that can be discounted\""}, {"n": 8, "stem": "What does which in Line 30 refer to?", "options": ["grey squirrels", "inter-species conflict", "The most significant factor", "the parapoxvirus"], "key": 3, "explanation": "the parapoxvirus is hosted by grey squirrels and is deadly for reds – which refers to the parapoxvirus"}, {"n": 9, "stem": "What is the MAIN SUBJECT of Paragraph Five (Lines 37 – 44)?", "options": ["Common problems with home insurance policies.", "Invasive Species in Britain.", "The history of squirrels in Britain.", "Why grey squirrels are considered to be a problem."], "key": 3, "explanation": "paragraph five explains damage to forestry and houses, and laws against grey squirrels"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Bingley Roofing", "Mick from Bingley Roofing", "Mrs Erica Smith", "Squirrels"], "key": 3, "explanation": "the article focuses on grey squirrels as a pest species, using Mrs Smith's story as an introduction"}], "vocab": [{"word": "contractors", "meta": "B2, noun", "meaning": "workers hired to repair or maintain roofs", "group": "Text 35", "page": 243}, {"word": "plague", "meta": "C1, verb", "meaning": "to bother or cause problems over a period", "group": "Text 35", "page": 243}, {"word": "attic", "meta": "B2, noun", "meaning": "a space just below the roof", "group": "Text 35", "page": 243}, {"word": "scaffolding", "meta": "B2, noun", "meaning": "a temporary structure to support workers during repairs", "group": "Text 35", "page": 244}, {"word": "contract", "meta": "B2, verb", "meaning": "to formally hire for specific work", "group": "Text 35", "page": 244}, {"word": "pest species", "meta": "B2, noun", "meaning": "a type of animal that is harmful or destructive", "group": "Text 35", "page": 244}, {"word": "criminal offence", "meta": "B2, noun", "meaning": "an action that is illegal", "group": "Text 35", "page": 244}, {"word": "humanely dispatch", "meta": "C1, verb", "meaning": "to kill in a way that causes minimum pain", "group": "Text 35", "page": 244}, {"word": "indigenous", "meta": "C1, adjective", "meaning": "native to a particular place or region", "group": "Text 35", "page": 244}, {"word": "dominant species", "meta": "B2, noun", "meaning": "the most numerous or powerful species", "group": "Text 35", "page": 244}, {"word": "displace", "meta": "B2, verb · AWL", "meaning": "to force out of a habitat", "group": "Text 35", "page": 244}, {"word": "inter-species", "meta": "C1, adjective", "meaning": "between different species", "group": "Text 35", "page": 244}, {"word": "parapoxvirus", "meta": "C1, noun", "meaning": "a virus that causes disease in certain animals", "group": "Text 35", "page": 244}, {"word": "immunity", "meta": "B2, noun", "meaning": "the body's ability to resist infection", "group": "Text 35", "page": 244}, {"word": "survival rates", "meta": "B2, noun", "meaning": "the percentage that remain alive", "group": "Text 35", "page": 244}, {"word": "adaptable", "meta": "B2, adjective", "meaning": "able to change to new conditions", "group": "Text 35", "page": 244}, {"word": "vermin", "meta": "B2, noun", "meaning": "wild animals considered pests", "group": "Text 35", "page": 244}, {"word": "invasive species", "meta": "B2, noun", "meaning": "a non-native species that causes harm", "group": "Text 35", "page": 244}, {"word": "insulation", "meta": "B2, noun", "meaning": "materials used to prevent heat or sound from passing through", "group": "Text 35", "page": 244}], "vocabularyPages": [243, 244], "topic": "Grey Squirrels"}, {"id": "reading-36", "unit": 7, "skill": "Reading", "title": "Text 36", "label": "Text 36", "pages": [146, 147], "text": "                                         Text 36\n     Reading\n\n                   ________________ (See the appropriate question.)\n\n     Why are so many cities built in earthquake zones? Throughout history, earthquakes\n      have again and again brought death and destruction to the world’s urban centres :\n      750,000 dead in the Tangshan earthquake in China in 1976, 170,000 dead in Banda\n      Aceh in 2004, 140,000 dead in the Tokyo earthquake of 1923, 40,000 in Lisbon in\n 5    1755. The list goes on. And yet the expansion of urban centres in areas at risk from\n      earthquakes  is continuing. There are growing populations  in  cities around the\n      Xianshuihe, Min Jang and Kunlun fault lines in China. Similarly, California, India,\n       Iran and Ecuador all have expanding cities at major risk of earthquakes. Many urban\n       planners are behaving as if a method of preventing earthquakes had been found.\n       Clearly, that  is never going to happen, but a great deal of                   Toad\n       research  is  being  done  on  predicting  and  preparing  for\n      earthquakes so their effects can be mitigated. Earthquakes can\n      be predicted: a 2010 study in the Journal of Zoology reported\n 15    that 96% of toads in an Italian earthquake zone left the area 5\n      days before a series of earthquakes struck. From this, scientists have inferred that\n      they were able to detect signs of imminent earthquakes of which humans were\n      unaware. To predict earthquakes effectively, scientists still need to discover what\n       those signs are. However, much progress in earthquake prediction has been made\n 20   over the last 50 years. We now know, for example, that prior to an earthquake there\n       are emissions of radon gas from cracks in the Earth’s crust. Laser beams can be\n      used to detect plate movement, and seismometers can detect movement deep under\n       the ground. All of this helps us guess that an earthquake is imminent.\n\n 25   ________________ (See the appropriate question.) We know approximately where\n      earthquakes  will take place (along  plate boundaries, such  as California’s San\n      Andreas Fault) but we are not able to make specific predictions of their precise\n       location, magnitude and, most importantly, exactly when they will occur. For this\n       reason, more attention is now given to preparation for earthquakes.\n      People living in earthquake zones need to know what to do in the event of an\n       earthquake. Training is vital. In industrialised nations in earthquake zones, such as\n       the United States, schools hold earthquake drills, and reinforce the importance of\n       putting together earthquake kits containing first-aid supplies, blankets, tinned food\n 35   and bottles of water. But training people is only half the story. Urban infrastructure\n      needs to be designed to withstand the effects of earthquakes. Buildings, roads and\n       bridges are designed and built to absorb the kinetic energy of earthquakes: they\n      need to be not only strong enough, but also flexible enough to absorb vibrations\n      without collapsing. Electricity generating plants need to be desi gned so that they\n 40   remain safe in the event of an earthquake. (Something that clearly failed in the case\n       of  the  Japanese  Fukushima  disaster  in  2011.)  For  this  reason,  since  1973\n       construction work in the earthquake zones of industrialised societies has conformed\n        to the Uniform Building Code, an international set of standards for construction\n      work able to withstand earthquakes.\n", "questions": [{"n": 1, "stem": "What is the BEST TITLE for this article?", "options": ["Predicting And Preparing For Earthquakes", "Signs That An Earthquake Will Take Place", "The World Cities At Risk Of Earthquakes", "What We Are Learning Of The Causes Of Earthquakes"], "key": 0, "explanation": "the article covers both earthquake prediction and preparation, as seen in paragraphs two, three and four"}, {"n": 2, "stem": "What is the MAIN SUBJECT of Paragraph One (Lines 1 - 9)?", "options": ["Cities in earthquake zones.", "Earthquake zones around the world.", "The reasons why cities are built in earthquake zones.", "The world’s worst earthquakes."], "key": 0, "explanation": "paragraph one discusses why cities are built in earthquake zones and lists examples of such cities"}, {"n": 3, "stem": "The text says that a way of preventing earthquakes ______.", "options": ["has possibly been found", "might be found", "might have been found", "will not be found"], "key": 3, "explanation": "line 10: \"Clearly, that is never going to happen\" – a way of preventing earthquakes will not be found"}, {"n": 4, "stem": "If something is mitigated (Line 13), ______.", "options": ["a study is made of it", "an estimate is made of when it will happen", "it is believed to be negative", "it is made less harmful"], "key": 3, "explanation": "mitigated means made less harmful – research aims to mitigate the effects of earthquakes"}, {"n": 5, "stem": "It is IMPLIED that the toads ______.", "options": ["luckily and by chance escaped an earthquake", "knew there was going to be an earthquake", "were an endangered species in Italy", "were rescued to save them from an earthquake"], "key": 1, "explanation": "the toads left the area 5 days before earthquakes struck, implying they knew an earthquake was coming"}, {"n": 6, "stem": "What does they in Line 17 refer to?", "options": ["5 days", "earthquakes", "scientists", "toads"], "key": 3, "explanation": "toads – \"they were able to detect signs\" refers back to the toads"}, {"n": 7, "stem": "If something is imminent (Line 23), it ______.", "options": ["is going to happen soon", "is very damaging", "may already have happened", "only occurs underground"], "key": 0, "explanation": "imminent means going to happen soon – earthquakes are imminent"}, {"n": 8, "stem": "What is the BEST sentence to BEGIN Paragraph Three (Lines 25 – 29)?", "options": ["Earthquake prediction, however, is still inaccurate.", "People are now usually evacuated before an earthquake takes place.", "We also know how strong earthquakes will be.", "Where do earthquakes occur?"], "key": 0, "explanation": "paragraph three states prediction is still inaccurate – we cannot predict precise location, magnitude or exact time"}, {"n": 9, "stem": "What is the MAIN SUBJECT of Paragraph Four (Lines 31 – 44)?", "options": ["Designing power plants to withstand earthquakes.", "How people in earthquake zones are trained.", "Preparing for earthquakes: training and infrastructure.", "Why do people want to live in earthquake zones?"], "key": 2, "explanation": "paragraph four covers both training people and designing infrastructure to withstand earthquakes"}, {"n": 10, "stem": "Paragraph Four (Lines 31 – 44) DOES NOT say that ______.", "options": ["buildings in earthquake zones are built using special building regulations", "for buildings to withstand earthquakes, it is not enough for them to be very strong", "in 2011, a Japanese power plant became dangerous after an earthquake", "schools in the United States keep heavy mechanical equipment for earthquakes"], "key": 3, "explanation": "the text mentions earthquake drills and kits, but not heavy mechanical equipment kept in schools"}], "vocab": [{"word": "earthquake zones", "meta": "B2, noun", "meaning": "geographic areas where seismic activity occurs", "group": "Text 36", "page": 244}, {"word": "urban centres", "meta": "B2, noun · AWL", "meaning": "cities or large towns", "group": "Text 36", "page": 244}, {"word": "expansion", "meta": "B2, noun · AWL", "meaning": "the growth or increase in size", "group": "Text 36", "page": 244}, {"word": "fault lines", "meta": "B2, noun", "meaning": "cracks where tectonic plates meet", "group": "Text 36", "page": 244}, {"word": "urban planners", "meta": "B2, noun", "meaning": "professionals who design city development", "group": "Text 36", "page": 244}, {"word": "imminent", "meta": "C1, adjective", "meaning": "about to happen very soon", "group": "Text 36", "page": 244}, {"word": "cracks", "meta": "B2, noun", "meaning": "narrow openings or fractures", "group": "Text 36", "page": 244}, {"word": "seismometers", "meta": "C1, noun", "meaning": "instruments that measure ground movements", "group": "Text 36", "page": 244}, {"word": "plate boundaries", "meta": "B2, noun", "meaning": "edges where tectonic plates meet", "group": "Text 36", "page": 244}, {"word": "magnitude", "meta": "B2, noun · AWL", "meaning": "a measure of an earthquake's size or strength", "group": "Text 36", "page": 244}, {"word": "earthquake drills", "meta": "B2, noun", "meaning": "practice exercises to teach people how to respond", "group": "Text 36", "page": 244}, {"word": "first-aid supplies", "meta": "B2, noun", "meaning": "basic medical equipment for emergencies", "group": "Text 36", "page": 244}, {"word": "urban infrastructure", "meta": "B2, noun", "meaning": "fundamental facilities and structures for a city to function", "group": "Text 36", "page": 244}, {"word": "flexible", "meta": "B2, adjective", "meaning": "able to bend or move without breaking", "group": "Text 36", "page": 244}, {"word": "collapsing", "meta": "B2, verb", "meaning": "falling down suddenly", "group": "Text 36", "page": 244}, {"word": "conform", "meta": "B2, verb · AWL", "meaning": "to follow or obey established rules", "group": "Text 36", "page": 244}], "vocabularyPages": [244], "topic": "Earthquakes"}, {"id": "reading-37", "unit": 7, "skill": "Reading", "title": "Text 37", "label": "Text 37", "pages": [148, 149], "text": "                                Text 37\n     Reading\n\n                         ________________ (See question 1.)\n\n      In 1890, the village of Auvers-sur-Oise, located 27 km north-west of the centre of\n       Paris, was home  to  the Auberge Ravoux,  a  hotel  popular  with  Paris’s  artistic\n     community. On the 27 th July of that year, Adeline Ravoux, the daughter of its owner,\n      witnessed the return of one of the guests, an artist resident there for the last 70 days.\n 5   He was clearly in pain. Holding his stomach, bent double, the artist crossed the hall,\n      took the staircase and went to his attic room. Concerned for the artist, Adeline Ravoux\n      alerted her father, who went to the artist’s room. The hotel owner found the artist\n      lying on his bed, knees drawn to his chest, and moaning in pain. ‘What have you\n      done?’ asked the hotel owner. The artist lifted up his shirt to reveal a small wound in\n 10   his chest. ‘I have tried to kill myself,’ said the artist, whose name was van Gogh.\n\n     ________________ (See question 4.) A global brand, a giant casting its shadow over\n       20th and 21s t century art, Vincent van Gogh’s paintings have a total value stretching\n       into billions of dollars. In 1987, his painting Vase with Fifteen Sunflowers sold for\n 15   $87 million dollars, and seven of his paintings, with an estimated total value of $718\n      million dollars, are featured in a list of the world’s thirty most expensive. Had he\n      lived to see his work’s commercial success, Vincent van Gogh would have be en an\n     enormously rich man. As it was, by the 27 th of July, 1890, he had sold a grand total\n      of one painting, from which he earned 400 francs.\n     Van Gogh’s shooting himself that day was the culmination of two years’ deteriorating\n      mental health. He had always been unstable (In 1880,  his father had considered\n      sending him to a psychiatric hospital.) but from 1888 his psychological well -being\n      had collapsed, a process which began with the end of his friendship with fellow painter\n 25   Paul Gauguin. Depending on which account you believe, van Gogh sliced off all or\n      only part of his own ear, and then attempted to give it to Gauguin as a present. Clearly\n      seriously afflicted, van Gogh was committed to the Saint-Paul Asylum in the village\n      of Saint-Rémy. He was released in May 1890 and went to stay at the hotel in Auvers -\n      sur-Oise but he had not been cured. For the remaining months of his life, van Gogh\n 30   experienced acute hallucinations.\n\n     The nadir of his mental health came, in astonishing contrast, at the peak of his artistic\n      work. In his final seventy days, he entered his most prolific period, creating at least\n      one painting a day, including much of his greatest work. He died on 28 th July, 1890.\n 35  He did not die from his self-inflicted gunshot wound, but from the infection it caused.\n      His final words were ‘The sadness will last forever.’\n", "questions": [{"n": 1, "stem": "What is the BEST TITLE for this article?", "options": ["A Short Biography of Vincent van Gogh", "The Development of van Gogh’s Artistic Technique", "The Final Days of Vincent van Gogh", "Van Gogh’s Life And Work"], "key": 2, "explanation": "the article focuses on van Gogh's final days: his suicide attempt, death, and the context of his mental health and artistic output"}, {"n": 2, "stem": "Van Gogh ______.", "options": ["had a room on the ground floor", "had been at the hotel for over two months", "had come to stay at the hotel that afternoon", "tried to kill himself while in his room"], "key": 1, "explanation": "line 5: \"an artist resident there for the last 70 days\" – over two months"}, {"n": 3, "stem": "Why, PROBABLY, did Adeline Ravoux’s father go to the artist’s room? He and his daughter ______.", "options": ["thought the artist was behaving badly", "wanted to ask the artist to leave", "were worried about the artist", "worried the artist might not pay his bill"], "key": 2, "explanation": "Adeline was concerned for the artist and alerted her father, so they were worried about him"}, {"n": 4, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 12 – 19)?", "options": ["He was not the first artist to have attempted suicide at the Auberge Ravoux.", "Quickly, a doctor was brought to treat the injured man.", "Nowadays, van Gogh’s work is enormously successful.", "Why had such a successful artist tried to kill himself?"], "key": 2, "explanation": "paragraph two contrasts van Gogh's current lack of success with his enormous posthumous fame"}, {"n": 5, "stem": "Paragraph Two (Lines 12 – 19) DOES NOT say that ______.", "options": ["before he died, van Gogh had only sold one painting", "van Gogh died before his work became successful", "van Gogh painted the world’s thirty most expensive paintings", "van Gogh’s work is known all over the world"], "key": 2, "explanation": "the text says seven of his paintings are featured in a list of the world's thirty most expensive – not that he painted all thirty"}, {"n": 6, "stem": "What does the text say about van Gogh and his mental health?", "options": ["If he had been successful, he wouldn’t have had problems.", "It had always been poor but got worse towards the end of his life.", "It had been fine until the end of his friendship with Paul Gauguin.", "The problems he suffered were the result of losing his ear."], "key": 1, "explanation": "line 20-23: \"He had always been unstable... from 1888 his psychological well -being had collapsed\" – always poor, worse at the end"}, {"n": 7, "stem": "When people are afflicted (Line 27), they ______.", "options": ["are criminals", "are dangerous to others", "have artistic talent", "suffer from illness"], "key": 3, "explanation": "afflicted means suffer from illness – van Gogh was seriously afflicted by mental illness"}, {"n": 8, "stem": "Acute hallucinations (Line 30) are probably ______.", "options": ["money problems", "symptoms of mental illness", "valuable artistic ideas", "worries about your own health"], "key": 1, "explanation": "acute hallucinations are symptoms of mental illness, experienced by van Gogh in his final months"}, {"n": 9, "stem": "Something’s nadir (Line 32) is its ______.", "options": ["experience", "lowest point", "recovery", "worsening"], "key": 1, "explanation": "nadir means lowest point – his mental health reached its nadir at the peak of his artistic work"}, {"n": 10, "stem": "When somebody is prolific (Line 33), they ______.", "options": ["are extremely depressed", "cannot relax or calm down", "feel very happy and excited", "produce a lot of something"], "key": 3, "explanation": "prolific means produce a lot – he created at least one painting a day in his final seventy days"}], "vocab": [{"word": "artistic community", "meta": "B2, noun", "meaning": "a group of artists who share ideas", "group": "Text 37", "page": 244}, {"word": "witness", "meta": "B2, verb", "meaning": "to see or observe an event happen", "group": "Text 37", "page": 244}, {"word": "bent double", "meta": "B2, adjective", "meaning": "curved forward at the waist from pain", "group": "Text 37", "page": 244}, {"word": "moan", "meta": "B2, verb", "meaning": "to make low sounds of suffering", "group": "Text 37", "page": 244}, {"word": "commercial success", "meta": "B2, noun · AWL", "meaning": "financial profitability through selling products", "group": "Text 37", "page": 245}, {"word": "grand total", "meta": "B2, noun", "meaning": "the complete or final sum", "group": "Text 37", "page": 245}, {"word": "culmination", "meta": "C1, noun · AWL", "meaning": "the final, highest point reached after a gradual process", "group": "Text 37", "page": 245}, {"word": "deteriorating", "meta": "B2, verb · AWL", "meaning": "gradually worsening", "group": "Text 37", "page": 245}, {"word": "unstable", "meta": "B2, adjective", "meaning": "emotionally or mentally unpredictable", "group": "Text 37", "page": 245}, {"word": "psychiatric", "meta": "B2, adjective", "meaning": "relating to the treatment of mental illness", "group": "Text 37", "page": 245}, {"word": "psychological", "meta": "B2, adjective", "meaning": "relating to mental health and emotional balance", "group": "Text 37", "page": 245}, {"word": "afflicted", "meta": "C1, adjective", "meaning": "suffering from illness or mental distress", "group": "Text 37", "page": 245}, {"word": "acute", "meta": "C1, adjective", "meaning": "intense or severe", "group": "Text 37", "page": 245}, {"word": "hallucinations", "meta": "C1, noun", "meaning": "sensory experiences that are not real", "group": "Text 37", "page": 245}, {"word": "nadir", "meta": "C1, noun", "meaning": "the lowest point", "group": "Text 37", "page": 245}, {"word": "prolific", "meta": "C1, adjective", "meaning": "producing a large amount of work", "group": "Text 37", "page": 245}], "vocabularyPages": [244, 245], "topic": "Van Gogh's Final Days"}, {"id": "reading-38", "unit": 8, "skill": "Reading", "title": "Text 38", "label": "Text 38", "pages": [152, 153], "text": "                                           Text 38\n     Reading\n\n         ________________ (See the appropriate question)               Yakuza\n\n     The Yakuza is amongst the world’s oldest and most powerful\n     organized crime groups.  Annual revenue from its activities,\n     which   include   racketeering,   extortion  and   corporate\n     malfeasance, is estimated at $13 billion dollars. While most\n 5    of its criminal activities are domestic in nature, taking place\n      in Japan, it has established a presence throughout Asia, Australia, Europe and North\n     America, and its membership stands currently at around 80,000, down from a peak\n      of 184,000 in the 1960s. Currently, there are an estimated 3,000 Yakuza gangs based\n      in Japan. Its largest single gang, the Yamaguchi Gumi, is larger than both Mexico’s\n 10  Sinaloa Cartel and the Calabrian 'Ndrangheta, second only to Russian organized\n     crime’s Solntsevskaya Bratva.\n\n     ________________ (See the appropriate question.)  It was at this      Sword\n      time, during Japan’s Edo Period (1603 – 1868), that the Yakuza\n 15  began  its evolution from low-level  street  trash  to global crime\n     conglomerate, developing a structure similar  to the Italian Cosa\n      Nostra. There is a boss of bosses, there are underbosses, and at the\n     bottom there are street soldiers. It was also during the Edo Period that the Yakuza\n     developed the two traditions for which it is famous outside Japan. The first of these\n 20   is finger-cutting: a Yakuza member cuts off one of their own fingers (in Japanese,\n     yubitsume.) This is punishment for any Yakuza who breaks one of the gang’s rules.\n      Originally, this punishment meant that the member lost some of their ability to fight:\n      the fewer fingers you have, the less well you are able to use a sword. An extremely\n      short sharp knife known as a tanto is used. Then there is the second tradition: full-\n 25  body tattoos.\n\n        Punishment Tattoo   Yakuza tattoos have, as their origin, a punishment in Japanese law\n                     during the Edo Period. For serious crimes, the punishment was death,\n                      but for less serious crimes, criminals were given a tattoo. The tattoo\n 30                 (See the image on the left: Punishment Tattoo) identified criminals\n                        in society, marking them out and bringing shame upon them and their\n                      family. However, the tattoos also helped criminals identify each\n      other. It became easier to form gangs with other criminals. Soon, a common feature\n      of criminal gangs was that all the members had tattoos. Over time, tattoos evolved\n 35  from being a punishment to being a requirement for membership of criminal gangs.\n    A kind of art developed: irezumi, the tattooing of Yakuza members.\n\n     Other criminal gangs around the world have tattoos that identify their   Ken Miyazaki\n     members,  for example, those worn by members  of  the international\n 40  criminal  organization MS-13.  This  is  not  true  of Yakuza  tattoos,\n     however. Yakuza tattoos instead denote personal charact eristics which\n      the wearer claims to have or aspires to. They might also refer to past\n      incidents from the wearer’s life. Yakuza tattoos also take a far longer\n     time to apply than those worn by members of other criminal gangs, which\n 45   is because Yakuza tattooists rebuff the use of electronic tattooing devices, instead\n      tattooing by hand, using nothing more than a traditional bamboo brush. But how do\n      the wearers of these tattoos themselves feel? Meet Ken Miyazaki, street punk running\n     with a crew out of Nagoya, who explains the story behind his tattoos.\n", "questions": [{"n": 1, "stem": "MOST PROBABLY, in Line 4, malfeasance is ______.", "options": ["an illegal way of making money", "murdering innocent people", "something not working properly", "starting a business"], "key": 0, "explanation": "corporate malfeasance is listed alongside racketeering and extortion as criminal activities that generate revenue"}, {"n": 2, "stem": "The Yakuza ______.", "options": ["began to operate in the 1960s", "has a gang which is the world’s largest", "has more than 180,000 members", "operates internationally"], "key": 3, "explanation": "the text states the Yakuza has established a presence throughout Asia, Australia, Europe and North America"}, {"n": 3, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 14 – 26)?", "options": ["As said before, the Yakuza was at its peak in the 1960s.", "Famously, the Yakuza began life as great Samurai warriors.", "Historians believe the Yakuza originated in the early 17 th century.", "Russian organized crime is the world’s most violent."], "key": 2, "explanation": "paragraph two discusses the Edo Period (1603 -1868) when the Yakuza began its evolution"}, {"n": 4, "stem": "When a Yakuza member’s finger is or was cut off, it is ______.", "options": ["because that person has done something illegal", "cut off by other Yakuza members", "cut off by that person himself", "cut off using a long Samurai-style sword"], "key": 2, "explanation": "yubitsume is self-mutilation – the member cuts off their own finger as punishment"}, {"n": 5, "stem": "What is the MAIN SUBJECT of Paragraph Three (Lines 28 – 38)?", "options": ["Crimes committed by Yakuza members.", "Japan during the Edo Period.", "The origins of irezumi.", "The Yakuza’s organizational structure."], "key": 2, "explanation": "paragraph three explains how punishment tattoos evolved into irezumi, the tattooing of Yakuza members"}, {"n": 6, "stem": "In the picture entitled Punishment Tattoo, the tattoo the man is wearing was MOST PROBABLY drawn by ______.", "options": ["a member of the man’s family", "a tattoo artist working for the Yakuza", "somebody working for the law in Japan", "the man who is wearing that tattoo himself"], "key": 2, "explanation": "the punishment tattoo was applied by Japanese law as a penalty for less serious crimes"}, {"n": 7, "stem": "Paragraph Four (Lines 40 – 51) DOES NOT say that Yakuza tattoos ______.", "options": ["are made without using the latest tattooing technology", "identify their wearers as members of specific Yakuza groups", "might show things that have happened in the wearer’s life", "often symbolizes what the wearers wants to be like"], "key": 1, "explanation": "paragraph four says Yakuza tattoos denote personal characteristics, not membership of specific groups"}, {"n": 8, "stem": "In Line 47, rebuff is CLOSEST in meaning to ______.", "options": ["cannot afford something", "make use of something", "refuse something", "understand something"], "key": 2, "explanation": "rebuff means refuse – Yakuza tattooists refuse to use electronic tattooing devices"}, {"n": 9, "stem": "What, MOST PROBABLY, is the MAIN SUBJECT of the Paragraph AFTER Paragraph Four (Lines 40 – 51)?", "options": ["The kinds of crimes in which the Yakuza are involved.", "The life of a well-known tattooist who tattoos Yakuza members.", "The reason why a specific Yakuza member chose certain tattoos.", "The tattoos worn by members of other criminal groups around the world."], "key": 2, "explanation": "the final sentence introduces Ken Miyazaki who explains the story behind his tattoos"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Crime in Modern Japan", "How Tattooing Was Invented", "Organised Crime around The World", "The Yakuza and Their Tattoos"], "key": 3, "explanation": "the article focuses on Yakuza history and their distinctive tattooing traditions"}], "vocab": [{"word": "organized crime", "meta": "B2, noun", "meaning": "criminal organisations operating systematically", "group": "Text 38", "page": 245}, {"word": "racketeering", "meta": "C1, noun", "meaning": "illegal business schemes to generate profit", "group": "Text 38", "page": 245}, {"word": "extortion", "meta": "C1, noun", "meaning": "obtaining money through force or threats", "group": "Text 38", "page": 245}, {"word": "malfeasance", "meta": "C1, noun", "meaning": "illegal or unethical conduct", "group": "Text 38", "page": 245}, {"word": "establish a presence", "meta": "B2, verb", "meaning": "to successfully set up operations in a region", "group": "Text 38", "page": 245}, {"word": "conglomerate", "meta": "C1, noun", "meaning": "a large, powerful organisation made of diverse parts", "group": "Text 38", "page": 245}, {"word": "structure", "meta": "B2, noun · AWL", "meaning": "the organisational arrangement of something", "group": "Text 38", "page": 245}, {"word": "underbosses", "meta": "C1, noun", "meaning": "second-in-command leaders in a criminal hierarchy", "group": "Text 38", "page": 245}, {"word": "punishment", "meta": "B2, noun", "meaning": "a penalty for breaking rules", "group": "Text 38", "page": 245}, {"word": "full-body tattoos", "meta": "B2, noun", "meaning": "tattoos that cover large portions of the body", "group": "Text 38", "page": 245}, {"word": "mark out", "meta": "C1, verb", "meaning": "to distinguish or separate from others", "group": "Text 38", "page": 245}, {"word": "bring shame upon", "meta": "B2, verb", "meaning": "to cause dishonour for someone or their family", "group": "Text 38", "page": 245}, {"word": "requirement", "meta": "B2, noun · AWL", "meaning": "a necessary condition that must be met", "group": "Text 38", "page": 245}, {"word": "denote", "meta": "C1, verb", "meaning": "to symbolise or indicate something", "group": "Text 38", "page": 245}, {"word": "aspire", "meta": "B2, verb", "meaning": "to desire or aim to achieve a particular quality", "group": "Text 38", "page": 245}, {"word": "rebuff", "meta": "C1, verb", "meaning": "to refuse or reject something", "group": "Text 38", "page": 245}], "vocabularyPages": [245], "topic": "The Yakuza"}, {"id": "reading-39", "unit": 8, "skill": "Reading", "title": "Text 39", "label": "Text 39", "pages": [155, 156], "text": "                                                      Text 39\n     Reading\n\n\n                     ____________ (See the appropriate question.)\n\n      Historically, for white people of European background or origin, their shade of skin\n     has always been a key indicator of socioeconomic status. Assumptions have always\n     been made over someone’s level of wealth or position in society according to whether\n      they have suntanned or pale skin. In pre-industrialised Britain, for example, working\n 5    in agriculture on farms was the job most commonly done by p oor people, so having\n     tanned skin implied low status. It suggested they were poor, and had to spend their\n     days toiling outside under a hot sun. Conversely, having pale skin implied high\n      status: it suggested enough money and wealth to be able to avoid farm work. Indeed,\n      so attractive was pale skin considered that people went to extreme lengt hs to achieve\n 10   it: in Elizabethan England (1558–1603), some painted their skin with a mixture of\n     vinegar and white lead (the chemical compound 2PbCO₃·Pb(OH)). This made their\n      skin pale, but it was highly and often fatally toxic. In Italy in the 17 th century, Aqua\n     Tofana (literally, tofana water) was a popular cosmetic used to achieve pale skin: its\n     key ingredient was the poison arsenic. There were around 600 fatalities before its\n 15  use was banned.\n\n     ____________  (See  the  appropriate  question.)  Having  pale  skin came  to  be\n      associated with poverty, while having tanned skin became associated with wealth and\n      leisure. There are two main reasons why this change took place.\n\n 20   Firstly, the Industrial Revolution changed the nature of the work that poor people\n      did. As Britain became an industrialised rather than an agricultural society, work\n      (especially for the poor) shifted indoors. Factories, mines and offices developed, and\n      the rural poor became the urban poor. Under these conditions, having pale skin\n     implied being unable to spend time outdoors, and having little leisure time. Having\n 25  tanned skin implied leisure time, being able to be outdoors. As an indicator of\n     socioeconomic  status,  being  suntanned  suggested  wealth,  leisure  time,  and  a\n      privileged social position. Secondly, while there was increasing recognition of the\n      potential health impact of having pale skin, including conditions such as rickets and\n      a lack  of vitamin D, suntanning came  to be seen  as  a  potential treatment  for\n 30  conditions such as tuberculosis and the skin ulcers caused by lupus vulgaris. Finally,\n      in 1929, French style icon, perfume manuf acturer and (later) Nazi collaborator, Coco\n     Chanel, declared “A girl simply has to be tanned,” and that was it: suntans were in,\n      pale skin was out.\n\n 35  The popularity of suntans did not wane until the 21s t century. As recently as the year\n     2000, as many as 50% of Britons declared that getting a suntan was the main reason\n      they went on foreign holidays. However, in recent years, scientific studies have\n      clearly attributed an exponential rise in melanomal and non -melanomal skin cancers\n      to increased exposure to UV radiation, and consequently suntanning has become less\n 40  popular. Indoor tanning devices that emit ultraviolet radiation to produce artificial\n      tans have been banned for use by those under 18, as they are a causal fac tor in skin\n      cancers. They have also been mocked as “cancer beds” that turn skin a bright shade\n      of orange. Sunblock creams that protect your skin from UV radiation are increasingly\n      popular.\n", "questions": [{"n": 1, "stem": "In Line 2, socioeconomic status is ______.", "options": ["a model made from stone of a rich person", "how healthy your skin is considered to be", "what country you come from", "your social and economic position in society"], "key": 3, "explanation": "socioeconomic status refers to your social and economic position in society"}, {"n": 2, "stem": "What does It (Line 6) refer to?", "options": ["having tanned skin", "low status", "the job", "the job most commonly done by poor people"], "key": 0, "explanation": "\"having tanned skin implied low status\" – It refers to having tanned skin"}, {"n": 3, "stem": "The MAIN PROBLEM with the methods of whitening skin described in Paragraph One (Lines 1 – 15) was that they ______.", "options": ["could potentially kill you", "did not work effectively", "were only for rich people", "were only on sale in England"], "key": 0, "explanation": "vinegar and white lead were toxic; Aqua Tofana contained arsenic and caused 600 fatalities"}, {"n": 4, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 17 – 19)?", "options": ["Aqua Tofana was popular in the Italian regions of Naples and Rome.", "Dental work was also to become vitally important.", "In the 19th and 20th centuries, these perceptions reversed.", "The result of these fatalities was as follows."], "key": 2, "explanation": "paragraph two states that perceptions reversed – pale skin became associated with poverty, tanned skin with wealth"}, {"n": 5, "stem": "What is the MAIN SUBJECT of Paragraph Three (Lines 20 – 33)?", "options": ["Reasons why pale skin became unpopular and tanned skin popular.", "Ricketts, tuberculosis, vitamin D deficiency and other health conditions.", "The main social impacts of the Industrial Revolution in the 19th century.", "Why Britain became an industrialised rather than agricultural society."], "key": 0, "explanation": "paragraph three gives two main reasons why pale skin became unpopular and tanned skin popular"}, {"n": 6, "stem": "Paragraph Three (Lines 20 – 33) DOES NOT STATE or IMPLY that ______.", "options": ["Coco Chanel was a healthcare professional who studied skin", "having pale skin had become unfashionable by the end of the 1920s", "in industrialised Britain, poor people were more likely to work indoors", "pale skin is associated with a lack of certain vitamins"], "key": 0, "explanation": "Coco Chanel was a fashion icon and perfume manufacturer, not a healthcare professional"}, {"n": 7, "stem": "When something wanes (Line 35), it becomes ______.", "options": ["easier", "poorer", "stranger", "weaker"], "key": 3, "explanation": "when popularity wanes, it becomes weaker or declines"}, {"n": 8, "stem": "Paragraph Four (Lines 35 – 44) suggests suntanning has become less popular because ______.", "options": ["foreign holidays are become more expensive", "foreign travel is connected to climate change", "it is connected to serious health conditions", "people can use indoor tanning devices instead"], "key": 2, "explanation": "scientific studies linked suntanning to increased skin cancer rates"}, {"n": 9, "stem": "What does They in Line 42 refer to?", "options": ["artificial tans", "Indoor tanning devices", "skin cancers", "those under 18"], "key": 1, "explanation": "indoor tanning devices are mocked as \"cancer beds\" and banned for under -18s"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Changing Attitudes Towards Pale or Tanned Skin", "Dangers of Trying to Change Your Skin Colour", "Various Causes of Serious Skin Diseases and Death", "Why a Suntan is Better Than Having Pale Skin"], "key": 0, "explanation": "the article traces how attitudes towards pale and tanned skin have reversed over centuries"}], "vocab": [{"word": "indicator", "meta": "B2, noun · AWL", "meaning": "an important sign that reveals something", "group": "Text 39", "page": 245}, {"word": "socioeconomic", "meta": "C1, adjective", "meaning": "relating to social and economic position", "group": "Text 39", "page": 245}, {"word": "suntanned", "meta": "B2, adjective", "meaning": "having skin darkened from sun exposure", "group": "Text 39", "page": 245}, {"word": "pale skin", "meta": "B2, noun", "meaning": "light-coloured or fair skin", "group": "Text 39", "page": 245}, {"word": "toil", "meta": "B2, verb", "meaning": "to work very hard, doing physical labour", "group": "Text 39", "page": 245}, {"word": "conversely", "meta": "B2, adverb · AWL", "meaning": "used to introduce a contrasting statement", "group": "Text 39", "page": 245}, {"word": "extreme lengths", "meta": "C1, noun", "meaning": "drastic actions to achieve a result", "group": "Text 39", "page": 245}, {"word": "fatally toxic", "meta": "C1, adjective", "meaning": "extremely poisonous causing death", "group": "Text 39", "page": 245}, {"word": "associated with", "meta": "B2, verb · AWL", "meaning": "connected in people's minds with an idea", "group": "Text 39", "page": 246}, {"word": "leisure", "meta": "B2, noun", "meaning": "free time to relax or do enjoyable activities", "group": "Text 39", "page": 246}, {"word": "shift indoors", "meta": "B2, verb", "meaning": "to move from outside to inside locations", "group": "Text 39", "page": 246}, {"word": "rural poor", "meta": "B2, noun", "meaning": "poor people living in the countryside", "group": "Text 39", "page": 246}, {"word": "urban poor", "meta": "B2, noun", "meaning": "poor people living in cities", "group": "Text 39", "page": 246}, {"word": "rickets", "meta": "C1, noun", "meaning": "a bone disease caused by vitamin D deficiency", "group": "Text 39", "page": 246}, {"word": "tuberculosis", "meta": "B2, noun", "meaning": "a serious infectious bacterial disease", "group": "Text 39", "page": 246}, {"word": "style icon", "meta": "B2, noun", "meaning": "a person recognised as a trendsetter in fashion", "group": "Text 39", "page": 246}, {"word": "collaborator", "meta": "C1, noun", "meaning": "a person who cooperates, often with an enemy", "group": "Text 39", "page": 246}, {"word": "wane", "meta": "B2, verb", "meaning": "to decrease or become weaker", "group": "Text 39", "page": 246}, {"word": "exponential", "meta": "C1, adjective · AWL", "meaning": "an extremely rapid increase", "group": "Text 39", "page": 246}], "vocabularyPages": [245, 246], "topic": "Skin Colour and Suntans"}, {"id": "reading-40", "unit": 8, "skill": "Reading", "title": "Text 40", "label": "Text 40", "pages": [158, 159], "text": "                                         Text 40\n     Reading\n\n\n                         ________________ (See question 1.)\n\n     As of 2016, there are only four countries in the world in which nobody pays tax,\n       these being the United Arab Emirates, Bermuda, Andorra and Monaco. Everywhere\n        else, governments rely on taxation to generate revenue. It is how essential public\n       services like schools, roads and the police are funded. The United Kingdom (UK)\n 5      is no exception to this, and the government’s revenue is raised through three main\n       taxes. These are Value Added Tax (VAT), Income Tax and Capital Gains Tax (CGT).\n      There are also National Insurance Contributions (NICs), which, while technically\n       not a tax, operate in a similar way. In the UK, tax years last from 6 th April to 5th\n       April of the following year.\n      Value Added Tax (VAT) is levied whenever a product or service is sold. At present,\n    VAT is paid by all consumers at a flat rate of 20%, having been raised from 17.5%\n      on January 5th 2011. For example, when a car is sold for £10,000, VAT is levied at\n      20%, meaning the final price for the consumer is £12,000. VAT must be paid on all\n 15   goods and services sold, with the exceptions of food, drink, animals, animal food,\n       plants and seeds, which are exempt. For the tax year 2016 – 2017,  it is predicted\n        that £120.4 billion will be raised through VAT.\n\n      ________________ (See question 6.) It is taken from their monthly salary. For the\n 20    tax year 2016 – 2017, there is something called a minimum threshold of £11,000 per\n       year, which means that nobody pays Income Tax on the first £11,000 they earn each\n       year. For the tax year 2016 – 2017, Income Tax is paid only on earnings above this\n        level, with earnings from £11,000 to £32,000 per year taxed at the Basic Rate of\n      20%, and earnings above £32,000 per year taxed at the Higher Rate of 40%. For the\n 25    tax year 2016 – 2017, it is predicted that £155 billion will be raised through Income\n      Tax.\n\n       Capital Gains Tax (CGT) is a tax on profits made when an asset (for example, a\n       house, a painting or a car) that has increased in value is sold. It is only the profit,\n 30    the difference between the original purchase price and the price at which the asset\n         is sold, on which CGT is paid. In other words, it is the gain made that is taxed and\n       not the amount that is received. In addition, each individual has a yearly tax -free\n      allowance for CGT. This means that, in the current tax year, no CGT is paid on the\n        first £11,100 of profit made. It is only profit above this level on which CGT is paid.\n 35   The current rate of CGT is 10%. Profits from the sale of your main home are exempt\n      from CGT.  For the tax year 2016 – 2017, it is predicted that CGT will raise £6.8\n        billion.\n\n       National Insurance Contributions (NICs), while technically not a tax , are still an\n 40   important source of government revenue. They are payable by anyone earning more\n       than £155 per week. The amount paid in NICs is 12% of earnings above that weekly\n        limit. In return for payments of NICs, employees become entitled to certain stat e\n       benefits,  for example, Unemployment  Benefit  should  they  lose  their  job.  In\n       addition, provided  that 35 complete years of NICs have been paid, the payer\n 45   becomes entitled to a full state pension on reaching retirement age. For the tax year\n      2016 – 2017, it is predicted that NICs will raise £106 billion.\n", "questions": [{"n": 1, "stem": "What is the BEST TITLE for this article?", "options": ["How Tax Money In The UK Is Spent", "The Main Taxes In The UK", "The History Of Tax In The UK", "The UK: One Of The Few Countries With Tax"], "key": 1, "explanation": "the article describes VAT, Income Tax, Capital Gains Tax, and National Insurance Contributions"}, {"n": 2, "stem": "What is the MAIN SUBJECT of Paragraph One (Lines 1 – 9)?", "options": ["Countries that don’t have tax.", "The difference between NIC and tax.", "The UK’s main taxes.", "What tax is used for."], "key": 3, "explanation": "paragraph one explains that taxation funds essential public services like schools, roads and police"}, {"n": 3, "stem": "When you levy something (Line 11), you ______.", "options": ["buy a product or service", "give something for free", "make people pay money", "leave something"], "key": 2, "explanation": "to levy a tax means to make people pay money"}, {"n": 4, "stem": "What does which in Line 16 refer to?", "options": ["animal feeds, plants and seeds", "food, drink, animals, animal food, plants and seeds", "plants and seeds", "seeds"], "key": 1, "explanation": "the text lists \"food, drink, animals, animal food, plants and seeds\" as exempt from VAT"}, {"n": 5, "stem": "Who will pay VAT?", "options": ["A doctor buying some meat in the supermarket.", "A farmer buying food for his animals.", "A student buying a bottle of water.", "A teacher buying a new computer."], "key": 3, "explanation": "a computer is not exempt from VAT; food, animal food, and water are exempt"}, {"n": 6, "stem": "What is the BEST sentence to BEGIN Paragraph Three (Lines 19 – 26)?", "options": ["Income Tax is a tax on an individual’s earnings from employment.", "So what will this huge amount of money be used for?", "There are a number of effective ways of avoiding paying VAT.", "Where can you get funds from if all your money goes in VAT?"], "key": 0, "explanation": "paragraph three explains Income Tax on earnings from employment"}, {"n": 7, "stem": "If an employee in the UK earns £10,000 a year in the tax year 2016-17, they will pay ______.", "options": ["£2,000 in Income Tax", "£4,000 in Income Tax", "17.5% of their yearly salary", "only VAT"], "key": 3, "explanation": "the threshold is £11,000, so someone earning £10,000 pays no Income Tax, only VAT on purchases"}, {"n": 8, "stem": "If I buy a painting for £50,000, and then sell it for £111,100 in the tax year 2016 – 2017, how much CGT will I pay? I will sell nothing else this tax year.", "options": ["£0", "£5,000", "£10,000", "£11,110"], "key": 1, "explanation": "profit £61,100 minus £11,100 allowance = £50,000 taxable at 10% = £5,000"}, {"n": 9, "stem": "In Lines 16 and 35, if something is exempt, it means ______.", "options": ["it is included in the higher rate of tax", "it cannot be sold", "it is taken from you and given to the government", "no tax needs to be paid on it"], "key": 3, "explanation": "exempt means no tax needs to be paid on that item or profit"}, {"n": 10, "stem": "Which tax PROBABLY makes most money for the government?", "options": ["CGT.", "Income Tax.", "NICs.", "VAT."], "key": 1, "explanation": "Income Tax is predicted to raise £155 billion, more than VAT, NICs, or CGT"}], "vocab": [{"word": "taxation", "meta": "B2, noun", "meaning": "the system by which a government collects money", "group": "Text 40", "page": 246}, {"word": "generate revenue", "meta": "B2, verb · AWL", "meaning": "to produce income for a government", "group": "Text 40", "page": 246}, {"word": "essential public services", "meta": "B2, noun", "meaning": "basic government-provided services", "group": "Text 40", "page": 246}, {"word": "Value Added Tax", "meta": "VAT · B2, noun", "meaning": "a tax added to the price of goods and services", "group": "Text 40", "page": 246}, {"word": "Income Tax", "meta": "B2, noun", "meaning": "a tax paid on money earned", "group": "Text 40", "page": 246}, {"word": "Capital Gains Tax", "meta": "C1, noun", "meaning": "a tax on profit made when selling an asset", "group": "Text 40", "page": 246}, {"word": "levy", "meta": "C1, verb", "meaning": "to impose or charge a tax", "group": "Text 40", "page": 246}, {"word": "flat rate", "meta": "B2, noun", "meaning": "a fixed percentage that applies to all cases", "group": "Text 40", "page": 246}, {"word": "exempt", "meta": "B2, adjective", "meaning": "officially freed from a requirement", "group": "Text 40", "page": 246}, {"word": "threshold", "meta": "B2, noun · AWL", "meaning": "the level at which something begins", "group": "Text 40", "page": 246}, {"word": "Basic Rate", "meta": "B2, noun", "meaning": "the standard lower percentage of tax", "group": "Text 40", "page": 246}, {"word": "Higher Rate", "meta": "B2, noun", "meaning": "an increased percentage of tax", "group": "Text 40", "page": 246}, {"word": "assets", "meta": "B2, noun · AWL", "meaning": "items of value owned by an individual", "group": "Text 40", "page": 246}, {"word": "increase in value", "meta": "B2, verb", "meaning": "to become worth more money over time", "group": "Text 40", "page": 246}, {"word": "gain", "meta": "B2, noun · AWL", "meaning": "the profit made when selling an asset", "group": "Text 40", "page": 246}, {"word": "tax-free allowance", "meta": "B2, noun", "meaning": "an amount that can be earned without paying tax", "group": "Text 40", "page": 246}, {"word": "entitled to", "meta": "B2, adjective · AWL", "meaning": "having the right to receive something", "group": "Text 40", "page": 246}, {"word": "state benefits", "meta": "B2, noun", "meaning": "financial support from the government", "group": "Text 40", "page": 246}, {"word": "Unemployment Benefit", "meta": "B2, noun", "meaning": "financial assistance paid to people who have lost their job", "group": "Text 40", "page": 246}, {"word": "state pension", "meta": "B2, noun", "meaning": "regular income paid by the government after retirement", "group": "Text 40", "page": 246}], "vocabularyPages": [246], "topic": "UK Taxation"}, {"id": "reading-41", "unit": 8, "skill": "Reading", "title": "Text 41", "label": "Text 41", "pages": [160, 161], "text": "                                         Text 41     Reading\n\n         ________________ (See the appropriate question.)\n\n     Mount Vesuvius is mainland Europe’s last remaining active\n      volcano. Located on Italy’s west coast,  it has experienced\n      eight major eruptions in the last 17,000 years, the most recent\n      being in 1944, when  it disrupted the Allied invasion of Naples and Southern Italy,\n 5    smothering Allied soldiers with heavy smoke and thick volcanic dust. Now it towers\n      over the city of Naples, which  sits just 8 kilometres from  its crater, a constant\n     reminder to Naples’ 3 million inhabitants of nature’s savage anger. It is the world’s\n     most dangerous volcano, and another eruption is predicted soon. Its most famous\n      eruption occurred almost 2,100 years ago, when it utterly destroyed the Roman city\n 10   of Pompeii.\n\n     ________________  (See   the  appropriate   question.)  The\n     farmland around the town was rich and fertile, and its farmers\n     had become rich from the export of cereal and barley. The city\n 15   itself was rich in architecture, which included an aqueduct that\n     brought a steady supply of fresh water from the surrounding\n       hills, fountains, public baths, and an amphitheatre. It had become\n      a resort town for rich inhabitants of Rome, who kept holiday villas there to escape\n      the heat and bustle of Rome. There was even a restaurant and a 1,000 -square metre\n 20   hotel. There was very little poverty in Pompeii.\n\n      This idyllic state came to an abrupt end sometime in the early afternoon of 24 th\n     August, 79 BCE, when Pompeii was destroyed in the eruption of Mount Vesuvius.\n     The city was covered by a thick layer of volcanic ash. It was to lie undisturbed for\n 25   the next 1,800 years.\n\n     Then, in 1738, Maria Amalia Christine, a German aristocrat, married King Charles\n      of Bourbon, the King of Naples. The new queen was fascinated by ancient Rome and\n        its architecture, and had heard of the lost city of Pompeii. Persuaded by his wife,\n 30   the King sent a team of engineers and labourers to excavate the site where Pompeii\n     was known to be located. For months, the team dug through over 18 metres of\n      volcanic rock to reach the city lost beneath. And they made another discovery: there\n     were voids  in  the rock where people had been. Their remains had been burnt\n      completely, turned to dust, leaving nothing but empty space. By pouring plaster into\n 35   these voids, the engineers were able to produce exact models of those who had died,\n      accurate to the folds in  their togas, the straps of  their sandals and their facial\n      expressions at the moment of death. These are amongst the most famous sights to\n      see at Pompeii.\n\n 40  Yet the newly-excavated city of Pompeii was also a treasure trove of priceless\n      historical artefacts, providing a glimpse of Roman  life that had been frozen for\n      millennia: Pompeii was almost exactly  as  it had been 2,000 years  before.  Its\n      buildings were undamaged and everyday objects and household goods littered the\n       streets. Later, archaeologists found perfectly preserved jars of fruit and vegetables,\n 45  and even loaves of bread!\n\n     The news of Pompeii’s rediscovery spread. It quickly became one of the most popular\n      tourists sites in Europe, a position  it has enjoyed to the present day. Nowadays,  it\n      has the status of a UNESCO World Heritage Site, and is visited by approximately\n 50   2.5 million visitors per year.\n", "questions": [{"n": 1, "stem": "What is the BEST TITLE for this article?", "options": ["Mount Vesuvius", "Pompeii", "The Romans", "Volcanoes"], "key": 1, "explanation": "the article focuses on Pompeii's destruction by Mount Vesuvius and its rediscovery"}, {"n": 2, "stem": "What does it (Line 2) refer to?", "options": ["Europe", "Italy’s west coast", "mainland Europe", "Mount Vesuvius"], "key": 3, "explanation": "Mount Vesuvius is mainland Europe's last remaining active volcano"}, {"n": 3, "stem": "In Line 4, to smother somebody means to ______.", "options": ["burn them very badly", "fight them", "stop them breathing", "treat them like they are your son"], "key": 2, "explanation": "to smother means to stop breathing, as soldiers were covered by smoke and dust"}, {"n": 4, "stem": "We can INFER that ______.", "options": ["Mount Vesuvius is a risk to the city of Naples", "Naples has never experienced a volcanic eruption", "Naples is built in the crater of a volcano", "people in Naples are proud to live near a volcano"], "key": 0, "explanation": "Mount Vesuvius towers over Naples and is the world's most dangerous volcano"}, {"n": 5, "stem": "What is the BEST sentence to BEGIN Paragraph Two (Lines 11 – 17)", "options": ["People from Pompeii had a horrible standard of living.", "Prior to its destruction, Pompeii had been wealthy.", "The next eruption took place 500 years later.", "Yet the area is now more famous for its agriculture."], "key": 1, "explanation": "paragraph two describes Pompeii's wealth, fertile farmland, and rich architecture"}, {"n": 6, "stem": "Which picture shows an aqueduct (Line 13)? Choose the picture labelled A, B, C or D on the original page.", "options": ["Picture A", "Picture B", "Picture C", "Picture D"], "key": 1, "explanation": "an aqueduct is a bridge-like structure carrying fresh water from hills to the city", "picture": true}, {"n": 7, "stem": "What is the MAIN SUBJECT of Paragraph Four (Lines 24 – 35)?", "options": ["Maria Amalia Christine and King Charles of Bourbon.", "The accidental rediscovery of Pompeii.", "The excavation of Pompeii.", "The search for Pompeii."], "key": 2, "explanation": "paragraph four describes the excavation team digging through volcanic rock and making plaster casts"}, {"n": 8, "stem": "King Charles of Bourbon sent a team to Pompeii because ______.", "options": ["his wife was very interested in ancient Rome", "he wanted to know if the city had been real", "he wanted to live like a Roman emperor", "there was a need to create somewhere for tourists to visit"], "key": 0, "explanation": "Queen Maria Amalia Christine was fascinated by ancient Rome and persuaded the King"}, {"n": 9, "stem": "A void (Line 30) is ______.", "options": ["a dead person", "a place where we put dead people", "a way of getting round something", "an empty space"], "key": 3, "explanation": "a void is an empty space where bodies had completely burned away"}, {"n": 10, "stem": "What is the MAIN SUBJECT of Paragraph Five (Lines 37 – 42)?", "options": ["Pompeii’s great historical value.", "The diet of those who lives in Pompeii.", "The money made from Pompeii.", "The tragedy of Pompeii."], "key": 0, "explanation": "paragraph five describes Pompeii as a treasure trove of priceless historical artefacts"}], "vocab": [{"word": "active volcano", "meta": "B2, noun", "meaning": "a volcano expected to erupt again", "group": "Text 41", "page": 246}, {"word": "major eruptions", "meta": "B2, noun", "meaning": "large volcanic explosions", "group": "Text 41", "page": 246}, {"word": "disrupt", "meta": "B2, verb · AWL", "meaning": "to interrupt or prevent something from continuing", "group": "Text 41", "page": 246}, {"word": "smother", "meta": "C1, verb", "meaning": "to cover completely", "group": "Text 41", "page": 246}, {"word": "crater", "meta": "B2, noun", "meaning": "the bowl-shaped hole at the top of a volcano", "group": "Text 41", "page": 246}, {"word": "savage anger", "meta": "C1, noun", "meaning": "violent and uncontrollable destructive force", "group": "Text 41", "page": 246}, {"word": "fertile", "meta": "B2, adjective", "meaning": "capable of producing abundant crops", "group": "Text 41", "page": 247}, {"word": "aqueduct", "meta": "C1, noun", "meaning": "a man-made channel to transport water", "group": "Text 41", "page": 247}, {"word": "amphitheatre", "meta": "B2, noun", "meaning": "an open-air venue with rising seating", "group": "Text 41", "page": 247}, {"word": "resort town", "meta": "B2, noun", "meaning": "a town that attracts visitors for holidays", "group": "Text 41", "page": 247}, {"word": "idyllic state", "meta": "C1, noun", "meaning": "a peaceful and perfect condition", "group": "Text 41", "page": 247}, {"word": "come to an abrupt end", "meta": "B2, verb", "meaning": "to stop suddenly and unexpectedly", "group": "Text 41", "page": 247}, {"word": "volcanic ash", "meta": "B2, noun", "meaning": "fine particles ejected during a volcanic eruption", "group": "Text 41", "page": 247}, {"word": "aristocrat", "meta": "C1, noun", "meaning": "a person belonging to the highest social class", "group": "Text 41", "page": 247}, {"word": "excavate", "meta": "B2, verb · AWL", "meaning": "to dig out to uncover buried remains", "group": "Text 41", "page": 247}, {"word": "voids", "meta": "C1, noun", "meaning": "empty spaces within a solid mass", "group": "Text 41", "page": 247}, {"word": "pour plaster", "meta": "B2, verb", "meaning": "to fill a cavity with a cement-like material", "group": "Text 41", "page": 247}, {"word": "treasure trove", "meta": "C1, noun", "meaning": "a rich collection of valuable items", "group": "Text 41", "page": 247}, {"word": "priceless artefacts", "meta": "B2, noun", "meaning": "extremely valuable ancient objects", "group": "Text 41", "page": 247}, {"word": "litter the streets", "meta": "B2, verb", "meaning": "to cover or scatter over the ground", "group": "Text 41", "page": 247}], "vocabularyPages": [246, 247], "topic": "Pompeii"}, {"id": "reading-42", "unit": 8, "skill": "Reading", "title": "Text 42", "label": "Text 42", "pages": [163, 164], "text": "                                                      Text 42\n     Reading\n\n\n          ________________ (See the appropriate question.)              The Mona Lisa\n\n     Her enigmatic smile has puzzled us through the centuries. What\n      she’s smiling about, whether  in happiness or melancholy,  is\n     something  we’ll  never  know,  but we  can  be  sure  of  the\n      following: the Mona Lisa  is by far the world’s most famous\n 5    painting. Instantly recognizable as the work of Leonardo da\n      Vinci, this, and his other great works, Lady with an Ermine, the\n      Last Supper, the Vitruvian Man, are some of the reasons why\n       this son of Renaissance Florence  is history’s greatest  artist.\n 10  However, it is not only for his art that da Vinci is famous: this\n      visionary polymath and military engineer is also credited with having envisaged the\n      tank, the helicopter and the airplane.\n\n     Born 15 April 1452 in or near the Tuscan hill town of Vinci, Leonardo di ser Piero\n 15  da Vinci was the child of Piero di Antonio da Vinci, a well -to-do Florentine lawyer,\n     and Caterina Buti del Vacca, a woman from the peasantry. Leonardo was born out\n      of wedlock: both his parents were to marry separately the year after his birth, his\n     mother to local artisan Antonio di Piero Buti del Vacca, while his father went on to\n     marry four times. Eventually, Leonardo was to have 12 half -siblings, the youngest\n 20   of whom was born when he was 40, and with whom he had very little contact.\n\n     ________________ (See the appropriate question.) What stories exist are largely\n     apocryphal. What  is known for certain  is that, at the age of fourteen, Leonardo\n     moved  to Florence  (to be  apprenticed  to Andrea  del  Verrocchio,  the  leading\n 25   Florentine painter and sculptor of his time). Florence was the birthplace of the\n      Renaissance, the fervent period of European cultural, artistic, political and economic\n      rebirth following the Middle Ages, with which Leonardo will forever be associated.\n     Amongst  his  contemporaries  were  other  great  Renaissance  artists,  Botticelli,\n      Ghirlandaio, Perugino and  Michelangelo. Under  their  influence, and from  his\n 30   training in Andrea del Verrocchio’s workshop, Leonardo developed a wide range of\n      technical and artistic skills, including drafting, metallurgy, metal working, drawing,\n      painting, sculpting, and modelling. He also came to the attention of the House of\n     Medici, the banking dynasty that had become the de facto rulers of Florence. In\n      addition to commissioning Leonardo for various artworks, they exposed him to the\n 35  Humanist philosophy  of  the Renaissance, which was  to have  a profound and\n      formative influence on his work.\n\n     Only four works attributed to Leonardo are of unquestioned authenticity, one of\n     which is a portrait of a Florentine woman called Lisa del Giocondo. She was of the\n 40   Florentine Gheradini family, and married to silk merchant Francesco del Giocondo.\n        It is believed that Leonardo was commissioned for the painting to celebrate the birth\n      of their second son, Andrea.  It would have decorated their home. The painting,\n     however, was never in the ownership of the Giocondo family: Leonardo began the\n      painting in October 1503, and was still working on it at the time of his death in 1519.\n 45  On his death, the painting was acquired by King Francis I of France. It now sits in\n      the Louvre, where, in pre-covid days,  it was seen by about 8,160,000 people per\n      year. In Italian, the painting is called La Gioconda. In French, La Joconde.  It is\n     known differently in English. There are many reasons why the painting is the world’s\n     most famous, one of which is this: you just can’t figure out what mood she’s in.\n", "questions": [{"n": 1, "stem": "When something is enigmatic (Line 1), it is ______.", "options": ["friendly", "mysterious", "visible", "worrying"], "key": 1, "explanation": "enigmatic means mysterious – her smile has puzzled people for centuries"}, {"n": 2, "stem": "Paragraph One (Lines 1 – 12) DOES NOT STATE or IMPLY that Leonardo ______.", "options": ["had a parent called Renaissance Florence", "is the greatest artist to have ever lived", "predicted inventions of the 20th century", "provided technical help to soldiers"], "key": 0, "explanation": "Renaissance Florence is a time and place, not a parent – the phrase is figurative"}, {"n": 3, "stem": "If somebody is born out of wedlock (Lines 16 - 17), ______.", "options": ["one or other parent’s names are unknown", "their parents are not married", "they are born in the countryside", "they are the first child in their family"], "key": 1, "explanation": "born out of wedlock means parents are not married at the time of birth"}, {"n": 4, "stem": "What is the BEST sentence to BEGIN Paragraph Three (Lines 22 – 36)?", "options": ["At that age, he had no time to spend with very young children.", "It was clear from an early age that Leonardo had great artistic talent.", "Little more is known for certain of Leonardo’s early life.", "The Tuscan city of Florence is one of the world’s greatest."], "key": 2, "explanation": "paragraph three states that what stories exist are largely apocryphal – little is known for certain"}, {"n": 5, "stem": "In Line 23, if something is apocryphal, it is ______.", "options": ["based on evidence or facts", "not very interesting", "probably made up or invented", "translated from another language"], "key": 2, "explanation": "apocryphal means probably made up or invented, not based on fact"}, {"n": 6, "stem": "What does which in Line 27 refer to?", "options": ["Florence", "the birthplace of the Renaissance", "the Middle Ages", "the Renaissance"], "key": 3, "explanation": "\"the Renaissance with which Leonardo will forever be associated\" – which refers to the Renaissance"}, {"n": 7, "stem": "We can INFER that the House of Medici _______.", "options": ["was a very large building", "were a group of artists", "were extremely rich", "were the kings of Italy"], "key": 2, "explanation": "the House of Medici was a banking dynasty and de facto rulers of Florence, implying great wealth"}, {"n": 8, "stem": "What is the MAIN SUBJECT of Paragraph Four (Lines 38 – 49)?", "options": ["Four of Leonardo’s paintings.", "Leonardo from 1503 to 1519.", "Lisa del Giocondo.", "The Mona Lisa."], "key": 3, "explanation": "paragraph four focuses on the portrait of Lisa del Giocondo – the Mona Lisa"}, {"n": 9, "stem": "The famous painting described in Paragraph Four (Lines 38 – 49) ______.", "options": ["is kept in the King of France’s private royal palace", "is not the Mona Lisa", "was kept at the home of Francesco del Giocondo", "was never completely finished"], "key": 3, "explanation": "Leonardo was still working on the painting at the time of his death in 1519"}, {"n": 10, "stem": "What is the BEST TITLE for this article?", "options": ["Florence in the Renaissance", "Great Artists of the Renaissance", "Leonardo and the Mona Lisa", "The History of the Mona Lisa"], "key": 2, "explanation": "the article covers Leonardo's life and work, with particular focus on the Mona Lisa"}], "vocab": [{"word": "enigmatic", "meta": "C1, adjective", "meaning": "mysterious and difficult to interpret", "group": "Text 42", "page": 247}, {"word": "melancholy", "meta": "B2, noun", "meaning": "deep, persistent sadness", "group": "Text 42", "pa
